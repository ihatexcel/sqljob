name: Auto-merge claude/* → claude/dev

on:
  push:
    branches:
      - 'claude/**'
      - '!claude/dev'

permissions:
  contents: write

concurrency:
  group: auto-merge-claude-dev
  cancel-in-progress: false

jobs:
  merge-to-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch source branch
        run: git fetch origin ${{ github.ref_name }}

      - name: Merge into claude/dev
        run: |
          git merge --no-ff origin/${{ github.ref_name }} \
            -X theirs \
            -m "auto-merge: ${{ github.ref_name }} → claude/dev"

      - name: Push claude/dev
        run: |
          for i in 1 2 3 4; do
            git pull --rebase origin claude/dev && git push origin claude/dev && break
            echo "Push attempt $i failed, retrying in ${i}s..."
            sleep $i
          done

  deploy-dev:
    runs-on: ubuntu-latest
    needs: merge-to-dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/dev
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build:cdn
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Prepare site files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp ihatexcel.ico _site/ 2>/dev/null || true
          cp ihatexcel.svg _site/ 2>/dev/null || true
          cp -r dist-cdn _site/

      - name: Deploy to /dev/
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          destination_dir: dev
          keep_files: true
