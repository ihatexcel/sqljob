name: Deploy to GitHub Pages

on:
  push:
    branches: [main, recette]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build:cdn

      - name: Prepare deploy directory
        run: |
          mkdir -p _site
          cp index.html _site/
          cp ihatexcel.ico _site/ 2>/dev/null || true
          cp ihatexcel.svg _site/ 2>/dev/null || true
          cp -r dist-cdn _site/

      # main → racine du site (/)
      - name: Deploy main to /
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          keep_files: true

      # recette → sous-dossier /beta/
      - name: Deploy recette to /beta/
        if: github.ref == 'refs/heads/recette'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: beta
          keep_files: true
