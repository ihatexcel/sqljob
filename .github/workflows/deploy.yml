name: Deploy to GitHub Pages

on:
  push:
    branches: [main, beta, dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build:cdn

      - name: Prepare site files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp ihatexcel.ico _site/ 2>/dev/null || true
          cp ihatexcel.svg _site/ 2>/dev/null || true
          cp -r dist-cdn _site/

      - name: Deploy → root (main)
        if: github.ref_name == 'main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          keep_files: true

      - name: Deploy → /beta (beta)
        if: github.ref_name == 'beta'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          destination_dir: beta
          keep_files: true

      - name: Deploy → /dev (dev)
        if: github.ref_name == 'dev'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          destination_dir: dev
          keep_files: true
