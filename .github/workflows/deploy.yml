name: Deploy to GitHub Pages

on:
  push:
    branches: [main, beta, recette, claude/dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build:cdn

      - name: Prepare site files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp ihatexcel.ico _site/ 2>/dev/null || true
          cp ihatexcel.svg _site/ 2>/dev/null || true
          cp -r dist-cdn _site/

      # main → racine du site (/)
      - name: Deploy main to /
        if: github.ref_name == 'main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          keep_files: true

      # beta / recette → sous-dossier /beta/
      - name: Deploy beta to /beta/
        if: github.ref_name == 'beta' || github.ref_name == 'recette'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          destination_dir: beta
          keep_files: true

      # claude/dev → sous-dossier /dev/
      - name: Deploy claude/dev to /dev/
        if: github.ref == 'refs/heads/claude/dev'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          destination_dir: dev
          keep_files: true
