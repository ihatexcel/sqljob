name: Deploy to GitHub Pages

on:
  push:
    branches: [main, beta, recette, claude/dev]
  pull_request:
    branches: [main, beta, recette, claude/dev]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    steps:
      - name: Determine target branch
        id: target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "branch=${{ github.event.pull_request.base.ref }}" >> $GITHUB_OUTPUT
          else
            echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build:cdn
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Prepare site files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp ihatexcel.ico _site/ 2>/dev/null || true
          cp ihatexcel.svg _site/ 2>/dev/null || true
          cp -r dist-cdn _site/

      # main → racine du site (/)
      - name: Deploy main to /
        if: steps.target.outputs.branch == 'main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          keep_files: true

      # beta / recette → sous-dossier /beta/
      - name: Deploy beta to /beta/
        if: steps.target.outputs.branch == 'beta' || steps.target.outputs.branch == 'recette'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          destination_dir: beta
          keep_files: true

      # claude/dev → sous-dossier /dev/
      - name: Deploy claude/dev to /dev/
        if: steps.target.outputs.branch == 'claude/dev'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          destination_dir: dev
          keep_files: true
