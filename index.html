                const iv = this._base64ToUint8Array(encryptedObj.iv);
                const ciphertext = this._base64ToUint8Array(encryptedObj.ciphertext);
                const iterations = encryptedObj.iterations || this.DEFAULT_ITERATIONS;

                const key = await this.deriveKey(passphrase, salt, iterations);
                const decrypted = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv },
                    key,
                    ciphertext
                );
                return new TextDecoder().decode(decrypted);
            }

            static isEncrypted(obj) {
                return obj && obj[this.ENCRYPTED_MARKER] === true && !!obj.ciphertext && !!obj.salt && obj.iv !== undefined;
            }
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // CLASSE 2: GitHubGistManager
        // ═══════════════════════════════════════════════════════════════════════════
        class GitHubGistManager {
            static CLIENT_ID = ''; // À configurer par l'utilisateur
            static REDIRECT_URI = window.location.origin + window.location.pathname;
            static ACCESS_TOKEN_KEY = 'github_access_token';

            /**
             * Vérifie si un token d'accès est stocké
             */
            static hasAccessToken() {
                return !!localStorage.getItem(this.ACCESS_TOKEN_KEY);
            }

            /**
             * Récupère le token d'accès stocké
             */
            static getAccessToken() {
                return localStorage.getItem(this.ACCESS_TOKEN_KEY);
            }

            /**
             * Stocke le token d'accès
             */
            static setAccessToken(token) {
                localStorage.setItem(this.ACCESS_TOKEN_KEY, token);
            }

            /**
             * Supprime le token d'accès
             */
            static clearAccessToken() {
                localStorage.removeItem(this.ACCESS_TOKEN_KEY);
            }

            /**
             * Vérifie si nous revenons d'une authentification GitHub
             * et extrait le code d'autorisation
             */
            static checkAuthCallback() {
                const urlParams = new URLSearchParams(window.location.search);
                const code = urlParams.get('code');
                const state = urlParams.get('state');

                if (code && state === 'github_gist_auth') {
                    // Nettoyer l'URL
                    window.history.replaceState({}, document.title, window.location.pathname);
                    return code;
                }
                return null;
            }

            /**
             * Redirige vers GitHub pour l'authentification OAuth
             */
            static initiateAuth() {
                if (!this.CLIENT_ID) {
                    throw new Error('GitHub Client ID non configuré. Veuillez configurer CLIENT_ID dans GitHubGistManager.');
                }

                const authUrl = new URL('https://github.com/login/oauth/authorize');
                authUrl.searchParams.set('client_id', this.CLIENT_ID);
                authUrl.searchParams.set('redirect_uri', this.REDIRECT_URI);
                authUrl.searchParams.set('scope', 'gist');
                authUrl.searchParams.set('state', 'github_gist_auth');

                window.location.href = authUrl.toString();
            }

            /**
             * Échange le code d'autorisation contre un token d'accès
             * Note: Cela nécessite un backend proxy car GitHub ne permet pas CORS
             * Pour une solution client-only, on peut utiliser le Device Flow ou demander à l'utilisateur
             * de créer un Personal Access Token
             */
            static async exchangeCodeForToken(code) {
                // Cette méthode nécessiterait un backend proxy
                // Pour l'instant, nous utiliserons une approche avec Personal Access Token
                throw new Error('Exchange code nécessite un backend proxy. Utilisez setAccessToken() avec un Personal Access Token.');
            }

            /**
             * Crée un gist avec la configuration
             * @param {Object} config - Configuration à partager
             * @param {string} description - Description du gist
             * @param {string} fileName - Nom du fichier JSON (par défaut: notebook-config.json)
             * @param {string} [passphrase] - Passphrase pour chiffrer (optionnel). Si fourni, la config et datachunks sont chiffrés.
             * @returns {Promise<string>} URL du gist créé
             */
            static async createGist(config, description = 'sqljob Notebook Configuration', fileName = 'gistconfig.sqljob.json', passphrase = null) {
                const token = this.getAccessToken();
                if (!token) {
                    throw new Error('Non authentifié. Veuillez configurer un Personal Access Token.');
                }

                let contentToUpload;
                if (passphrase && passphrase.trim()) {
                    const jsonString = JSON.stringify(config);
                    const encrypted = await GistEncrypt.encrypt(jsonString, passphrase.trim());
                    encrypted.createdAt = config.createdAt || new Date().toISOString();
                    contentToUpload = JSON.stringify(encrypted);
                } else {
                    contentToUpload = JSON.stringify(config);
                }

                // S'assurer que le nom de fichier a l'extension .json
                const finalFileName = fileName.endsWith('.json') ? fileName : `${fileName}.json`;

                const gistData = {
                    description: description,
                    public: false,
                    files: {
                        [finalFileName]: {
                            content: contentToUpload
                        }
                    }
                };

                try {
                    const response = await fetch('https://api.github.com/gists', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Accept': 'application/vnd.github+json',
                            'Content-Type': 'application/json',
                            'X-GitHub-Api-Version': '2022-11-28'
                        },
                        body: JSON.stringify(gistData)
                    });

                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.message || 'Erreur lors de la création du gist');
                    }

                    const result = await response.json();
                    return result.html_url;
                } catch (error) {
                    console.error('Erreur création gist:', error);
                    throw error;
                }
            }

            /**
             * Génère une URL sqljob avec le gist (sans passphrase dans l'URL pour des raisons de sécurité)
             * @param {string} gistUrl - URL du gist GitHub
             * @returns {string} URL sqljob avec le paramètre gist
             */
            static generateSqljobUrl(gistUrl) {
                const gistId = gistUrl.match(/gist\.github\.com\/[^\/]+\/([a-f0-9]{32})/i)?.[1];
                if (!gistId) {
                    throw new Error('URL de gist invalide');
                }

                /*const baseUrl = window.location.origin + window.location.pathname;*/
                const baseUrl = 'https://ihatexcel.github.io/sqljob/';
                return `${baseUrl}?gist=${gistId}`;
            }
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // CLASSE 3: FileHandler
        // ═══════════════════════════════════════════════════════════════════════════
        class FileHandler {
            static getMimeTypeFromFileName(fileName) {
                const ext = fileName.split('.').pop().toLowerCase();
                const mimeTypes = {
                    'csv': 'text/csv',
                    'parquet': 'application/octet-stream',
                    'xlsx': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
                    'xls': 'application/vnd.ms-excel'
                };
                return mimeTypes[ext] || 'application/octet-stream';
            }

            static async compressGzip(arrayBuffer) {
                if (typeof CompressionStream === 'undefined') {
                    throw new Error('CompressionStream non supporté');
                }

                const compressionStream = new CompressionStream('gzip');
                const reader = compressionStream.readable.getReader();
                const chunks = [];

                const readPromise = (async () => {
                    let done = false;
                    while (!done) {
                        const { value, done: streamDone } = await reader.read();
                        done = streamDone;
                        if (value) chunks.push(value);
                    }
                })();

                const writer = compressionStream.writable.getWriter();
                await writer.write(new Uint8Array(arrayBuffer));
                await writer.close();
                await readPromise;

                return await new Blob(chunks).arrayBuffer();
            }

            static async decompressGzip(compressedData) {
                if (typeof DecompressionStream === 'undefined') {
                    throw new Error('DecompressionStream non supporté');
                }

                const decompressionStream = new DecompressionStream('gzip');
                const reader = decompressionStream.readable.getReader();
                const chunks = [];

                const readPromise = (async () => {
                    let done = false;
                    while (!done) {
                        const { value, done: streamDone } = await reader.read();
                        done = streamDone;
                        if (value) chunks.push(value);
                    }
                })();

                const writer = decompressionStream.writable.getWriter();
                await writer.write(compressedData);
                await writer.close();
                await readPromise;

                return await new Blob(chunks).arrayBuffer();
            }

            static arrayBufferToBase64(arrayBuffer) {
                const bytes = new Uint8Array(arrayBuffer);
                let binary = '';
                for (let i = 0; i < bytes.length; i++) {
                    binary += String.fromCharCode(bytes[i]);
                }
                return btoa(binary);
            }

            static base64ToUint8Array(base64) {
                const binaryString = atob(base64);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                return bytes;
            }

            static async processExcelFile(file, xlsxOptions, xlsxToCsvOptions, xlsxSheetSelection) {
                // Charger xlsx (SheetJS) à la demande
                await CDNManager.loadXlsx();

                const workbook = XLSX.read(await file.arrayBuffer(), { type: 'array', ...xlsxOptions });

                let selectedSheetName = workbook.SheetNames[0];
                const sheetSelection = xlsxSheetSelection || { type: { auto: true } };

                if (sheetSelection.type?.name && sheetSelection.name) {
                    if (workbook.SheetNames.includes(sheetSelection.name)) {
                        selectedSheetName = sheetSelection.name;
                    }
                } else if (sheetSelection.type?.index && sheetSelection.index > 0) {
                    if (sheetSelection.index < workbook.SheetNames.length) {
                        selectedSheetName = workbook.SheetNames[sheetSelection.index];
                    }
                }

                const selectedSheet = workbook.Sheets[selectedSheetName];
                const csv = XLSX.utils.sheet_to_csv(selectedSheet, xlsxToCsvOptions || {});

                return {
                    csv,
                    csvFileName: file.name.replace(/\.(xlsx|xls)$/i, '.csv'),
                    sheetName: selectedSheetName
                };
            }

            static downloadFile(blob, fileName) {
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            }
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // CLASSE 3: DuckDBManager (Dual Engine: duckdb-wasm / ducklings)
        // ═══════════════════════════════════════════════════════════════════════════
        class DuckDBManager {
            static dbInstance = null;
            static connInstance = null;
            static duckdbModuleRef = null;
            static currentEngine = 'duckdb-wasm'; // 'duckdb-wasm' | 'ducklings'
            static workerRef = null;

            // Versions et URLs des CDN (chargés dynamiquement selon le moteur)
            static DUCKDB_WASM_VERSION = '1.33.1-dev18.0';
            static DUCKLINGS_VERSION = '1.4.4';

            static getDuckDBWasmUrl() {
                return `https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@${DuckDBManager.DUCKDB_WASM_VERSION}/+esm`;
            }

            static getDucklingsUrl() {
                return `https://cdn.jsdelivr.net/npm/@ducklings/browser@${DuckDBManager.DUCKLINGS_VERSION}/+esm`;
            }

            static getEngine() {
                return DuckDBManager.currentEngine;
            }

            static setEngine(engine) {
                if (!['duckdb-wasm', 'ducklings'].includes(engine)) {
                    throw new Error(`Moteur inconnu: ${engine}`);
                }
                DuckDBManager.currentEngine = engine;
            }

            static async destroy(onStatus) {
                onStatus?.('Destruction de la base de données...', 'loading');

                try {
                    if (DuckDBManager.connInstance) {
                        if (DuckDBManager.currentEngine === 'ducklings') {
                            await DuckDBManager.connInstance.close?.();
                        }
                        DuckDBManager.connInstance = null;
                    }

                    if (DuckDBManager.dbInstance) {
                        if (DuckDBManager.currentEngine === 'ducklings') {
                            await DuckDBManager.dbInstance.close?.();
                        } else {
                            await DuckDBManager.dbInstance.terminate?.();
                        }
                        DuckDBManager.dbInstance = null;
                    }

                    if (DuckDBManager.workerRef) {
                        DuckDBManager.workerRef.terminate?.();
                        DuckDBManager.workerRef = null;
                    }

                    DuckDBManager.duckdbModuleRef = null;
                    window.duckdbModule = null;
                    window.ducklingsModule = null;

                    onStatus?.('Base de données détruite', 'success');
                } catch (error) {
                    console.error('Erreur destruction DB:', error);
                    onStatus?.('Erreur destruction: ' + error.message, 'error');
                }
            }

            static async switchEngine(newEngine, onStatus) {
                if (newEngine === DuckDBManager.currentEngine && DuckDBManager.dbInstance) {
                    return; // Déjà sur ce moteur et initialisé
                }

                // Détruire l'instance actuelle
                await DuckDBManager.destroy(onStatus);

                // Changer le moteur
                DuckDBManager.setEngine(newEngine);

                // Réinitialiser avec le nouveau moteur
                await DuckDBManager.initDuckDB(onStatus);
            }

            static supportsFileOperations() {
                return DuckDBManager.currentEngine === 'duckdb-wasm';
            }

            static supportsExtensions() {
                return DuckDBManager.currentEngine === 'duckdb-wasm';
            }

            static async initDuckDB(onStatus) {
                if (DuckDBManager.dbInstance && DuckDBManager.connInstance) {
                    return { db: DuckDBManager.dbInstance, conn: DuckDBManager.connInstance };
                }

                if (DuckDBManager.currentEngine === 'ducklings') {
                    return await DuckDBManager._initDucklings(onStatus);
                } else {
                    return await DuckDBManager._initDuckDBWasm(onStatus);
                }
            }

            static async _initDuckDBWasm(onStatus) {
                onStatus?.('Initialisation de DuckDB WASM...', 'loading');

                const duckdb = await import(DuckDBManager.getDuckDBWasmUrl());
                window.duckdbModule = duckdb;
                DuckDBManager.duckdbModuleRef = duckdb;

                const JSDELIVR_BUNDLES = duckdb.getJsDelivrBundles();
                const bundle = await duckdb.selectBundle(JSDELIVR_BUNDLES);

                const worker_url = URL.createObjectURL(
                    new Blob([`importScripts("${bundle.mainWorker}");`], { type: 'text/javascript' })
                );
                const worker = new Worker(worker_url);
                DuckDBManager.workerRef = worker;

                // Créer un logger personnalisé compatible avec Perspective
                const logger = {
                    log(entry) {
                    }
                };

                DuckDBManager.dbInstance = new duckdb.AsyncDuckDB(logger, worker);
                URL.revokeObjectURL(worker_url);

                await DuckDBManager.dbInstance.instantiate(bundle.mainModule, bundle.pthreadWorker);
                DuckDBManager.connInstance = await DuckDBManager.dbInstance.connect();

                // Installer et charger l'extension excel pour supporter les fichiers xlsx nativement
                onStatus?.('Chargement extension Excel...', 'loading');
                await DuckDBManager.connInstance.query('INSTALL excel;');
                await DuckDBManager.connInstance.query('LOAD excel;');

                onStatus?.('DuckDB WASM prêt', 'success');

                return { db: DuckDBManager.dbInstance, conn: DuckDBManager.connInstance };
            }

            static async _initDucklings(onStatus) {
                onStatus?.('Initialisation de Ducklings...', 'loading');

                // Ducklings ne fonctionne pas depuis file:// (worker ES module)
                if (location.protocol === 'file:') {
                    onStatus?.('Ducklings nécessite un serveur HTTP. Basculement vers DuckDB WASM...', 'warning');
                    await new Promise(resolve => setTimeout(resolve, 1500));
                    DuckDBManager.currentEngine = 'duckdb-wasm';
                    return await DuckDBManager._initDuckDBWasm(onStatus);
                }

                const ducklings = await import(DuckDBManager.getDucklingsUrl());
                window.ducklingsModule = ducklings;
                DuckDBManager.duckdbModuleRef = ducklings;

                const bundle = ducklings.getJsDelivrBundle();
                const worker = await ducklings.createWorker(bundle.mainWorker);
                DuckDBManager.workerRef = worker;

                await ducklings.init({
                    worker,
                    wasmUrl: bundle.wasmModule,
                    wasmJsUrl: bundle.wasmJs
                });

                DuckDBManager.dbInstance = new ducklings.DuckDB();
                DuckDBManager.connInstance = await DuckDBManager.dbInstance.connect();

                onStatus?.('Ducklings prêt', 'success');

                return { db: DuckDBManager.dbInstance, conn: DuckDBManager.connInstance };
            }

            static async executeQuery(query) {
                const qPreview = typeof query === 'string' && query.length > 200 ? query.slice(0, 200) + '...' : query;
                if (!DuckDBManager.connInstance) {
                    throw new Error('DuckDB non initialisé');
                }

                if (DuckDBManager.currentEngine === 'ducklings') {
                    // Ducklings retourne directement un tableau d'objets
                    const result = await DuckDBManager.connInstance.query(query);
                    return result;
                } else {
                    // DuckDB WASM nécessite une conversion
                    const result = await DuckDBManager.connInstance.query(query);
                    return result.toArray().map(row => Object.fromEntries(row));
                }
            }

            static async registerFile(fileName, file) {
                if (DuckDBManager.currentEngine === 'ducklings') {
                    throw new Error('Ducklings ne supporte pas l\'enregistrement de fichiers. Utilisez DuckDB WASM pour les notebooks avec fichiers.');
                }
                if (!DuckDBManager.dbInstance || !DuckDBManager.duckdbModuleRef) {
                    throw new Error('DuckDB non initialisé');
                }
                await DuckDBManager.dbInstance.registerFileHandle(
                    fileName,
                    file,
                    DuckDBManager.duckdbModuleRef.DuckDBDataProtocol.BROWSER_FILEREADER,
                    true
                );
            }

            static async copyFileToBuffer(fileName) {
                if (DuckDBManager.currentEngine === 'ducklings') {
                    throw new Error('Ducklings ne supporte pas copyFileToBuffer. Utilisez DuckDB WASM.');
                }
                return await DuckDBManager.dbInstance.copyFileToBuffer(fileName);
            }

            /** Attend que le fichier soit disponible dans le système de fichiers virtuel avec retry */
            static async waitForFile(fileName, maxRetries = 10, delayMs = 200) {
                for (let i = 0; i < maxRetries; i++) {
                    try {
                        const buffer = await DuckDBManager.dbInstance.copyFileToBuffer(fileName);
                        if (buffer && buffer.byteLength > 0) {
                            return buffer;
                        }
                    } catch (error) {
                        // Fichier pas encore disponible, on continue
                    }
                    await new Promise(resolve => setTimeout(resolve, delayMs));
                }
                throw new Error(`Le fichier ${fileName} n'est pas disponible après ${maxRetries} tentatives`);
            }

            /** Supprime un fichier du système de fichiers virtuel DuckDB (pour éviter conflits aux prochains exports) */
            static async dropFile(fileName) {
                if (DuckDBManager.currentEngine === 'ducklings' || !DuckDBManager.dbInstance?.dropFile) {
                    return;
                }
                try {
                    await DuckDBManager.dbInstance.dropFile(fileName);
                } catch (e) {
                    console.warn('dropFile ignoré:', e);
                }
            }

            static async executeQueryArrow(query) {
                if (!DuckDBManager.connInstance) {
                    throw new Error('DuckDB non initialisé');
                }

                if (DuckDBManager.currentEngine === 'ducklings') {
                    throw new Error('Ducklings ne supporte pas le format Arrow. Utilisez DuckDB WASM.');
                }

                // DuckDB WASM retourne directement un Arrow Table
                const result = await DuckDBManager.connInstance.query(query);
                return result;
            }

            static getConnection() {
                return DuckDBManager.connInstance;
            }

            static getDatabase() {
                return DuckDBManager.dbInstance;
            }
        }

        // ═══════════════════════════════════════════════════════════════════════════

        // ═══════════════════════════════════════════════════════════════════════════

                                <button class="btn btn-xs btn-error join-item" @click="deleteCellAt(${pathExpr}, ${cellIdxExpr})" title="Supprimer">🗑️</button>

                                    <li><button @click="moveItemInGroup(${pathExpr}, 'cell', ${cellIdxExpr}, 1)" :disabled="isLastInGroup(${groupExpr}, 'cell', ${cellIdxExpr})">➡️ Déplacer à droite</button></li>
                                    <li><button class="text-error" @click="deleteCellAt(${pathExpr}, ${cellIdxExpr})">🗑️ Supprimer</button></li>
                                </ul>
                            </div>
                        </div>
                    </div>`;
            }

            // Skeleton DaisyUI affiché quand la cellule n'est pas encore chargée (template unique)
            static renderCellBodySkeleton() {
                return `<div class="flex min-w-0 w-full flex-col mt-2 gap-4">
  <div class="skeleton h-8 w-full"></div>
  <div class="skeleton h-2 w-28"></div>
  <div class="skeleton h-2 w-full"></div>
  <div class="skeleton h-2 w-full"></div>
</div>`;
            }
            static renderTableSkeleton() {
                return `<div class="flex flex-col gap-2 p-4">
  <div class="skeleton h-6 w-full"></div>
  <div class="skeleton h-4 w-full"></div>
  <div class="skeleton h-4 w-full"></div>
  <div class="skeleton h-4 w-3/4"></div>
</div>`;
            }

            // Génère le HTML du body d'une cellule (tous les types – registre bodyFamily)
            static renderBody(pathExpr, cellIdxExpr) {
                const skeleton = this.renderCellBodySkeleton();
                const bodyParts = Object.entries(CELL_TYPE_SCHEMAS.types)
                    .filter(([, schema]) => schema.bodyFamily && CELL_BODY_FAMILIES[schema.bodyFamily])
                    .map(([type, schema]) => {
                        const family = CELL_BODY_FAMILIES[schema.bodyFamily];
                        const html = family.render(pathExpr, cellIdxExpr, schema);
                        return { type, html };
                    });
                const bodyTemplates = bodyParts.map(({ type, html }) =>
                    `<template x-if="cellItem.cell.type === '${type}'">${html}</template>`).join('\n                        ');
                return `
                    <div class="pt-1 pb-1 pl-2 pr-2 relative flex-1 flex flex-col min-h-0 cell-body"
                         :class="{ 'cell-body-has-height': hasCellHeight(cellItem.cell) }"
                         :style="getCellHeightVars(cellItem.cell)">
                        <!-- SKELETON: logique pilotée par bodyDisplay (schéma) -->
                        <div x-show="bodyDisplayShouldShowSkeleton(cellItem.cell)">
                            ${skeleton}
                        </div>
                        <!-- CONTENU: logique pilotée par bodyDisplay (schéma) -->
                        <div class="flex-1 flex flex-col min-h-0" x-show="bodyDisplayShouldShowContent(cellItem.cell)">
                        ${bodyTemplates}
                        <!-- CLIENT MODE BUTTON: Open child group modal if cell has childGroupId -->
                        <template x-if="!devMode && cellItem.cell.childGroupId">
                            <div class="absolute top-2 right-2">
                                <button class="btn btn-sm gap-0" 
                                        @click="openChildGroupModal(${pathExpr}, ${cellIdxExpr})"
                                        title="Ouvrir le groupe enfant">

                                </button>
                            </div>
                        </template>
                        </div>
                    </div>`;
            }

            // Génère le HTML complet d'une cellule
            static renderCell(pathExpr, cellIdxExpr, groupExpr) {
                return CellRenderer.renderHeader(pathExpr, cellIdxExpr, groupExpr) + CellRenderer.renderBody(pathExpr, cellIdxExpr);
            }
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // CELL BODY RENDERER – Familles de body (blocs factorisés)

            }
            static renderFileDropZone(pathExpr, cellIdxExpr, schema) {

                    <template x-if="!cellItem.cell.${fileKey}"><div class="text-center p-1"><div class="text-4xl mb-0">${emptyIcon}</div><p class="m-0 text-base-content/60 text-sm" x-text="cellItem.cell.${titleKey} || 'Glissez-déposez ici'"></p><p class="mt-0 mb-0 text-accent text-xs font-semibold" x-text="${subTitleExpr}"></p></div></template>

            static renderButtonRun(pathExpr, cellIdxExpr, schema) {
                const c = schema.bodyConfig || {};
                const lb = (c.defaultLabel || '▶️ Exécuter').replace(/'/g, "\\'");
                return `<div class="flex justify-center p-0"><button class="btn btn-primary btn-sm" @click="runCellsAfter(${pathExpr}, ${cellIdxExpr})" :disabled="isLoading"><span x-text="cellItem.cell.buttonLabel || '${lb}'"></span></button></div>`;
            }
            static renderSqlWithTable(pathExpr, cellIdxExpr, schema) {
                const c = schema.bodyConfig || {};
                const defaultSql = (c.defaultSql || 'SELECT * FROM source1 LIMIT 100').replace(/'/g, "\\'");
                const ts = CellRenderer.renderTableSkeleton();
                const showTextResult = c.showTextResult === true;
                let out = `<div :class="hasCellHeight(cellItem.cell) ? 'flex-1 min-h-0 flex flex-col' : ''">`;

            return `

                </div>

                    <button class="btn btn-primary" @click="unlock()" :disabled="loading">
                        <span x-show="!loading">Déchiffrer</span>
                        <span x-show="loading" class="loading loading-spinner loading-sm"></span>

        function gistPassphraseModal() {
            return {
                passphrase: '',
                error: '',
                loading: false,
                init() {},
                useDefaultConfig() {
                    const baseConfig = window._encryptedSource === 'html' ? { job: { cells: [] } } : ConfigManager.getDefaultConfig();
                    window._loadedConfig = ConfigManager.applyURLParamsToConfig(baseConfig);
                    window._pendingEncryptedGist = null;
                    window._encryptedSource = null;
                    const container = document.getElementById('app-container');
                    if (container) {
                        container.innerHTML = generateAppHTML();
                        if (window.Alpine) Alpine.initTree(container);
                    }
                    window.notebookApp = notebookApp;
                },
                async unlock() {
                    const pass = (this.passphrase || '').trim();
                    if (!pass) { this.error = 'Veuillez entrer la passphrase'; return; }
                    this.error = '';
                    this.loading = true;
                    try {
                        const decrypted = await GistEncrypt.decrypt(window._pendingEncryptedGist, pass);
                        const parsed = JSON.parse(decrypted);
                        let config;
                        if (window._encryptedSource === 'html' && parsed && typeof parsed.config === 'object' && Array.isArray(parsed.sourceFiles) && Array.isArray(parsed.docxTemplates)) {
                            for (const sf of parsed.sourceFiles) {
                                const script = document.createElement('script');
                                script.type = 'application/octet-stream';
                                script.id = sf.id;
                                script.dataset.sourceName = sf.sourceName;
                                script.dataset.fileName = sf.fileName;
                                script.textContent = sf.base64 || '';
                                document.head.appendChild(script);
                            }
                            for (const dt of parsed.docxTemplates) {
                                const script = document.createElement('script');
                                script.type = 'application/octet-stream';
                                script.id = dt.id;
                                script.dataset.cellPath = dt.cellPath;
                                script.dataset.fileName = dt.fileName;
                                if (dt.compressed) script.dataset.compressed = 'true';
                                script.textContent = dt.base64 || '';
                                document.head.appendChild(script);
                            }
                            const configScript = document.getElementById('defaultConfigBase64');
                            if (configScript) {
                                configScript.textContent = ConfigManager.encodeUTF8ToBase64(JSON.stringify(parsed.config, null, 2));
                                configScript.removeAttribute('data-encrypted');
                            }
                            config = parsed.config;
                        } else {
                            config = ConfigManager.deepMerge(ConfigManager.getDefaultConfig(), parsed);
                            await ConfigManager.prepareConfigForLoad(config);
                        }
                        window._loadedConfig = ConfigManager.applyURLParamsToConfig(config);
                        window._pendingEncryptedGist = null;
                        window._encryptedSource = null;
                        const container = document.getElementById('app-container');
                        if (container) {
                            container.innerHTML = generateAppHTML();
                            if (window.Alpine) Alpine.initTree(container);
                        }
                        window.notebookApp = notebookApp;
                    } catch (e) {
                        this.error = e.message || 'Passphrase incorrecte';
                    } finally {
                        this.loading = false;
                    }
                }
            };
        }

                                                 'border-success': cellItem.cell.border !== false && cellItem.cell._status === 'success', 
                                                 'border-error': cellItem.cell.border !== false && cellItem.cell._status === 'error'

                                    </div>

                                <!-- Sous-groupes récursifs (nombre de niveaux illimité) -->

                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                    </div>
                </template>

                            <div class="form-control mb-4">
                                <label class="label cursor-pointer justify-start gap-3">

                                <input type="checkbox" class="toggle toggle-primary" x-model="getGroupAtPath(groupSettingsModal.path).tabsChild" />

                        <div class="form-control mb-4">
                            <label class="label">

                                class="input input-bordered w-full"
                                x-model="getGroupAtPath(groupSettingsModal.path).name"

                                    <span class="badge badge-sm cursor-help">?</span>
                                </span>
                            </label>
                            <p class="text-xs text-base-content/60 mb-2">Requête SQL ou JS. Si définie, le groupe ne sera affiché en mode client que si le résultat est truthy.</p>
                            <div class="rounded-lg border border-base-300 p-3 bg-base-200/50">
                                <div class="form-control mb-2">
                                    <label class="label py-1">
                                        <span class="label-text text-sm">Type de langage</span>
                                    </label>
                                    <select class="select select-bordered select-sm w-full" 
                                            :value="(ConfigManager.getGroupIfQuery(getGroupAtPath(groupSettingsModal.path))?.engine || 'sql')"
                                            @change="(() => { const g = getGroupAtPath(groupSettingsModal.path); const q = ConfigManager.ensureGroupQueries(g); if (q) { g._cmEditor_ifQuery?.destroy(); g._cmEditor_ifQuery = null; q.engine = $event.target.value; } })()">

                                        <option value="js">⚡ JavaScript</option>
                                    </select>
                                </div>
                                <div class="form-control">
                                    <label class="label py-1">
                                        <span class="label-text text-sm">Requête</span>
                                    </label>
                                    <div x-init="$nextTick(() => renderGroupIfQueryEditorInit(getGroupAtPath(groupSettingsModal.path), $el))"></div>

                                <div class="mt-2 flex gap-2">
                                    <button type="button" class="btn btn-sm btn-outline" @click="testGroupIfQuery(groupSettingsModal.path)" :disabled="!ConfigManager.getGroupIfQuery(getGroupAtPath(groupSettingsModal.path)) || isLoading">

                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-action">
                        <button class="btn" @click="groupSettingsModal.open = false">Fermer</button>
                    </div>
                </div>
            </div>
        </template>
        
        <!-- Modal configuration cellule -->
        <template x-if="cellConfigModal.open">
            <div class="modal modal-open z-[2100]" @click.self="closeCellConfig()" role="presentation">
                <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-cell-config-title"
                     x-trap.noscroll="cellConfigModal.open">
                    <form method="dialog">

                                    @change="(function(){ const c=getCellAtPath(cellConfigModal.path,cellConfigModal.cellIndex); const oldType=c?.type; c.type=$event.target.value; onCellTypeChange(cellConfigModal.path,cellConfigModal.cellIndex,oldType); })()">

                                <option value="source">📄 Source</option>
                                <option value="uiParameter">🎛️ Paramètre UI</option>
                                <option value="buttonRunNextCells">🚀 Bouton Exécuter</option>
                                <option value="sqlRecursiveParse">🗄️ SQL</option>
                                <option value="table">📊 Tableau</option>
                                <option value="iframe">🖼️ HTML/Iframe</option>
                                <option value="sqlStat">💯 Stat SQL (daisyui)</option>
                                <option value="publipostageWord">📄 Publipostage Word</option>
                                <option value="pdfme">PDF (pdfme)</option>
                                <option value="perspective">🔍 Perspective Viewer</option>
                            </select>
                        </div>

                        <!-- Paramètres communs unifiés (name, title, subtitle, icon, buttonLabel, queries) -->
                        <template x-for="paramKey in ['name', ...getCommonParamsExcludingName(getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex)?.type).filter(p => p !== 'queries')]" :key="'common-'+paramKey">
                            <div class="form-control">
                                <template x-if="paramKey === 'name'">
                                    <div>
                                        <label class="label gap-2">
                                            <span class="label-text">Nom</span>
                                            <span class="tooltip tooltip-bottom" data-tip="Identifiant unique (tous types confondus). Pour source = nom de la table SQL. Pour onglets tabsChild = libellé affiché."><span class="badge badge-sm cursor-help">?</span></span>
                                        </label>
                                        <input type="text" class="input input-bordered input-sm w-full"
                                               x-model="getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex).name"
                                               @blur="validateCellName(cellConfigModal.path, cellConfigModal.cellIndex)"
                                               placeholder="Identifiant unique de la cellule" />
                                    </div>
                                </template>
                                <template x-if="['title','subtitle','icon','buttonLabel'].includes(paramKey)">
                                    <div>
                                        <label class="label gap-2">
                                            <span class="label-text" x-text="getCommonParamDef(paramKey, getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex)?.type)?.label || paramKey"></span>
                                            <span class="tooltip tooltip-bottom" :data-tip="getCommonParamDef(paramKey, getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex)?.type)?.tooltip || ''" x-show="getCommonParamDef(paramKey, getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex)?.type)?.tooltip"><span class="badge badge-sm cursor-help">?</span></span>
                                        </label>
                                        <input type="text" class="input input-bordered input-sm w-full"
                                               :value="getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex)[paramKey]"
                                               @input="getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex)[paramKey] = $event.target.value"
                                               :placeholder="getCommonParamDef(paramKey, getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex)?.type)?.placeholder || ''" />
                                    </div>
                                </template>
                            </div>
                        </template>

                        <!-- Taille (commun à tous) -->
                        <div class="collapse collapse-arrow border border-base-300 bg-base-100">
                            <input type="checkbox" />
                            <div class="collapse-title min-h-0 py-3 font-medium flex items-center gap-2">Format de la cellule</div>
                            <div class="collapse-content">
                                <label class="label cursor-pointer justify-start gap-3 py-1">
                                    <input type="checkbox" class="checkbox checkbox-sm"
                                           :checked="getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex).border !== false"
                                           @change="getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex).border = $event.target.checked">
                                    <span class="label-text">Afficher bordure et ombre</span>
                                </label>
                                <div class="grid grid-cols-2 gap-3 pt-1">
                                    <div class="col-span-2 font-medium text-sm">Largeur</div>
                                    <div><span class="label-text-alt">Min (px)</span><input type="text" class="input input-bordered input-sm validator w-full" placeholder="100" x-model="getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex).minSizePx" /></div>
                                    <div><span class="label-text-alt">Min (%)</span><input type="text" class="input input-bordered input-sm validator w-full" placeholder="50" x-model="getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex).minSizePercent" /></div>
                                    <div><span class="label-text-alt">Max (px)</span><input type="text" class="input input-bordered input-sm validator w-full" placeholder="400" x-model="getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex).maxSizePx" /></div>
                                    <div><span class="label-text-alt">Max (%)</span><input type="text" class="input input-bordered input-sm validator w-full" placeholder="80" x-model="getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex).maxSizePercent" /></div>
                                    <div class="col-span-2 font-medium text-sm mt-1">Hauteur</div>
                                    <div><span class="label-text-alt">Min (px)</span><input type="text" class="input input-bordered input-sm validator w-full" placeholder="100" x-model="getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex).minHeightPx" /></div>
                                    <div><span class="label-text-alt">Min (%)</span><input type="text" class="input input-bordered input-sm validator w-full" placeholder="50" x-model="getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex).minHeightPercent" /></div>
                                    <div><span class="label-text-alt">Max (px)</span><input type="text" class="input input-bordered input-sm validator w-full" placeholder="400" x-model="getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex).maxHeightPx" /></div>
                                    <div><span class="label-text-alt">Max (%)</span><input type="text" class="input input-bordered input-sm validator w-full" placeholder="80" x-model="getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex).maxHeightPercent" /></div>
                                </div>
                            </div>
                        </div>

                        <!-- Paramètres spécifiques unifiés (boucle sur le schéma) -->
                        <template x-for="param in getSpecificParamsForType(getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex)?.type)" :key="'spec-'+param.key">
                            <div class="form-control" x-show="isSpecificParamVisible(param, getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex))">
                                <!-- perspectiveCdns : 4 checkboxes -->
                                <template x-if="param.inputType === 'perspectiveCdns'">
                                    <div>
                                        <label class="label gap-2"><span class="label-text" x-text="param.label"></span>
                                            <span class="tooltip tooltip-bottom" :data-tip="param.tooltip || ''"><span class="badge badge-sm cursor-help">?</span></span>
                                        </label>
                                        <div class="flex flex-col gap-2 p-3 bg-base-200 rounded-lg" x-init="if (!getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex).perspectiveCdns) getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex).perspectiveCdns = { viewer: true, datagrid: true, d3fc: true, openlayers: false }">
                                            <label class="label cursor-pointer justify-start gap-3"><input type="checkbox" class="checkbox checkbox-sm" x-model="getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex).perspectiveCdns.viewer"><span class="label-text font-mono text-xs">@perspective-dev/viewer (requis)</span></label>
                                            <label class="label cursor-pointer justify-start gap-3"><input type="checkbox" class="checkbox checkbox-sm" x-model="getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex).perspectiveCdns.datagrid"><span class="label-text font-mono text-xs">@perspective-dev/viewer-datagrid</span></label>
                                            <label class="label cursor-pointer justify-start gap-3"><input type="checkbox" class="checkbox checkbox-sm" x-model="getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex).perspectiveCdns.d3fc"><span class="label-text font-mono text-xs">@perspective-dev/viewer-d3fc (charts)</span></label>
                                            <label class="label cursor-pointer justify-start gap-3"><input type="checkbox" class="checkbox checkbox-sm" x-model="getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex).perspectiveCdns.openlayers"><span class="label-text font-mono text-xs">@perspective-dev/viewer-openlayers (maps)</span></label>
                                        </div>
                                    </div>
                                </template>
                                <!-- checkbox -->
                                <template x-if="param.inputType === 'checkbox'">
                                    <label class="label cursor-pointer justify-start gap-3">
                                        <input type="checkbox" class="checkbox checkbox-sm"
                                               :checked="getCellValueByPath(getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex), param.key)"
                                               @change="setCellValueByPath(getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex), param.key, $event.target.checked)">
                                        <span class="label-text" x-text="param.label"></span>
                                        <span class="tooltip tooltip-bottom" :data-tip="param.tooltip || ''"><span class="badge badge-sm cursor-help">?</span></span>
                                    </label>
                                </template>
                                <!-- select -->
                                <template x-if="param.inputType === 'select'">
                                    <div>
                                        <label class="label gap-2"><span class="label-text" x-text="param.label"></span><span class="tooltip tooltip-bottom" :data-tip="param.tooltip || ''"><span class="badge badge-sm cursor-help">?</span></span></label>
                                        <select class="select select-bordered select-sm w-full"
                                                :value="getCellValueByPath(getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex), param.key)"
                                                @change="setCellValueByPath(getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex), param.key, $event.target.value)">
                                            <template x-for="opt in (param.options || [])" :key="opt.value"><option :value="opt.value" x-text="opt.label"></option></template>
                                        </select>
                                    </div>
                                </template>
                                <!-- textarea (content, json, json.xlsx, json.perspectiveConfig) -->
                                <template x-if="param.inputType === 'textarea'">
                                    <div>
                                        <label class="label gap-2"><span class="label-text" x-text="param.label"></span><span class="tooltip tooltip-bottom" :data-tip="param.tooltip || ''"><span class="badge badge-sm cursor-help">?</span></span></label>
                                        <textarea class="textarea textarea-bordered w-full" :class="param.key.includes('json') ? 'font-mono text-sm' : ''" :rows="param.rows || 5"
                                                  :style="param.rows >= 10 ? 'min-height: 200px;' : (param.key === 'json' ? 'min-height: 300px;' : '')"
                                                  :placeholder="param.placeholder || ''"
                                                  :value="param.key === 'json.xlsx' ? getCellValueByPath(getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex), 'json.xlsx') : getCellValueByPath(getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex), param.key)"
                                                  @input="param.key === 'content' ? (setCellValueByPath(getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex), 'content', $event.target.value), syncMarkdownToEditor(cellConfigModal.path, cellConfigModal.cellIndex)) : setCellValueByPath(getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex), param.key === 'json.xlsx' ? 'json.xlsx' : param.key, $event.target.value)">
                                        </textarea>
                                    </div>
                                </template>
                                <!-- number -->
                                <template x-if="param.inputType === 'number'">
                                    <div>
                                        <label class="label gap-2"><span class="label-text" x-text="param.label"></span><span class="tooltip tooltip-bottom" :data-tip="param.tooltip || ''"><span class="badge badge-sm cursor-help">?</span></span></label>
                                        <input type="number" class="input input-bordered input-sm w-full"
                                               :value="getCellValueByPath(getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex), param.key)"
                                               @input="setCellValueByPath(getCellAtPath(cellConfigModal.path, cellConfigModal.cellIndex), param.key, parseFloat($event.target.value) || 0)"
                                               :placeholder="param.placeholder" :min="param.min" step="any" />
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                    <div class="modal-action">
                        <button class="btn" @click="closeCellConfig()">Fermer</button>
                    </div>
                </div>
            </div>
        </template>
    
        <!-- Modal groupe enfant Full-screen -->
        <template x-if="childGroupModal.open">
            <div class="modal modal-open fixed inset-0 z-[2000]" role="presentation">
                <div class="modal-box w-full h-full max-w-none max-h-none rounded-none flex flex-col p-0" role="dialog" aria-modal="true" aria-labelledby="modal-child-group-title"
                     x-trap.noscroll="childGroupModal.open">

                    <div class="sticky top-0 z-10 flex items-center justify-between bg-primary text-primary-content px-6 py-4 shadow-md">
                        <h3 class="text-xl font-bold flex items-center gap-2" id="modal-child-group-title">
                            <span class="iconify" data-icon="material-symbols:export-notes-outline-sharp" style="font-size: 1.5rem;"></span>
                        </h3>
                        <button class="btn btn-sm btn-circle btn-ghost text-primary-content hover:bg-primary-focus" @click="closeChildGroupModal()">✕</button>
                    </div>
                    
                    <!-- Contenu scrollable -->
                    <div class="flex-1 overflow-y-auto bg-base-100 p-6">
                        <!-- Rendu du groupe dans la modale -->
                        <template x-if="childGroupModal.group">
                            <div class="w-full">
                                <!-- Wrapper pour le groupe -->
                                <div class="border border-base-300 rounded-lg overflow-hidden bg-base-100">
                                    <!-- Header du groupe -->
                                    <div x-show="devMode" class="flex items-center justify-between gap-2 py-2 px-4 bg-primary/10 border-b border-base-300">
                                        <div class="join">
                                            <button class="btn btn-xs join-item" @click="childGroupModal.group.direction = childGroupModal.group.direction === 'column' ? 'row' : 'column'" 
                                                    :title="childGroupModal.group.direction === 'column' ? 'Passer en ligne' : 'Passer en colonne'">
                                                <span x-text="childGroupModal.group.direction === 'column' ? '↕️' : '↔️'"></span>
                                            </button>
                                            <button class="btn btn-xs btn-success join-item" @click="runGroupAtPath([-1])" :disabled="isLoading" title="Exécuter">▶️</button>
                                            <button class="btn btn-xs join-item" @click="addNestedGroup([-1])" title="Ajouter un sous-groupe">📁</button>
                                            <button class="btn btn-xs join-item" @click="openAddCellToGroupModal([-1])" title="Ajouter une cellule">➕</button>
                                            <button class="btn btn-xs btn-error join-item" @click="deleteChildGroupModal()" title="Supprimer le groupe">🗑️</button>
                                        </div>
                                    </div>
                                    
                                    <!-- Contenu du groupe -->
                                    <div class="p-2">
                                        <div class="flex gap-2" :class="childGroupModal.group.direction === 'row' ? 'flex-row flex-wrap' : 'flex-col'">
                                            <!-- Cellules du groupe modal -->
                                            <template x-for="(cellItem, cellIdx) in getSortedCells(childGroupModal.group)" :key="cellItem.cell._id">
                                                <div class="flex flex-1"
                                                     :class="getCellSizeOuterClass(cellItem.cell, childGroupModal.group.direction === 'column')"
                                                     :style="getCellWrapperStyle(cellItem.cell, childGroupModal.group.direction === 'column', cellItem.cell._order ?? 0)">
                                                    <div class="rounded-lg overflow-hidden bg-base-100 cell-container"
                                                         :class="[getCellSizeInnerClass(), cellItem.cell.border !== false ? 'border border-base-300 shadow-sm hover:border-primary hover:shadow-lg' : 'border-0 shadow-none', {
                                                             'border-warning shadow-[0_0_10px_rgba(251,191,36,0.3)]': cellItem.cell.border !== false && cellItem.cell._status === 'running', 
                                                             'border-success': cellItem.cell.border !== false && cellItem.cell._status === 'success', 
                                                             'border-error': cellItem.cell.border !== false && cellItem.cell._status === 'error'
                                                         }]">
                                                    
                                                    <!-- Header de cellule -->
                                                    <div class="flex justify-between items-center py-2 px-4 bg-base-200 border-b border-base-300" x-show="devMode">
                                                        <div class="flex items-center gap-2 text-sm text-base-content/60">
                                                            <span class="text-base" x-text="getCellIcon(cellItem.cell.type)"></span>
                                                            <span x-text="cellItem.cell.type"></span>
                                                            <span x-show="cellItem.cell._status === 'running'" style="color: var(--warning);">⏳</span>
                                                        </div>
                                                        <div class="flex gap-1 items-center">
                                                            <div class="join">
                                                                <button class="btn btn-xs btn-success join-item" @click="runCellAt([-1], cellItem.originalIndex)" :disabled="isLoading" title="Exécuter">▶️</button>
                                                                <button class="btn btn-xs join-item" @click="openCellConfig([-1], cellItem.originalIndex)" title="Configurer">⚙️</button>
                                                                <button class="btn btn-xs join-item" @click="moveItemInGroup([-1], 'cell', cellItem.originalIndex, -1)" :disabled="isFirstInGroup(childGroupModal.group, 'cell', cellItem.originalIndex)" title="Déplacer à gauche">⬅️</button>
                                                                <button class="btn btn-xs join-item" @click="moveItemInGroup([-1], 'cell', cellItem.originalIndex, 1)" :disabled="isLastInGroup(childGroupModal.group, 'cell', cellItem.originalIndex)" title="Déplacer à droite">➡️</button>
                                                                <button class="btn btn-xs btn-error join-item" @click="deleteCellAt([-1], cellItem.originalIndex)" title="Supprimer">🗑️</button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    
                                                    <!-- Body de la cellule - utilise le rendu unifié de CellRenderer -->
                                                    <div x-html="CellRenderer.renderBody('[-1]', 'cellItem.originalIndex')"></div>
                                                </div>
                                                </div>
                                            </template>

                                            <template x-for="childItem in getSortedChildren(childGroupModal.group)" :key="childItem.child._id || ('child-' + childItem.originalIndex)">
                                                <div class="flex-1 bg-base-100 border border-base-300 rounded-lg overflow-hidden transition-all duration-200 shadow-sm hover:border-primary hover:shadow-md"

                                                     :style="'order: ' + (childItem.child._order ?? 0)"
                                                     x-data="{ _childPath: [-1, childItem.originalIndex] }"
                                                     x-html="renderChildGroupHTML(childItem.child, _childPath, childGroupModal.group, childItem.originalIndex)"
                                                     x-effect="$nextTick(() => Alpine.initTree($el))">
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </template>
    
        
        <!-- DevMode Toggle -->

        // ═══════════════════════════════════════════════════════════════════════════
        // STORE NON-RÉACTIF POUR LES DONNÉES DE TABLEAUX (évite le Proxy Alpine)
        // ═══════════════════════════════════════════════════════════════════════════
        // Les résultats volumineux de requêtes table sont stockés ici pour que
        // renderTableInContainer puisse itérer sans passer par le Proxy Alpine.js,
        // évitant ainsi des millions de traps Proxy qui freezent l'UI.
        const _rawTableDataStore = new Map();

        // ═══════════════════════════════════════════════════════════════════════════
        // STORE ALPINE.JS POUR LA MODALE DES TEMPLATES
        // ═══════════════════════════════════════════════════════════════════════════
        document.addEventListener('alpine:init', () => {
            Alpine.store('templateModal', {
                isOpen: false,
                currentCellId: null,
                currentQueryType: null,
                currentLanguageType: null,
                searchQuery: '',
                filteredTemplates: [],

                // Templates SQL
                sqlTemplates: [
                    {
                        name: "Liste des colonnes avec position",
                        description: "Affiche les colonnes d'une table avec leur position ordinale",
                        code: `SELECT
    column_name, ordinal_position::text || ' - ' || column_name
FROM information_schema.columns
WHERE table_name = 'source1'
ORDER BY ordinal_position;`
                    },
                    {
                        name: "Liste des colonnes",
                        description: "Affiche les noms des colonnes d'une table",
                        code: `SELECT
    column_name
FROM information_schema.columns
WHERE table_name = 'source1'
ORDER BY ordinal_position;`
                    },
                    {
                        name: "SELECT DISTINCT dynamique",
                        description: "Génère un SELECT DISTINCT avec toutes les colonnes",
                        code: `SELECT DISTINCT {{ SELECT column_name FROM information_schema.columns
WHERE table_name = 'source1'
ORDER BY ordinal_position;
}} FROM source1;`
                    },
                    {
                        name: "Valeurs Ajouter/Enlever",
                        description: "Table de valeurs pour opérations +/-",
                        code: `SELECT *
FROM (
  VALUES 
  ('+', '+ Ajouter'),
  ('-', '- Enlever')
) AS t(id, libelle);`
                    },
                    {
                        name: "SELECT DISTINCT paramétré",
                        description: "DISTINCT sur une colonne paramétrable",
                        code: `SELECT
    DISTINCT "$param1"
FROM source1
ORDER BY "$param1";`
                    },
                    {
                        name: "Import CSV avec géométrie",
                        description: "Import CSV SF avec extraction lon/lat depuis shape (DuckDB)",
                        code: `CREATE OR REPLACE TABLE source1 AS 
SELECT *,
    CAST(regexp_extract(shape, 'POINT \\(([^ ]+)', 1) AS DOUBLE) as lon,
    CAST(regexp_extract(shape, 'POINT \\([^ ]+ ([^)]+)', 1) AS DOUBLE) as lat
FROM read_csv('https://data.sfgov.org/resource/5cei-gny5.csv?$limit=50000', ALL_VARCHAR=true, HEADER=true)
WHERE shape IS NOT NULL;`
                    },
                    {
                        name: "SUMMARIZE",
                        description: "Résumé statistique de la table",
                        code: `SUMMARIZE FROM source1;`
                    },
                    {
                        name: "Échantillon 50 lignes",
                        description: "Sample aléatoire de 50 lignes",
                        code: `SELECT * FROM source1 USING SAMPLE 50 ROWS;`
                    },
                    {
                        name: "COPY Parquet vers CSV",
                        description: "Export Parquet vers fichier CSV",
                        code: `COPY (SELECT * FROM 'https://raw.githubusercontent.com/ihatexcel/sqljob/main/data/aws-edge-locations.parquet') TO 'source1.csv' (FORMAT csv, DELIMITER ';', HEADER);`
                    },
                    {
                        name: "COPY CSV vers Parquet",
                        description: "Export CSV vers fichier Parquet",
                        code: `COPY (SELECT * FROM read_csv_auto(
'http://raw.githubusercontent.com/fivethirtyeight/data/master/bechdel/movies.csv'))
TO 'movies.parquet' (FORMAT 'parquet');`
                    },
                    {
                        name: "SELECT colonnes avec préfixe",
                        description: "Sélectionne uniquement les colonnes commençant par 'dim_'",
                        code: `-- select only the column names that start with the dim_
SELECT COLUMNS('^dim_') FROM source1;`
                    }
                ],

                // Templates JavaScript
                jsTemplates: [
                    {
                        name: "Dropdown simple",
                        description: "Retourne un tableau d'options pour un dropdown",
                        code: `["Option 1", "Option 2", "Option 3"];`
                    },
                    {
                        name: "Valeur calculée",
                        description: "Retourne une valeur calculée dynamiquement",
                        code: `// Exemple de calcul
const today = new Date().toISOString().split('T')[0];
return today;`
                    },
                    {
                        name: "Dropdown conditionnel",
                        description: "Options qui dépendent d'un autre paramètre",
                        code: `// Options basées sur un autre paramètre
if ($param1 === "Type A") {
    return ["A1", "A2", "A3"];
} else {
    return ["B1", "B2", "B3"];
}`
                    }
                ],

                open(cellId, queryType, languageType = 'sql') {
                    this.currentCellId = cellId;
                    this.currentQueryType = queryType;
                    this.currentLanguageType = languageType;
                    this.searchQuery = '';
                    this.filterTemplates();
                    this.isOpen = true;
                },

                close() {
                    this.isOpen = false;
                    this.currentCellId = null;
                    this.currentQueryType = null;
                    this.currentLanguageType = null;
                    this.searchQuery = '';
                    this.filteredTemplates = [];
                },

                getCurrentTemplates() {
                    return this.currentLanguageType === 'js' ? this.jsTemplates : this.sqlTemplates;
                },

                getModalTitle() {
                    return this.currentLanguageType === 'js' ? '📋 Templates JavaScript' : '📋 Templates SQL';
                },

                filterTemplates() {
                    const query = this.searchQuery.toLowerCase().trim();
                    const templates = this.getCurrentTemplates();

                    if (!query) {
                        // Si pas de recherche, afficher tous les templates avec leur index original
                        this.filteredTemplates = templates.map((template, idx) => ({
                            ...template,
                            originalIndex: idx
                        }));
                        return;
                    }

                    // Filtrer les templates par recherche dans le nom, description et code
                    this.filteredTemplates = templates
                        .map((template, idx) => ({ ...template, originalIndex: idx }))
                        .filter(template => {
                            const searchIn = `${template.name} ${template.description} ${template.code}`.toLowerCase();
                            return searchIn.includes(query);
                        });
                },

                selectTemplate(templateIndex) {
                    if (this.currentCellId && this.currentQueryType && this.currentLanguageType) {
                        // Accéder à l'instance Alpine.js via le DOM
                        const appContainer = document.querySelector('[x-data]');
                        if (appContainer && appContainer._x_dataStack) {
                            const alpineInstance = appContainer._x_dataStack[0];
                            if (alpineInstance && alpineInstance.insertTemplate) {
                                alpineInstance.insertTemplate(this.currentCellId, this.currentQueryType, templateIndex, this.currentLanguageType);
                            }
                        }
                        this.close();
                    }
                }
            });
        });

        // ═══════════════════════════════════════════════════════════════════════════
        // APPLICATION ALPINE.JS
        // ═══════════════════════════════════════════════════════════════════════════
        function notebookApp() {
            // Utiliser la config chargée depuis le Gist si disponible, sinon la config par défaut
            const config = window._loadedConfig || ConfigManager.getDefaultConfig();

            // Helper pour initialiser une cellule avec ses propriétés runtime
            const initCell = (cell, cellIndex) => {
                const newCell = {
                    ...cell,
                    _id: 'cell_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                    _status: null,
                    _results: null,
                    _resultInfo: null,
                    _order: ConfigManager.normalizeOrder(cell.order, cellIndex)
                };

                if (cell.type === 'source') {
                    newCell._isDragging = false;
                    newCell._loaded = false;
                    ConfigManager.ensureCellFiles(cell);
                    newCell.files = cell.files;
                    const fileData = ConfigManager.getCellFileData(cell);
                    if (fileData) {
                        newCell._fileName = fileData.fileName;
                        const uint8Array = FileHandler.base64ToUint8Array(fileData.base64);
                        const blob = new Blob([uint8Array], { type: FileHandler.getMimeTypeFromFileName(fileData.fileName) });
                        newCell._currentFile = new File([blob], fileData.fileName, { type: blob.type });
                        newCell._pendingFileLoad = true;
                    } else {
                        newCell._fileName = '';
                        newCell._currentFile = null;
                    }
                }


                if (cell.type === 'uiParameter') {
                    if (cell.referenceName && (!cell.name || !String(cell.name).trim())) newCell.name = String(cell.referenceName).trim();
                    newCell._value = '';
                    newCell._options = [];
                    newCell._initialized = false;
                    newCell._paramError = null;
                }

                if (cell.type === 'publipostageWord') {
                    newCell._showParsedQuery = false;
                    newCell._showParsedQuery2 = false;
                    newCell._parseLevels = [];
                    newCell._parseLevels2 = [];
                    newCell._isDragging = false;
                    ConfigManager.ensureCellFiles(cell);
                    newCell.files = cell.files;
                    const fileData = ConfigManager.getCellFileData(cell);
                    if (fileData) {
                        newCell.docxTemplateBase64 = fileData.base64;
                        newCell.docxTemplateFileName = fileData.fileName;
                    }
                }

                if (cell.type === 'pdfme') {
                    newCell._showParsedQuery = false;
                    newCell._parseLevels = [];
                }

                if (['sqlRecursiveParse', 'table', 'iframe', 'sqlStat', 'perspective'].includes(cell.type)) {
                    newCell._showParsedQuery = false;
                }

                if (cell.type === 'perspective') {
                    newCell._perspectiveReady = false;
                    newCell._perspectiveWorker = null;
                    newCell._perspectiveTable = null;
                    newCell._arrowTable = null;
                    // Préserver json.perspectiveConfig depuis la config chargée
                    if (cell.json?.perspectiveConfig !== undefined) {
                        if (!newCell.json || typeof newCell.json !== 'object') newCell.json = {};
                        newCell.json.perspectiveConfig = cell.json.perspectiveConfig;
                    }
                }

                return newCell;
            };

            // Fonction récursive pour initialiser un groupe et ses enfants
            const initGroup = (group, groupIndex) => {
                const ng = ConfigManager.normalizeGroup({ ...group });
                const newGroup = {
                    _id: ng.id || ConfigManager.generateGroupId(),
                    _type: ng.type || 'core',
                    direction: ng.direction || 'row',
                    style: ng.style || '',
                    _order: ConfigManager.normalizeOrder(ng.order, groupIndex),
                    cells: (ng.cells || []).map((cell, cellIndex) => initCell(ConfigManager.normalizeCell({ ...cell }), cellIndex)),
                    // Config de loop
                    loop: ng.loop ? {
                        enabled: ng.loop.enabled || false,
                        query: ng.loop.query || '',
                        zip: ng.loop.zip || false,
                        zipQuery: ng.loop.zipQuery || ''
                    } : { enabled: false, query: '', zip: false, zipQuery: '' },
                    // Config accordion
                    accordion: ng.accordion || false,
                    title: ng.title || '',
                    accordionOpen: ng.accordionOpen !== false // true par défaut
                };

                // Ajouter tabsChild et name
                newGroup.tabsChild = ng.tabsChild || false;
                newGroup.name = ng.name || '';

                if (Array.isArray(ng.queries) && ng.queries.length > 0) {
                    newGroup.queries = ng.queries.map((q, i) => ({
                        name: q.name || 'main',
                        sql: q.sql || '',
                        engine: q.engine || 'sql',
                        clientVisible: q.clientVisible === true
                    }));
                } else {
                    newGroup.queries = [];
                }

                if (ng.children && ng.children.length > 0) {
                    newGroup.children = ng.children.map((child, childIndex) => {
                        const initializedChild = initGroup(child, childIndex);
                        initializedChild._order = ConfigManager.normalizeOrder(child.order, childIndex);
                        return initializedChild;
                    });
                }

                return newGroup;
            };

            // Initialiser les pages depuis la config
            let initPages = [];

            initPages = (config.job?.pages || []).map((page, pageIndex) => {
                    const allGroups = (page.groups || []).map((group, groupIndex) => initGroup(group, groupIndex));
                    const initGroups = allGroups.filter(g => g._type === 'core');
                    const initLinkGroups = allGroups.filter(g => g._type === 'link');

                    return {
                        _id: page.id || ConfigManager.generatePageId(),
                        name: page.name || `Feuille ${pageIndex + 1}`,
                        groups: initGroups,
                        linkGroups: initLinkGroups
                    };
                });
