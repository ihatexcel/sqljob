    <style>

            display: none !important;
        }

        /* Simple-datatables dark mode fix */

        .datatable-input,

        /* Container query pour le responsive */

            container-type: inline-size;
            display: flex;
            flex-direction: column;
            min-height: 0;

        @container (max-width: 350px) {
            .cell-header-responsive .flex.gap-1.items-center>.join {

            .cell-header-responsive .flex.gap-1.items-center>.dropdown.hidden {

            /* Afficher le dropdown dans les headers de groupes */

        /* Empêcher DaisyUI d'écraser les styles EasyMDE */

        .editor-preview *:not(h1):not(h2):not(h3):not(h4):not(h5):not(h6),
        .editor-preview-side *:not(h1):not(h2):not(h3):not(h4):not(h5):not(h6),

        .easymde-client .cm-scroller,
        .easymde-client .editor-preview,

            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .easymde-client .CodeMirror::-webkit-scrollbar,
        .easymde-client .CodeMirror-scroll::-webkit-scrollbar,
        .easymde-client .cm-editor::-webkit-scrollbar,
        .easymde-client .cm-scroller::-webkit-scrollbar,
        .easymde-client .editor-preview::-webkit-scrollbar,
        .easymde-client .editor-preview-full::-webkit-scrollbar {

        /* Hauteur cellule : variables CSS + max/min natifs (px et % combinables) */

        /* Perspective: remplir tout l'espace disponible (quand hasCellHeight) */

        /* Markdown/EasyMDE : remplir la hauteur quand cell-body a min/max height */

        /* Styles pour les titres - doit venir APRÈS all: revert */

<body class="min-h-screen font-sans bg-base-100 text-base-content transition-colors duration-200">
    <div id="app-container"></div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════════
        // ARCHITECTURE NOTEBOOK - Système de cellules
        // ═══════════════════════════════════════════════════════════════════════════

        // ═══════════════════════════════════════════════════════════════════════════
        // FONCTION UTILITAIRE: formatValueForInputType
        // ═══════════════════════════════════════════════════════════════════════════
        function formatValueForInputType(value, inputType) {
            if (value === null || value === undefined || value === '') return '';

            // Essayer de parser comme Date si nécessaire
            let dateObj = null;
            if (value instanceof Date) {
                dateObj = value;
            } else if (typeof value === 'number') {
                // Timestamp en millisecondes
                dateObj = new Date(value);
            } else if (typeof value === 'string') {
                // Essayer de parser la string comme date
                const parsed = new Date(value);
                if (!isNaN(parsed.getTime())) {
                    dateObj = parsed;
                }
            }

            // Formater selon le type d'input
            switch (inputType) {
                case 'date':
                    if (dateObj) {
                        const year = dateObj.getFullYear();
                        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                        const day = String(dateObj.getDate()).padStart(2, '0');
                        return `${year}-${month}-${day}`;
                    }
                    break;
                case 'datetime-local':
                    if (dateObj) {
                        const year = dateObj.getFullYear();
                        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                        const day = String(dateObj.getDate()).padStart(2, '0');
                        const hours = String(dateObj.getHours()).padStart(2, '0');
                        const minutes = String(dateObj.getMinutes()).padStart(2, '0');
                        return `${year}-${month}-${day}T${hours}:${minutes}`;
                    }
                    break;
                case 'time':
                    if (dateObj) {
                        const hours = String(dateObj.getHours()).padStart(2, '0');
                        const minutes = String(dateObj.getMinutes()).padStart(2, '0');
                        return `${hours}:${minutes}`;
                    }
                    // Si c'est déjà une string de temps (HH:mm ou HH:mm:ss)
                    if (typeof value === 'string' && /^\d{1,2}:\d{2}(:\d{2})?$/.test(value)) {
                        const parts = value.split(':');
                        return `${parts[0].padStart(2, '0')}:${parts[1].padStart(2, '0')}`;
                    }
                    break;
                case 'month':
                    if (dateObj) {
                        const year = dateObj.getFullYear();
                        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                        return `${year}-${month}`;
                    }
                    break;
                case 'week':
                    if (dateObj) {
                        // Calculer le numéro de semaine ISO
                        const tempDate = new Date(dateObj.getTime());
                        tempDate.setHours(0, 0, 0, 0);
                        tempDate.setDate(tempDate.getDate() + 3 - (tempDate.getDay() + 6) % 7);
                        const week1 = new Date(tempDate.getFullYear(), 0, 4);
                        const weekNum = 1 + Math.round(((tempDate.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
                        return `${tempDate.getFullYear()}-W${String(weekNum).padStart(2, '0')}`;
                    }
                    break;
            }

            // Par défaut, retourner la valeur convertie en string
            return String(value);
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // CLASSE 0: CDNManager - Chargement dynamique des CDN
        // ═══════════════════════════════════════════════════════════════════════════
        class CDNManager {
            static loadedScripts = new Set();
            static loadingPromises = new Map();

            static async loadScript(url) {
                if (this.loadedScripts.has(url)) {
                    return Promise.resolve();
                }

                if (this.loadingPromises.has(url)) {
                    return this.loadingPromises.get(url);
                }

                const promise = new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = url;
                    script.onload = () => {
                        this.loadedScripts.add(url);
                        this.loadingPromises.delete(url);
                        resolve();
                    };
                    script.onerror = () => {
                        this.loadingPromises.delete(url);
                        reject(new Error(`Échec du chargement: ${url}`));
                    };
                    document.head.appendChild(script);
                });

                this.loadingPromises.set(url, promise);
                return promise;
            }

            static async loadPizZip() {
                const pizzipUrl = 'https://cdn.jsdelivr.net/npm/pizzip@3.2.0/dist/pizzip.min.js';
                if (typeof PizZip === 'undefined') {
                    await this.loadScript(pizzipUrl);
                } else {
                    this.loadedScripts.add(pizzipUrl);
                }
            }

            static async loadDocxtemplater() {
                const docxtemplaterUrl = 'https://cdn.jsdelivr.net/npm/docxtemplater@3.67.6/build/docxtemplater.min.js';

                // PizZip doit être chargé avant docxtemplater
                await this.loadPizZip();

                if (typeof window.docxtemplater === 'undefined') {
                    await this.loadScript(docxtemplaterUrl);
                } else {
                    this.loadedScripts.add(docxtemplaterUrl);
                }
            }

            static async loadSimpleDatatables() {
                const simpleDatatablesUrl = 'https://cdn.jsdelivr.net/npm/simple-datatables@10.2.0/dist/umd/simple-datatables.min.js';
                const simpleDatatablesCssUrl = 'https://cdn.jsdelivr.net/npm/simple-datatables@10.2.0/dist/style.min.css';

                // Charger le CSS si pas déjà chargé
                if (!document.querySelector(`link[href="${simpleDatatablesCssUrl}"]`)) {
                    const link = document.createElement('link');
                    link.rel = 'stylesheet';
                    link.href = simpleDatatablesCssUrl;
                    document.head.appendChild(link);
                }

                if (typeof simpleDatatables !== 'undefined') {
                    this.loadedScripts.add(simpleDatatablesUrl);
                    return;
                }
                await this.loadScript(simpleDatatablesUrl);
            }

            static async loadPdfme() {
                if (window._pdfmeModules) {
                    return window._pdfmeModules;
                }
                try {
                    const commonPromise = import('https://cdn.jsdelivr.net/npm/@pdfme/common@5.5.8/+esm');
                    const generatorPromise = import('https://cdn.jsdelivr.net/npm/@pdfme/generator@5.5.8/+esm');
                    const schemasPromise = import('https://cdn.jsdelivr.net/npm/@pdfme/schemas@5.5.8/+esm');

                    const [common, generator, schemas] = await Promise.all([commonPromise, generatorPromise, schemasPromise]);

                    window._pdfmeModules = { common, generator, schemas };
                    return window._pdfmeModules;
                } catch (err) {
                    console.error('[pdfme CDN] ERREUR chargement:', err);
                    console.error('[pdfme CDN] Stack:', err.stack);
                    throw err;
                }
            }

            static loadedStyles = new Set();

            static async loadStyle(url) {
                if (this.loadedStyles.has(url)) return;

                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = url;
                document.head.appendChild(link);
                this.loadedStyles.add(url);
            }

            static async loadEasyMDE() {
                const easymdeJsUrl = 'https://cdn.jsdelivr.net/npm/easymde@2.20.0/dist/easymde.min.js';
                const easymdeCssUrl = 'https://cdn.jsdelivr.net/npm/easymde@2.20.0/dist/easymde.min.css';

                // Charger le CSS
                this.loadStyle(easymdeCssUrl);

                // Charger le JS
                if (typeof EasyMDE !== 'undefined') {
                    this.loadedScripts.add(easymdeJsUrl);
                    return;
                }
                await this.loadScript(easymdeJsUrl);
            }

            static async loadXlsx() {
                const xlsxUrl = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
                if (typeof XLSX !== 'undefined') {
                    this.loadedScripts.add(xlsxUrl);
                    return;
                }
                await this.loadScript(xlsxUrl);
            }

            // CodeMirror SQL avec marimo-team/codemirror-sql
            static codeMirrorSQLLoaded = false;
            static codeMirrorSQLModules = null;
            static codeMirrorSQLLoadingPromise = null;

            static async loadCodeMirrorSQL() {
                if (this.codeMirrorSQLLoaded && this.codeMirrorSQLModules) {
                    return this.codeMirrorSQLModules;
                }

                if (this.codeMirrorSQLLoadingPromise) {
                    return this.codeMirrorSQLLoadingPromise;
                }

                this.codeMirrorSQLLoadingPromise = (async () => {
                    try {

                        // Créer un import map pour forcer le partage des dépendances
                        if (!document.querySelector('script[type="importmap"]')) {
                            const importMap = document.createElement('script');
                            importMap.type = 'importmap';
                            importMap.textContent = JSON.stringify({
                                imports: {
                                    "@codemirror/state": "https://esm.sh/@codemirror/state@6.4.1",
                                    "@codemirror/view": "https://esm.sh/@codemirror/view@6.26.3",
                                    "@codemirror/language": "https://esm.sh/@codemirror/language@6.10.1",
                                    "@codemirror/commands": "https://esm.sh/@codemirror/commands@6.5.0",
                                    "@codemirror/search": "https://esm.sh/@codemirror/search@6.5.6",
                                    "@codemirror/autocomplete": "https://esm.sh/@codemirror/autocomplete@6.16.0",
                                    "@codemirror/lint": "https://esm.sh/@codemirror/lint@6.8.0",
                                    "@lezer/common": "https://esm.sh/@lezer/common@1.2.1",
                                    "@lezer/highlight": "https://esm.sh/@lezer/highlight@1.2.0",
                                    "@lezer/lr": "https://esm.sh/@lezer/lr@1.4.0",
                                    "style-mod": "https://esm.sh/style-mod@4.1.2",
                                    "w3c-keyname": "https://esm.sh/w3c-keyname@2.2.8"
                                }
                            });
                            document.head.insertBefore(importMap, document.head.firstChild);

                            // Attendre un tick pour que l'import map soit pris en compte
                            await new Promise(r => setTimeout(r, 0));
                        }

                        // Import séquentiel pour éviter les conflits
                        const stateModule = await import('https://esm.sh/@codemirror/state@6.4.1');
                        const viewModule = await import('https://esm.sh/@codemirror/view@6.26.3?deps=@codemirror/state@6.4.1');
                        const languageModule = await import('https://esm.sh/@codemirror/language@6.10.1?deps=@codemirror/state@6.4.1,@codemirror/view@6.26.3');
                        const commandsModule = await import('https://esm.sh/@codemirror/commands@6.5.0?deps=@codemirror/state@6.4.1,@codemirror/view@6.26.3,@codemirror/language@6.10.1');
                        const searchModule = await import('https://esm.sh/@codemirror/search@6.5.6?deps=@codemirror/state@6.4.1,@codemirror/view@6.26.3');
                        const autocompleteModule = await import('https://esm.sh/@codemirror/autocomplete@6.16.0?deps=@codemirror/state@6.4.1,@codemirror/view@6.26.3,@codemirror/language@6.10.1,@codemirror/commands@6.5.0');
                        const langSqlModule = await import('https://esm.sh/@codemirror/lang-sql@6.6.4?deps=@codemirror/state@6.4.1,@codemirror/view@6.26.3,@codemirror/language@6.10.1,@codemirror/autocomplete@6.16.0');
                        const themeOneDarkModule = await import('https://esm.sh/@codemirror/theme-one-dark@6.1.2?deps=@codemirror/state@6.4.1,@codemirror/view@6.26.3');

                        // Créer basicSetup manuellement
                        const basicSetup = [
                            viewModule.lineNumbers(),
                            viewModule.highlightActiveLineGutter(),
                            viewModule.highlightSpecialChars(),
                            commandsModule.history(),
                            languageModule.foldGutter(),
                            viewModule.drawSelection(),
                            viewModule.dropCursor(),
                            stateModule.EditorState.allowMultipleSelections.of(true),
                            languageModule.indentOnInput(),
                            languageModule.syntaxHighlighting(languageModule.defaultHighlightStyle, { fallback: true }),
                            languageModule.bracketMatching(),
                            autocompleteModule.closeBrackets(),
                            autocompleteModule.autocompletion(),
                            viewModule.rectangularSelection(),
                            viewModule.crosshairCursor(),
                            viewModule.highlightActiveLine(),
                            searchModule.highlightSelectionMatches(),
                            viewModule.keymap.of([
                                ...autocompleteModule.closeBracketsKeymap,
                                ...commandsModule.defaultKeymap,
                                ...searchModule.searchKeymap,
                                ...commandsModule.historyKeymap,
                                ...languageModule.foldKeymap,
                                ...autocompleteModule.completionKeymap
                            ])
                        ];

                        this.codeMirrorSQLModules = {
                            EditorView: viewModule.EditorView,
                            EditorState: stateModule.EditorState,
                            basicSetup: basicSetup,
                            sql: langSqlModule.sql,
                            StandardSQL: langSqlModule.StandardSQL,
                            DuckDBSQL: langSqlModule.DuckDBSQL || langSqlModule.StandardSQL,
                            oneDark: themeOneDarkModule.oneDark,
                            sqlExtension: null,
                            cteCompletionSource: null
                        };

                        this.codeMirrorSQLLoaded = true;
                        return this.codeMirrorSQLModules;
                    } catch (error) {
                        console.error('❌ Erreur chargement CodeMirror SQL:', error);
                        this.codeMirrorSQLLoadingPromise = null;
                        throw error;
                    }
                })();

                return this.codeMirrorSQLLoadingPromise;
            }

            // Créer une instance d'éditeur CodeMirror SQL
            static createSqlEditor(container, initialValue, onChange, options = {}) {
                if (!this.codeMirrorSQLModules) {
                    throw new Error('CodeMirror SQL non chargé. Appelez loadCodeMirrorSQL() d\'abord.');
                }

                const {
                    EditorView, basicSetup, sql, StandardSQL, DuckDBSQL,
                    sqlExtension, cteCompletionSource, oneDark
                } = this.codeMirrorSQLModules;

                const isDarkTheme = document.documentElement.getAttribute('data-theme')?.includes('dark') ||
                    window.matchMedia('(prefers-color-scheme: dark)').matches;

                const schema = options.schema || {};
                const dialect = options.dialect === 'duckdb' ? DuckDBSQL : StandardSQL;

                const extensions = [
                    basicSetup,
                    sql({
                        dialect: dialect,
                        schema: schema,
                        upperCaseKeywords: true,
                    }),
                    EditorView.updateListener.of((update) => {
                        if (update.docChanged && onChange) {
                            onChange(update.state.doc.toString());
                        }
                    }),
                    EditorView.theme({
                        '&': {
                            fontSize: '14px',
                            minHeight: '20px',
                            border: '1px solid oklch(var(--b3))',
                            borderRadius: '0.5rem',
                        },
                        '.cm-scroller': {
                            fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace',
                            minHeight: '20px',
                            maxHeight: '250px',
                            overflow: 'auto',
                        },
                        '.cm-content': {
                            padding: '0.5rem 0',
                        },
                        '.cm-gutters': {
                            borderRadius: '0.5rem 0 0 0.5rem',
                        },
                        '&.cm-focused': {
                            outline: '2px solid oklch(var(--p))',
                            outlineOffset: '-1px',
                        },
                    }),
                ];

                // Ajouter marimo-sql si disponible
                if (cteCompletionSource) {
                    extensions.push(dialect.language.data.of({
                        autocomplete: cteCompletionSource,
                    }));
                }

                if (sqlExtension) {
                    extensions.push(sqlExtension({
                        linterConfig: { delay: 300 },
                        gutterConfig: {
                            backgroundColor: '#3b82f6',
                            errorBackgroundColor: '#ef4444',
                            hideWhenNotFocused: true,
                        },
                        enableHover: true,
                        hoverConfig: {
                            schema: schema,
                            hoverTime: 300,
                            enableKeywords: true,
                            enableTables: true,
                            enableColumns: true,
                        },
                    }));
                }

                if (isDarkTheme) {
                    extensions.push(oneDark);
                }

                const editor = new EditorView({
                    doc: initialValue || '',
                    extensions: extensions,
                    parent: container,
                });

                return editor;
            }

            static perspectiveLoaded = false;
            static perspectiveLoadingPromise = null;

            static async loadPerspective() {
                if (this.perspectiveLoaded) return;

                if (this.perspectiveLoadingPromise) {
                    return this.perspectiveLoadingPromise;
                }

                this.perspectiveLoadingPromise = (async () => {
                    // Charger le CSS themes
                    const themeCssUrl = 'https://cdn.jsdelivr.net/npm/@perspective-dev/viewer/dist/css/themes.css';
                    if (!document.querySelector(`link[href="${themeCssUrl}"]`)) {
                        const link = document.createElement('link');
                        link.rel = 'stylesheet';
                        link.crossOrigin = 'anonymous';
                        link.href = themeCssUrl;

                        // Attendre que le CSS soit chargé
                        await new Promise((resolve, reject) => {
                            link.onload = resolve;
                            link.onerror = reject;
                            document.head.appendChild(link);
                        });
                    }

                    // Charger les modules ES6 pour Perspective
                    await import('https://cdn.jsdelivr.net/npm/@perspective-dev/viewer@4.1.0/dist/cdn/perspective-viewer.js');
                    await import('https://cdn.jsdelivr.net/npm/@perspective-dev/viewer-datagrid@4.1.0/dist/cdn/perspective-viewer-datagrid.js');
                    await import('https://cdn.jsdelivr.net/npm/@perspective-dev/viewer-d3fc@4.1.0/dist/cdn/perspective-viewer-d3fc.js');
                    await import('https://cdn.jsdelivr.net/npm/@perspective-dev/viewer-openlayers@4.1.0/dist/cdn/perspective-viewer-openlayers.js');

                    // Charger le client perspective
                    const perspectiveModule = await import('https://cdn.jsdelivr.net/npm/@perspective-dev/client@4.1.0/dist/cdn/perspective.js');
                    window.perspectiveClient = perspectiveModule.default;

                    this.perspectiveLoaded = true;
                })();

                return this.perspectiveLoadingPromise;
            }
        }

        // SERVICE CONFIG CELLULE (CellConfigService)
        // ═══════════════════════════════════════════════════════════════════════════
        class CellConfigService {
            static getSchemaForType(type) {
                return CELL_TYPE_SCHEMAS.types[type] || null;
            }
            static getCommonParamDef(paramKey, type) {
                const common = CELL_TYPE_SCHEMAS.common[paramKey];
                if (!common) return null;
                const schema = CELL_TYPE_SCHEMAS.types[type];
                if (!schema) return common;
                const override = schema[paramKey + 'Label'] || schema[paramKey + 'Tooltip'] || schema[paramKey + 'Placeholder'];
                const label = schema[paramKey + 'Label'] ?? common.label;
                const tooltip = schema[paramKey + 'Tooltip'] ?? common.tooltip;
                const placeholder = schema[paramKey + 'Placeholder'] ?? common.placeholder;
                return { ...common, label, tooltip, placeholder };
            }
            static getCommonParamsForType(type) {
                const schema = CELL_TYPE_SCHEMAS.types[type];
                return (schema?.commonParams || ['name']).filter(p => CELL_TYPE_SCHEMAS.common[p]);
            }
            static getSpecificParamsForType(type) {
                if (type == null) return [];
                return CELL_TYPE_SCHEMAS.types[type]?.specificParams || [];
            }
            static ensureCellFromSchema(cell, type, opts = {}) {
                const schema = CELL_TYPE_SCHEMAS.types[type];
                if (!schema || !cell) return;
                const { baseName } = opts;
                const defaults = schema.defaults || {};
                for (const [k, v] of Object.entries(defaults)) {
                    if (k === 'queries') {
                        const qNames = schema.queryNames ?? (schema.queryCount ? Array.from({ length: schema.queryCount }, (_, i) => i === 0 ? 'main' : i === 1 ? 'filename' : 'query' + i) : ['main']);
                        for (let i = 0; i < qNames.length; i++) {
                            const qName = qNames[i];
                            ConfigManager.ensureCellQueries(cell, qName);
                            const d = Array.isArray(v) ? (v.find(x => x.name === qName) || v[i]) : { sql: '', engine: 'sql', clientVisible: false };
                            const q = ConfigManager.getQueryByName(cell, qName);
                            if (q && d) {
                                if (!q.sql && d.sql) {
                                    const sql = (typeof d.sql === 'string' && baseName) ? d.sql.replace(/\{name\}/g, baseName) : d.sql;
                                    q.sql = sql;
                                }
                                if (d.engine !== undefined && q.engine === undefined) q.engine = d.engine;
                                if (d.clientVisible !== undefined && q.clientVisible === undefined) q.clientVisible = d.clientVisible;
                            }
                        }
                    } else if (cell[k] === undefined) {
                        if (k === 'json' && typeof v === 'object') cell.json = { ...v };
                        else if (typeof v === 'object' && v !== null && !Array.isArray(v)) cell[k] = { ...v };
                        else cell[k] = v;
                    } else if (k === 'json' && typeof v === 'object' && cell.json && typeof cell.json === 'object') {
                        // Fusionner les clés manquantes du défaut sans écraser les valeurs chargées (ex: json.perspectiveConfig)
                        for (const [dk, dv] of Object.entries(v)) {
                            if (cell.json[dk] === undefined) cell.json[dk] = dv;
                        }
                    }
                }
                const qNames = schema.queryNames ?? (schema.queryCount ? Array.from({ length: schema.queryCount }, (_, i) => i === 0 ? 'main' : i === 1 ? 'filename' : 'query' + i) : ['main']);
                for (const qName of qNames) ConfigManager.ensureCellQueries(cell, qName);
                if (schema.defaults?.json !== undefined && !cell.json) cell.json = {};
            }
            static applyDefaultsOnTypeChange(cell, newType, opts = {}) {
                if (!cell) return;
                const schema = CELL_TYPE_SCHEMAS.types[newType];
                if (!schema) return;
                const oldType = opts.oldType || cell.type;
                const oldSchema = CELL_TYPE_SCHEMAS.types[oldType];
                const newParamKeys = new Set([...(schema.commonParams || []), ...(schema.specificParams || []).map(p => (typeof p === 'object' ? p.key : p).split('.')[0].split('[')[0])]);
                const typeSpecificKeys = ['content', 'paramType', 'inputType', 'rangeMin', 'rangeMax', 'rangeStep', 'userVisible', 'userEditable', 'preserveUserValue', 'maxRows', 'perspectiveCdns'];
                for (const key of typeSpecificKeys) {
                    if (!newParamKeys.has(key)) delete cell[key];
                }
                delete cell.json;
                cell.type = newType;
                this.ensureCellFromSchema(cell, newType, opts);
            }
            static isSpecificParamVisible(param, cell) {
                if (!param.when || !cell) return true;
                for (const [k, v] of Object.entries(param.when)) {
                    if (cell[k] !== v) return false;
                }
                return true;
            }
            /** Lit une valeur via un chemin (ex: 'queries.main.sql', 'queries[0].sql' rétrocompat, 'json.xlsx'). Pour json.xlsx retourne JSON.stringify. */
            static getCellValueByPath(cell, path) {
                if (!cell || !path) return undefined;
                // Pour markdown: la modale doit TOUJOURS afficher la requête (queries.main.sql), jamais le résultat (_markdownContent)
                if (path === 'content' && cell.type === 'markdown') {
                    const engine = ConfigManager.getCellEngine(cell, 'main');
                    const queryVal = ConfigManager.getCellQuery(cell, 'main') || '';
                    const result = (engine === 'sql' || engine === 'js') ? queryVal : ConfigManager.getMarkdownContent(cell);
                    return result;
                }
                if (path === 'json.xlsx') return JSON.stringify(cell.json?.xlsx || {}, null, 2);
                if (path === 'json.perspectiveConfig') return cell.json?.perspectiveConfig ?? '';
                // Rétrocompat: queries[0] -> queries.main, queries[1] -> queries.fallback ou queries.filename selon le type
                const qMatch = path.match(/^queries\[(\d+)\]\.(.*)$/);
                if (qMatch) {
                    const idx = parseInt(qMatch[1], 10);
                    const subPath = qMatch[2];
                    const schema = CELL_TYPE_SCHEMAS?.types[cell?.type];
                    const name = schema?.queryNames?.[idx] ?? (idx === 0 ? 'main' : idx === 1 ? 'filename' : '');
                    if (name) path = `queries.${name}.${subPath}`;
                }
                if (path.startsWith('queries.')) {
                    const parts = path.split('.');
                    if (parts.length >= 3 && parts[0] === 'queries') {
                        const qName = parts[1];
                        const subPath = parts.slice(2).join('.');
                        let q = Array.isArray(cell.queries) && cell.queries.find(x => x.name === qName);
                        if (!q) {
                            const schema = CELL_TYPE_SCHEMAS?.types[cell?.type];
                            const idx = schema?.queryNames?.indexOf(qName);
                            if (idx >= 0 && cell.queries?.[idx]) q = cell.queries[idx];
                        }
                        if (q && subPath) {
                            const val = q[subPath];
                            const ret = (subPath === 'engine' && val === undefined && cell.type === 'markdown') ? 'text' : val;
                            return ret;
                        }
                    }
                }
                const parts = path.replace(/\]/g, '').split(/\.|\[/).filter(Boolean);
                let v = cell;
                for (const p of parts) v = v?.[isNaN(p) ? p : parseInt(p, 10)];
                return v;
            }
            /** Écrit une valeur via un chemin. Pour json.xlsx : value est une chaîne JSON. Supporte queries.main.xxx et queries[0].xxx (rétrocompat). */
            static setCellValueByPath(cell, path, value) {
                if (!cell || !path) return;
                if (path === 'content' && cell.type === 'markdown') { ConfigManager.setMarkdownContent(cell, value); return; }
                if (path === 'json.xlsx') {
                    if (!cell.json) cell.json = {};
                    try { cell.json.xlsx = JSON.parse(value); } catch (e) {}
                    return;
                }
                if (path === 'json.perspectiveConfig') {
                    if (!cell.json) cell.json = {};
                    cell.json.perspectiveConfig = typeof value === 'string' ? value : (value ?? '');
                    return;
                }
                if (path.startsWith('json.') && !cell.json) cell.json = {};
                const qMatch = path.match(/^queries\[(\d+)\]\.(.*)$/);
                if (qMatch) {
                    const idx = parseInt(qMatch[1], 10);
                    const subPath = qMatch[2];
                    const schema = CELL_TYPE_SCHEMAS?.types[cell?.type];
                    const name = schema?.queryNames?.[idx] ?? (idx === 0 ? 'main' : idx === 1 ? 'filename' : '');
                    if (name) path = `queries.${name}.${subPath}`;
                }
                if (path.startsWith('queries.')) {
                    const parts = path.split('.');
                    if (parts.length >= 3 && parts[0] === 'queries') {
                        const qName = parts[1];
                        const subPath = parts.slice(2).join('.');
                        if (!Array.isArray(cell.queries)) cell.queries = [];
                        let q = cell.queries.find(x => x.name === qName);
                        if (!q) {
                            q = { name: qName, sql: '', engine: 'sql', clientVisible: false };
                            cell.queries.push(q);
                        }
                        if (q && subPath) {
                            q[subPath] = value;
                        }
                        return;
                    }
                }
                const parts = path.replace(/\]/g, '').split(/\.|\[/).filter(Boolean);
                const last = parts.pop();
                let target = cell;
                for (let i = 0; i < parts.length; i++) {
                    const p = parts[i];
                    const key = isNaN(p) ? p : parseInt(p, 10);
                    const next = parts[i + 1];
                    if (target[key] === undefined) target[key] = (next !== undefined && !isNaN(next)) ? [] : {};
                    target = target[key];
                }
                if (target) target[last] = value;
            }
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // CLASSE 1: ConfigManager
        // ═══════════════════════════════════════════════════════════════════════════
        class ConfigManager {
            static SQLJOB_VERSION = '0.1';

            static getDefaultConfig() {
                try {
                    const scriptElement = document.getElementById('defaultConfigBase64');
                    const defaultConfigBase64 = scriptElement?.textContent?.trim();

                    if (!defaultConfigBase64) return { job: { cells: [] } };

                    try {
                        const base64Decoded = atob(defaultConfigBase64);
                        const decoded = decodeURIComponent(escape(base64Decoded));
                        return JSON.parse(decoded);
                    } catch {
                        return JSON.parse(atob(defaultConfigBase64));
                    }
                } catch (error) {
                    console.error('Erreur de décodage config:', error);
                    return { job: { cells: [] } };
                }
            }

            /**
             * Charge la config par défaut (defaultConfigBase64) ou détecte si elle est chiffrée (export HTML).
             * @returns {{ config } | { needsPassphrase: true, encryptedContent, source: 'html' }}
             */
            static loadDefaultConfigOrEncrypted() {
                const scriptElement = document.getElementById('defaultConfigBase64');
                const raw = scriptElement?.textContent?.trim();
                if (!raw) return { config: { job: { cells: [] } } };
                try {
                    const base64Decoded = atob(raw);
                    let decodedStr;
                    try {
                        decodedStr = decodeURIComponent(escape(base64Decoded));
                    } catch {
                        decodedStr = base64Decoded;
                    }
                    const parsed = JSON.parse(decodedStr);
                    if (GistEncrypt.isEncrypted(parsed)) {
                        return { needsPassphrase: true, encryptedContent: parsed, source: 'html' };
                    }
                    return { config: parsed };
                } catch (e) {
                    try {
                        const parsed = JSON.parse(atob(raw));
                        if (GistEncrypt.isEncrypted(parsed)) {
                            return { needsPassphrase: true, encryptedContent: parsed, source: 'html' };
                        }
                        return { config: parsed };
                    } catch (err) {
                        console.error('Erreur de décodage config:', err);
                        return { config: { job: { cells: [] } } };
                    }
                }
            }

            static normalizeOrder(value, fallback) {
                if (value === undefined || value === null) return fallback;
                if (typeof value === 'string' && value.trim() === '') return fallback;
                const parsed = Number(value);
                return Number.isFinite(parsed) ? parsed : fallback;
            }

            /**
             * Normalise une cellule (schéma unifié refacto.md). Migre les queries sans name.
             */
            static normalizeCell(cell) {
                if (!cell || !cell.type) return cell;
                const c = { ...cell };
                if (c.type === 'markdown' && c.content && !ConfigManager.getCellQuery(c, 'main')) {
                    ConfigManager.ensureCellQueries(c, 'main');
                    const q = ConfigManager.getQueryByName(c, 'main');
                    if (q) q.sql = c.content;
                }
                if (Array.isArray(c.queries) && c.queries.length > 0) {
                    const schema = CELL_TYPE_SCHEMAS?.types[c.type];
                    const qNames = schema?.queryNames ?? ['main'];
                    c.queries = c.queries.map((q, i) => ({
                        ...q,
                        name: q.name || qNames[i] || (i === 0 ? 'main' : i === 1 ? 'filename' : 'query' + i)
                    }));
                }
                return c;
            }

            /**
             * Normalise un groupe (schéma unifié). Migre les queries de condition d'affichage sans name.
             */
            static normalizeGroup(group) {
                if (!group || !Array.isArray(group.queries)) return group;
                group.queries = group.queries.map((q, i) => ({
                    ...q,
                    name: q.name || (i === 0 ? 'main' : 'query' + i)
                }));
                return group;
            }

            /** Retourne la requête par nom (ex: 'main', 'fallback', 'filename'). Rétrocompat: index 0->main, 1->fallback/filename. */
            static getCellQuery(cell, nameOrIndex = 'main') {
                if (!cell) return '';
                const name = typeof nameOrIndex === 'number' ? (ConfigManager.getQueryNameForIndex(cell, nameOrIndex) || 'main') : nameOrIndex;
                const q = ConfigManager.getQueryByName(cell, name);
                return q ? (q.sql || '') : '';
            }

            /**
             * Indique si l'éditeur SQL est visible pour cette requête (clientVisible).
             */
            static getCellQueryClientVisible(cell, nameOrIndex = 'main') {
                if (!cell) return false;
                const name = typeof nameOrIndex === 'number' ? (ConfigManager.getQueryNameForIndex(cell, nameOrIndex) || 'main') : nameOrIndex;
                const q = ConfigManager.getQueryByName(cell, name);
                return q ? q.clientVisible === true : false;
            }

            /** Trouve une requête par nom dans cell.queries. Rétrocompat: si pas de name sur les queries, utilise l'index du schéma. */
            static getQueryByName(cell, name) {
                if (!cell || !Array.isArray(cell.queries)) return null;
                let q = cell.queries.find(x => x.name === name);
                if (!q) {
                    const schema = CELL_TYPE_SCHEMAS?.types[cell?.type];
                    const idx = schema?.queryNames?.indexOf(name);
                    if (idx >= 0 && cell.queries[idx]) q = cell.queries[idx];
                }
                return q || null;
            }

            /** Retourne l'index d'une requête par nom (pour x-model). Rétrocompat: si pas de name, utilise ordre schema. */
            static getQueryIndexByName(cell, name) {
                if (!cell?.queries) return 0;
                const idx = cell.queries.findIndex(q => q.name === name);
                if (idx >= 0) return idx;
                const schema = CELL_TYPE_SCHEMAS?.types[cell?.type];
                const schemaIdx = schema?.queryNames?.indexOf(name);
                return schemaIdx >= 0 ? schemaIdx : 0;
            }

            /** Retourne le nom de la requête pour un index (rétrocompat). */
            static getQueryNameForIndex(cell, index) {
                const schema = CELL_TYPE_SCHEMAS?.types[cell?.type];
                return schema?.queryNames?.[index] ?? (index === 0 ? 'main' : index === 1 ? 'filename' : null);
            }

            /** Contenu markdown à afficher : si engine text = contenu éditable ; si sql/js = _markdownContent (résultat d'exécution). */
            static getMarkdownDisplayContent(cell) {
                if (!cell) return '';
                const engine = ConfigManager.getCellEngine(cell, 'main');
                if (engine === 'sql' || engine === 'js') return cell._markdownContent || '';
                return ConfigManager.getMarkdownContent(cell);
            }

            /** Contenu markdown (queries.main.sql ou content en rétrocompat). */
            static getMarkdownContent(cell) {
                if (!cell) return '';
                return ConfigManager.getCellQuery(cell, 'main') || cell.content || '';
            }
            /** Définit le contenu markdown (queries.main + content pour rétrocompat). */
            static setMarkdownContent(cell, value) {
                if (!cell) return;
                ConfigManager.ensureCellQueries(cell, 'main');
                const q = ConfigManager.getQueryByName(cell, 'main');
                if (q) q.sql = value;
                cell.content = value;
            }

            /** Retourne le nom du paramètre pour le DAG (name pour uiParameter, rétrocompat referenceName). */
            static getCellReferenceName(cell) {
                if (!cell) return '';
                if (cell.type === 'uiParameter') return (cell.name ?? cell.referenceName ?? '').trim();
                return cell?.referenceName ?? '';
            }

            /**
             * Slot fichier unifié selon le type de cellule (source, docxTemplate).
             */
            static getCellFileSlot(cell) {
                if (!cell?.type) return null;
                if (cell.type === 'source') return 'source';
                if (cell.type === 'publipostageWord') return 'docxTemplate';
                return null;
            }

            /**
             * Lit les données fichier d'une cellule (structure unifiée files[] ou legacy fileBase64/fileName).
             * @returns {{ base64: string, fileName: string } | null}
             */
            static getCellFileData(cell) {
                if (!cell) return null;
                const slot = ConfigManager.getCellFileSlot(cell);
                if (!slot) return null;
                if (Array.isArray(cell.files) && cell.files.length > 0) {
                    const f = cell.files.find(x => x.slot === slot) || cell.files[0];
                    if (f?.base64 && f?.fileName) return { base64: f.base64, fileName: f.fileName, compressed: f.compressed === true };
                }
                if (cell.fileBase64 && cell.fileName) return { base64: cell.fileBase64, fileName: cell.fileName, compressed: cell.files?.[0]?.compressed === true };
                if (cell.type === 'publipostageWord' && cell.docxTemplateBase64 && cell.docxTemplateFileName) {
                    return { base64: cell.docxTemplateBase64, fileName: cell.docxTemplateFileName, compressed: cell.files?.[0]?.compressed === true };
                }
                return null;
            }

            /**
             * Écrit les données fichier (structure unifiée files[]) et met à jour les champs legacy.
             */
            static setCellFileData(cell, { base64, fileName }) {
                if (!cell || !base64 || !fileName) return;
                const slot = ConfigManager.getCellFileSlot(cell);
                if (!slot) return;
                ConfigManager.ensureCellFiles(cell);
                const idx = cell.files.findIndex(x => x.slot === slot);
                const entry = { slot, base64, fileName };
                if (idx >= 0) cell.files[idx] = entry; else cell.files.push(entry);
                cell.fileBase64 = base64;
                cell.fileName = fileName;
                if (cell.type === 'publipostageWord') {
                    cell.docxTemplateBase64 = base64;
                    cell.docxTemplateFileName = fileName;
                }
            }

            /** S'assure que cell.files existe. Migre legacy → files[0] si pertinent. */
            static ensureCellFiles(cell) {
                if (!cell) return;
                if (!Array.isArray(cell.files)) cell.files = [];
                const slot = ConfigManager.getCellFileSlot(cell);
                if (!slot || cell.files.some(f => f.slot === slot)) return;
                const data = ConfigManager.getCellFileData(cell);
                if (data) cell.files.push({ slot, base64: data.base64, fileName: data.fileName });
            }

            /** Retourne le moteur de la requête (queries[].engine). Valeurs: sql, js, text. Markdown: défaut 'text'. */
            static getCellEngine(cell, nameOrIndex = 'main') {
                if (!cell) return 'sql';
                const name = typeof nameOrIndex === 'number' ? (ConfigManager.getQueryNameForIndex(cell, nameOrIndex) || 'main') : nameOrIndex;
                const q = ConfigManager.getQueryByName(cell, name);
                const defaultEngine = cell.type === 'markdown' ? 'text' : 'sql';
                const e = q?.engine ? q.engine : defaultEngine;
                return e === 'duckdb-wasm' ? 'sql' : e;
            }

            /** S'assure que cell.queries existe et que la requête avec ce nom existe. Retourne la ref. Migre les queries sans name. */
            static ensureCellQueries(cell, nameOrIndex = 'main') {
                if (!cell) return null;
                if (!Array.isArray(cell.queries)) cell.queries = [];
                const schema = CELL_TYPE_SCHEMAS?.types[cell?.type];
                const name = typeof nameOrIndex === 'number' ? (schema?.queryNames?.[nameOrIndex] ?? (nameOrIndex === 0 ? 'main' : 'filename')) : nameOrIndex;
                let q = cell.queries.find(x => x.name === name);
                if (!q) {
                    const idx = schema?.queryNames?.indexOf(name);
                    if (idx >= 0 && cell.queries[idx] && !cell.queries[idx].name) {
                        cell.queries[idx].name = name;
                        q = cell.queries[idx];
                    } else {
                        const defaultEngine = cell.type === 'markdown' ? 'text' : 'sql';
                        q = { name, sql: '', engine: defaultEngine, clientVisible: false };
                        const insertIdx = schema?.queryNames?.indexOf(name) ?? cell.queries.length;
                        if (insertIdx < cell.queries.length) cell.queries.splice(insertIdx, 0, q);
                        else cell.queries.push(q);
                    }
                }
                return q;
            }

            /** S'assure que group.queries existe et que la requête condition d'affichage existe (name: 'main'). Retourne la requête. */
            static ensureGroupQueries(group) {
                if (!group) return null;
                if (!Array.isArray(group.queries)) group.queries = [];
                let q = group.queries.find(x => x.name === 'main');
                if (!q) {
                    if (group.queries[0] && !group.queries[0].name) { group.queries[0].name = 'main'; q = group.queries[0]; }
                    else { q = { name: 'main', sql: '', engine: 'sql', clientVisible: false }; group.queries.unshift(q); }
                }
                return q;
            }

            /** Retourne la requête conditionnelle du groupe (name: 'main') ou null. */
            static getGroupIfQuery(group) {
                if (!group) return null;
                if (!Array.isArray(group.queries) || group.queries.length === 0) return null;
                const q = group.queries.find(x => x.name === 'main') || group.queries[0];
                const hasSql = q && (q.sql || '').trim();
                return hasSql ? q : null;
            }

            /** Définit la requête par nom (ex: 'main', 'fallback', 'filename'). */
            static setCellQuery(cell, nameOrIndex, sql) {
                const q = ConfigManager.ensureCellQueries(cell, nameOrIndex);
                if (q) q.sql = sql;
            }

            static encodeUTF8ToBase64(str) {
                return btoa(unescape(encodeURIComponent(str)));
            }

            /**
             * Génère un ID unique pour un groupe
             */
            static generateGroupId() {
                return 'grp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            }

            /**
             * Génère un ID unique pour une page
             */
            static generatePageId() {
                return 'page_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            }

            static deepMerge(target, source) {
                const output = { ...target };
                if (target && typeof target === 'object' && source && typeof source === 'object') {
                    Object.keys(source).forEach(key => {
                        if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key])) {
                            output[key] = ConfigManager.deepMerge(target[key] || {}, source[key]);
                        } else {
                            output[key] = source[key];
                        }
                    });
                }
                return output;
            }

            /**
             * Parse les paramètres UI depuis l'URL
             * Paramètres supportés: devMode, showLayout (ou displaySettings rétrocompat), theme, dbEngine
             * @returns {Object} Objet contenant les paramètres UI trouvés dans l'URL
             */
            static getUIParamsFromURL() {
                const urlParams = new URLSearchParams(window.location.search);
                const uiParams = {};

                // devMode: boolean
                if (urlParams.has('devMode')) {
                    const val = urlParams.get('devMode').toLowerCase();
                    uiParams.devMode = val !== 'false' && val !== '0';
                }

                // showLayout: boolean (displaySettings conservé pour rétrocompat)
                if (urlParams.has('showLayout')) {
                    const val = urlParams.get('showLayout').toLowerCase();
                    uiParams.showLayout = val !== 'false' && val !== '0';
                } else if (urlParams.has('displaySettings')) {
                    const val = urlParams.get('displaySettings').toLowerCase();
                    uiParams.showLayout = val !== 'false' && val !== '0';
                }

                // theme: string
                if (urlParams.has('theme')) {
                    uiParams.theme = urlParams.get('theme');
                }

                // dbEngine: string
                if (urlParams.has('dbEngine')) {
                    uiParams.dbEngine = urlParams.get('dbEngine');
                }

                return uiParams;
            }

            /**
             * Applique les paramètres UI de l'URL sur une config existante
             * Priorité: URL > config existante
             */
            static applyURLParamsToConfig(config) {
                const urlParams = ConfigManager.getUIParamsFromURL();
                if (Object.keys(urlParams).length === 0) {
                    return config;
                }

                // Créer une copie de la config avec les paramètres URL appliqués
                const result = { ...config };
                result.ui = { ...(config.ui || {}), ...urlParams };
                return result;
            }

            /**
             * Décompresse les fichiers marqués compressed dans la config (JSON/Gist).
             * Modifie la config en place. Appelé avant d'utiliser la config.
             */
            static async prepareConfigForLoad(config) {
                if (!config?.job?.pages) return config;
                const decompressInGroup = async (group) => {
                    if (group.children?.length) {
                        for (const child of group.children) await decompressInGroup(child);
                    }
                    for (const cell of group.cells || []) {
                        if (!Array.isArray(cell.files)) continue;
                        for (const f of cell.files) {
                            if (f.compressed && f.base64 && f.fileName) {
                                try {
                                    const bytes = FileHandler.base64ToUint8Array(f.base64);
                                    const decompressed = await FileHandler.decompressGzip(bytes);
                                    f.base64 = FileHandler.arrayBufferToBase64(decompressed);
                                    delete f.compressed;
                                } catch (e) {
                                    console.warn('Décompression fichier échouée:', f.fileName, e);
                                }
                            }
                        }
                        if (cell.fileBase64 && cell.files?.[0]?.compressed) {
                            try {
                                const bytes = FileHandler.base64ToUint8Array(cell.fileBase64);
                                const decompressed = await FileHandler.decompressGzip(bytes);
                                cell.fileBase64 = FileHandler.arrayBufferToBase64(decompressed);
                                if (cell.files[0]) delete cell.files[0].compressed;
                            } catch (e) {
                                console.warn('Décompression fileBase64 échouée:', e);
                            }
                        }
                    }
                };
                for (const page of config.job.pages) {
                    for (const group of page.groups || []) await decompressInGroup(group);
                }
                return config;
            }

            /**
             * Charge la configuration avec la priorité: URL > gist > base64 > default
             */
            static async loadConfigFromGist() {
                const gistId = (() => {
                    const urlParams = new URLSearchParams(window.location.search);
                    const gistParam = urlParams.get('gist');
                    if (gistParam && /^[a-f0-9]{32}$/i.test(gistParam)) return gistParam;
                    if (gistParam) {
                        const match = gistParam.match(/gist\.github\.com\/[^\/]+\/([a-f0-9]{32})/i);
                        if (match) return match[1];
                    }
                    const configParam = urlParams.get('config');
                    if (configParam) {
                        const match = configParam.match(/gist\.github\.com\/[^\/]+\/([a-f0-9]{32})/i);
                        if (match) return match[1];
                    }
                    const fullUrlMatch = window.location.href.match(/gist\.github\.com\/[^\/]+\/([a-f0-9]{32})/i);
                    if (fullUrlMatch) return fullUrlMatch[1];
                    return null;
                })();

                let baseConfig = null;

                if (gistId) {
                    try {
                        const apiUrl = `https://api.github.com/gists/${gistId}`;
                        const response = await fetch(apiUrl);
                        if (response.ok) {
                            const gistData = await response.json();
                            const files = Object.values(gistData.files || {});
                            const jsonFile = files.find(file =>
                                file.filename.toLowerCase().endsWith('.json') ||
                                file.type === 'application/json'
                            );
                            if (jsonFile) {
                                try {
                                    const parsed = JSON.parse(jsonFile.content);
                                    let config;
                                    if (GistEncrypt.isEncrypted(parsed)) {
                                        return { needsPassphrase: true, encryptedContent: parsed };
                                    } else {
                                        config = parsed;
                                        baseConfig = ConfigManager.deepMerge(ConfigManager.getDefaultConfig(), config);
                                        await ConfigManager.prepareConfigForLoad(baseConfig);
                                    }
                                } catch (err) {
                                    console.error('❌ Erreur Gist (parsing ou déchiffrement):', err);
                                    throw new Error(err.message || `Erreur: ${String(err)}`);
                                }
                            } else {
                                console.warn('⚠️ Aucun fichier JSON trouvé dans le Gist');
                            }
                        } else {
                            console.error('❌ Erreur HTTP lors du chargement du Gist:', response.status, response.statusText);
                        }
                    } catch (error) {
                        console.error('❌ Erreur lors du chargement du Gist:', error);
                    }
                }

                // Si pas de config depuis le gist, utiliser la config par défaut (base64 ou HTML embarqué)
                if (!baseConfig) {
                    const defaultResult = ConfigManager.loadDefaultConfigOrEncrypted();
                    if (defaultResult.needsPassphrase && defaultResult.encryptedContent) {
                        return { needsPassphrase: true, encryptedContent: defaultResult.encryptedContent, source: defaultResult.source || 'html' };
                    }
                    baseConfig = defaultResult.config;
                    await ConfigManager.prepareConfigForLoad(baseConfig);
                }

                // Appliquer les paramètres URL en priorité (URL > gist > base64 > default)
                return ConfigManager.applyURLParamsToConfig(baseConfig);
            }

            /** Bâtit le tableau queries[] pour l'export (schéma unifié). Assure que chaque query a un name. */
            static _buildQueriesForClean(cell) {
                if (Array.isArray(cell.queries) && cell.queries.length > 0) {
                    const schema = CELL_TYPE_SCHEMAS?.types[cell?.type];
                    const defaultEngine = cell?.type === 'markdown' ? 'text' : 'sql';
                    return cell.queries.map((q, i) => ({
                        name: q.name || schema?.queryNames?.[i] || (i === 0 ? 'main' : i === 1 ? 'filename' : 'query' + i),
                        sql: q.sql || '',
                        engine: q.engine || defaultEngine,
                        clientVisible: q.clientVisible === true
                    }));
                }
                const arr = [];
                const qMain = ConfigManager.getCellQuery(cell, 'main');
                if (qMain) arr.push({ name: 'main', sql: qMain, engine: ConfigManager.getCellEngine(cell, 'main'), clientVisible: ConfigManager.getCellQueryClientVisible(cell, 'main') });
                const qFallback = ConfigManager.getCellQuery(cell, 'fallback') || ConfigManager.getCellQuery(cell, 'filename');
                if (qFallback) arr.push({ name: cell.type === 'source' ? 'fallback' : 'filename', sql: qFallback, engine: 'sql', clientVisible: false });
                return arr;
            }

            static async cleanCell(cell, includeFileData = false) {
                const cleanCell = { type: cell.type };

                switch (cell.type) {
                    case 'markdown':
                        cleanCell.queries = ConfigManager._buildQueriesForClean(cell);
                        if (!Array.isArray(cleanCell.queries) || cleanCell.queries.length === 0) {
                            cleanCell.queries = [{ name: 'main', sql: ConfigManager.getMarkdownContent(cell), engine: ConfigManager.getCellEngine(cell, 'main'), clientVisible: ConfigManager.getCellQueryClientVisible(cell, 'main') }];
                        }
                        break;
                    case 'source':
                        cleanCell.name = cell.name;
                        cleanCell.title = cell.title;
                        cleanCell.queries = ConfigManager._buildQueriesForClean(cell);
                        cleanCell.json = cell.json || {};
                        if (cell.json?.xlsx) cleanCell.json.xlsx = cell.json.xlsx;
                        if (includeFileData && cell._currentFile && cell._fileName) {
                            try {
                                const arrayBuffer = await cell._currentFile.arrayBuffer();
                                const compressedBuffer = await FileHandler.compressGzip(arrayBuffer);
                                const base64 = FileHandler.arrayBufferToBase64(compressedBuffer);
                                const fileName = cell._fileName;
                                cleanCell.files = [{ slot: 'source', base64, fileName, compressed: true }];
                            } catch (e) {
                                console.warn('Impossible de lire le fichier source:', e);
                            }
                        } else if (includeFileData) {
                            const fileData = ConfigManager.getCellFileData(cell);
                            if (fileData) {
                                let base64 = fileData.base64;
                                let compressed = !!fileData.compressed;
                                if (!compressed) {
                                    try {
                                        const bytes = FileHandler.base64ToUint8Array(base64);
                                        const rawBuffer = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
                                        const compressedBuffer = await FileHandler.compressGzip(rawBuffer);
                                        base64 = FileHandler.arrayBufferToBase64(compressedBuffer);
                                        compressed = true;
                                    } catch (e) {
                                        console.warn('Compression fichier source échouée:', e);
                                    }
                                }
                                cleanCell.files = [{ slot: 'source', base64, fileName: fileData.fileName, compressed }];
                            }
                        }
                        break;
                    case 'buttonRunNextCells':
                        cleanCell.buttonLabel = cell.buttonLabel;
                        break;
                    case 'table':
                        cleanCell.queries = ConfigManager._buildQueriesForClean(cell);
                        cleanCell.maxRows = cell.maxRows;
                        break;
                    case 'iframe':
                        cleanCell.queries = ConfigManager._buildQueriesForClean(cell);
                        break;
                    case 'sqlRecursiveParse':
                        cleanCell.queries = ConfigManager._buildQueriesForClean(cell);
                        break;
                    case 'sqlStat':
                        cleanCell.queries = ConfigManager._buildQueriesForClean(cell);
                        cleanCell.title = cell.title;
                        cleanCell.subtitle = cell.subtitle;
                        cleanCell.icon = cell.icon;
                        break;
                    case 'uiParameter':
                        cleanCell.name = (cell.name || cell.referenceName || '').trim() || undefined;
                        cleanCell.paramType = cell.paramType;
                        cleanCell.title = cell.title;
                        cleanCell.queries = ConfigManager._buildQueriesForClean(cell);
                        if (cell.inputType) cleanCell.inputType = cell.inputType;
                        if (cell.rangeMin !== undefined) cleanCell.rangeMin = cell.rangeMin;
                        if (cell.rangeMax !== undefined) cleanCell.rangeMax = cell.rangeMax;
                        if (cell.rangeStep !== undefined) cleanCell.rangeStep = cell.rangeStep;
                        if (cell.userVisible !== undefined) cleanCell.userVisible = cell.userVisible;
                        if (cell.userEditable !== undefined) cleanCell.userEditable = cell.userEditable;
                        if (cell.preserveUserValue !== undefined) cleanCell.preserveUserValue = cell.preserveUserValue;
                        break;
                    case 'publipostageWord':
                        cleanCell.queries = ConfigManager._buildQueriesForClean(cell);
                        if (cell.buttonLabel) cleanCell.buttonLabel = cell.buttonLabel;
                        if (includeFileData) {
                            const rawBase64 = cell.docxTemplateBase64 || ConfigManager.getCellFileData(cell)?.base64;
                            const fileName = cell.docxTemplateFileName || ConfigManager.getCellFileData(cell)?.fileName;
                            if (rawBase64 && fileName) {
                                let base64 = rawBase64;
                                let compressed = false;
                                try {
                                    const bytes = FileHandler.base64ToUint8Array(rawBase64);
                                    const rawBuffer = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
                                    const compressedBuffer = await FileHandler.compressGzip(rawBuffer);
                                    base64 = FileHandler.arrayBufferToBase64(compressedBuffer);
                                    compressed = true;
                                } catch (e) {
                                    console.warn('Compression template docx échouée:', e);
                                }
                                cleanCell.files = [{ slot: 'docxTemplate', base64, fileName, compressed }];
                            }
                        }
                        break;
                    case 'pdfme':
                        cleanCell.queries = ConfigManager._buildQueriesForClean(cell);
                        cleanCell.json = typeof cell.json === 'string' ? cell.json : '';
                        if (cell.buttonLabel) cleanCell.buttonLabel = cell.buttonLabel;
                        break;
                    case 'perspective':
                        cleanCell.queries = ConfigManager._buildQueriesForClean(cell);
                        cleanCell.json = cell.json || {};
                        if (cell.json?.perspectiveConfig !== undefined) {
                            let cfg = cell.json.perspectiveConfig;
                            if (typeof cfg === 'string') {
                                // Normaliser les retours à la ligne en \n pour un export JSON valide
                                cfg = cfg.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
                            } else {
                                cfg = JSON.stringify(cfg, null, 2);
                            }
                            cleanCell.json.perspectiveConfig = cfg;
                        }
                        break;
                }

                const orderValue = ConfigManager.normalizeOrder(cell._order, undefined);
                if (orderValue !== undefined) {
                    cleanCell.order = orderValue;
                }

                // Ajouter childGroupId si présent
                if (cell.childGroupId) {
                    cleanCell.childGroupId = cell.childGroupId;
                }

                // Ajouter name (pour onglets tabsChild)
                if (cell.name !== undefined && cell.name !== '') {
                    cleanCell.name = cell.name;
                }

                // Taille optionnelle des cellules (px et % combinables, largeur + hauteur)
                const opt = (k, v) => { if (v !== undefined && v !== null && String(v).trim() !== '') cleanCell[k] = v; };
                opt('minSizePx', cell.minSizePx);
                opt('minSizePercent', cell.minSizePercent);
                opt('maxSizePx', cell.maxSizePx);
                opt('maxSizePercent', cell.maxSizePercent);
                opt('minHeightPx', cell.minHeightPx);
                opt('minHeightPercent', cell.minHeightPercent);
                opt('maxHeightPx', cell.maxHeightPx);
                opt('maxHeightPercent', cell.maxHeightPercent);

                // Bordure : export uniquement si false (sinon true par défaut)
                if (cell.border === false) {
                    cleanCell.border = false;
                }

                return cleanCell;
            }

            static async cleanGroup(group, includeFileData = false) {
                const cleanGroup = {
                    direction: group.direction || 'row',
                    style: group.style || '',
                    cells: await Promise.all((group.cells || []).map(cell => ConfigManager.cleanCell(cell, includeFileData)))
                };

                // Ajouter les paramètres accordion si définis
                if (group.accordion) {
                    cleanGroup.accordion = true;
                    cleanGroup.title = group.title || '';
                    cleanGroup.accordionOpen = group.accordionOpen !== false; // true par défaut
                }

                // Ajouter tabsChild et name (pour onglets)
                if (group.tabsChild) {
                    cleanGroup.tabsChild = true;
                }
                if (group.name !== undefined && group.name !== '') {
                    cleanGroup.name = group.name;
                }

                // Ajouter queries si défini (condition d'affichage en mode client = queries[0] avec name: 'main')
                if (Array.isArray(group.queries) && group.queries.length > 0) {
                    const q0 = ConfigManager.getGroupIfQuery(group) || group.queries[0];
                    if (q0 && (q0.sql || '').trim()) {
                        cleanGroup.queries = [{
                            name: 'main',
                            sql: q0.sql.trim(),
                            engine: q0.engine || 'sql',
                            clientVisible: q0.clientVisible === true
                        }];
                    }
                }

                // Ajouter la config de loop si elle existe
                if (group.loop && group.loop.enabled) {
                    cleanGroup.loop = {
                        enabled: true,
                        query: group.loop.query || '',
                        zip: group.loop.zip || false,
                        zipQuery: group.loop.zipQuery || ''
                    };
                }

                // Support Alpine state: _type, _id, _order (et config: type, id, order)
                const groupType = group.type ?? group._type ?? 'core';
                cleanGroup.type = groupType;
                cleanGroup.id = group.id ?? group._id ?? ConfigManager.generateGroupId();

                // Ajouter order seulement pour les groupes "core"
                if (groupType === 'core') {
                    const orderValue = ConfigManager.normalizeOrder(group.order ?? group._order, undefined);
                    if (orderValue !== undefined) {
                        cleanGroup.order = orderValue;
                    }
                }

                // Récursivement nettoyer les children
                if (group.children && group.children.length > 0) {
                    cleanGroup.children = await Promise.all(group.children.map(child => ConfigManager.cleanGroup(child, includeFileData)));
                }

                return cleanGroup;
            }

            static async buildConfigFromState(pages, devMode = true, showLayout = true, includeFileData = false, theme = 'light', dbEngine = 'duckdb-wasm', directedAcyclicGraph = false) {
                // Nettoyer chaque page
                const cleanPages = await Promise.all(pages.map(async (page) => {
                    const cleanGroups = await Promise.all(page.groups.map(group => ConfigManager.cleanGroup(group, includeFileData)));
                    const cleanLinkGroups = await Promise.all((page.linkGroups || []).map(group => ConfigManager.cleanGroup(group, includeFileData)));

                    // Merger groups et linkGroups dans un seul tableau
                    const allGroups = [...cleanGroups, ...cleanLinkGroups];

                    return {
                        name: page.name,
                        groups: allGroups
                    };
                }));

                return {
                    version: ConfigManager.SQLJOB_VERSION,
                    createdAt: new Date().toISOString(),
                    ui: {
                        devMode: devMode,
                        showLayout: showLayout,
                        theme: theme,
                        dbEngine: dbEngine,
                        directedAcyclicGraph: directedAcyclicGraph
                    },
                    job: {
                        pages: cleanPages
                    }
                };
            }
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // CLASSE: GistEncrypt - Chiffrement AES-GCM pour config Gist
        // ═══════════════════════════════════════════════════════════════════════════
        class GistEncrypt {
            static ENCRYPTED_MARKER = '_encrypted';
            static DEFAULT_ITERATIONS = 600000;

            static _uint8ArrayToBase64(arr) {
                // Chunked conversion: String.fromCharCode(...arr) dépasse la limite d'arguments (~65k)
                const CHUNK = 0x8000;
                let s = '';
                for (let i = 0; i < arr.length; i += CHUNK) {
                    const chunk = arr.subarray(i, Math.min(i + CHUNK, arr.length));
                    s += String.fromCharCode.apply(null, chunk);
                }
                return btoa(s);
            }
            static _base64ToUint8Array(base64) {
                const raw = atob(base64);
                const arr = new Uint8Array(raw.length);
                for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
                return arr;
            }

            /** Génère une passphrase aléatoire (32 caractères hex, type 68cd597ba5da05ceba24fb975c05384f) */
            static generatePassphrase() {
                const bytes = new Uint8Array(16);
                crypto.getRandomValues(bytes);
                return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
            }

            /** Dérive une clé AES depuis la passphrase */
            static async deriveKey(passphrase, salt, iterations = this.DEFAULT_ITERATIONS) {
                const enc = new TextEncoder();
                const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveBits', 'deriveKey']);
                return crypto.subtle.deriveKey(
                    { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
                    keyMaterial,
                    { name: 'AES-GCM', length: 256 },
                    false,
                    ['encrypt', 'decrypt']
                );
            }

            /**
             * Chiffre une chaîne JSON. Format versionnable et auto-documenté :
             * { _encrypted, kdf, iterations, salt, iv, ciphertext }
             */
            static async encrypt(plaintext, passphrase) {
                const salt = crypto.getRandomValues(new Uint8Array(16));
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const key = await this.deriveKey(passphrase, salt);
                const enc = new TextEncoder();
                const ciphertext = await crypto.subtle.encrypt(
                    { name: 'AES-GCM', iv },
                    key,
                    enc.encode(plaintext)
                );
                return {
                    [this.ENCRYPTED_MARKER]: true,
                    kdf: 'PBKDF2',
                    iterations: this.DEFAULT_ITERATIONS,
                    salt: this._uint8ArrayToBase64(salt),
                    iv: this._uint8ArrayToBase64(iv),
                    ciphertext: this._uint8ArrayToBase64(new Uint8Array(ciphertext))
                };
            }

            /**
             * Déchiffre. Format attendu: { _encrypted, kdf, iterations, salt, iv, ciphertext }
             */
            static async decrypt(encryptedObj, passphrase) {
                if (!encryptedObj || !encryptedObj[this.ENCRYPTED_MARKER] || !encryptedObj.ciphertext || !encryptedObj.salt || encryptedObj.iv === undefined) {
                    throw new Error('Contenu non chiffré ou format invalide');
                }

                const salt = this._base64ToUint8Array(encryptedObj.salt);
