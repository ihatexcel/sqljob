    <script>
        // ═══════════════════════════════════════════════════════════════════════════
        // ARCHITECTURE NOTEBOOK - Système de cellules
        // ═══════════════════════════════════════════════════════════════════════════

        // ═══════════════════════════════════════════════════════════════════════════
        // FONCTION UTILITAIRE: formatValueForInputType
        // ═══════════════════════════════════════════════════════════════════════════
        function formatValueForInputType(value, inputType) {
            if (value === null || value === undefined || value === '') return '';

            // Essayer de parser comme Date si nécessaire
            let dateObj = null;
            if (value instanceof Date) {
                dateObj = value;
            } else if (typeof value === 'number') {
                // Timestamp en millisecondes
                dateObj = new Date(value);
            } else if (typeof value === 'string') {
                // Essayer de parser la string comme date
                const parsed = new Date(value);
                if (!isNaN(parsed.getTime())) {
                    dateObj = parsed;
                }
            }

            // Formater selon le type d'input
            switch (inputType) {
                case 'date':
                    if (dateObj) {
                        const year = dateObj.getFullYear();
                        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                        const day = String(dateObj.getDate()).padStart(2, '0');
                        return `${year}-${month}-${day}`;
                    }
                    break;
                case 'datetime-local':
                    if (dateObj) {
                        const year = dateObj.getFullYear();
                        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                        const day = String(dateObj.getDate()).padStart(2, '0');
                        const hours = String(dateObj.getHours()).padStart(2, '0');
                        const minutes = String(dateObj.getMinutes()).padStart(2, '0');
                        return `${year}-${month}-${day}T${hours}:${minutes}`;
                    }
                    break;
                case 'time':
                    if (dateObj) {
                        const hours = String(dateObj.getHours()).padStart(2, '0');
                        const minutes = String(dateObj.getMinutes()).padStart(2, '0');
                        return `${hours}:${minutes}`;
                    }
                    // Si c'est déjà une string de temps (HH:mm ou HH:mm:ss)
                    if (typeof value === 'string' && /^\d{1,2}:\d{2}(:\d{2})?$/.test(value)) {
                        const parts = value.split(':');
                        return `${parts[0].padStart(2, '0')}:${parts[1].padStart(2, '0')}`;
                    }
                    break;
                case 'month':
                    if (dateObj) {
                        const year = dateObj.getFullYear();
                        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                        return `${year}-${month}`;
                    }
                    break;
                case 'week':
                    if (dateObj) {
                        // Calculer le numéro de semaine ISO
                        const tempDate = new Date(dateObj.getTime());
                        tempDate.setHours(0, 0, 0, 0);
                        tempDate.setDate(tempDate.getDate() + 3 - (tempDate.getDay() + 6) % 7);
                        const week1 = new Date(tempDate.getFullYear(), 0, 4);
                        const weekNum = 1 + Math.round(((tempDate.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
                        return `${tempDate.getFullYear()}-W${String(weekNum).padStart(2, '0')}`;
                    }
                    break;
            }

            // Par défaut, retourner la valeur convertie en string
            return String(value);
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // CLASSE 0: CDNManager - Chargement dynamique des CDN
        // ═══════════════════════════════════════════════════════════════════════════
        class CDNManager {
            static loadedScripts = new Set();
            static loadingPromises = new Map();

            static async loadScript(url) {
                if (this.loadedScripts.has(url)) {
                    return Promise.resolve();
                }

                if (this.loadingPromises.has(url)) {
                    return this.loadingPromises.get(url);
                }

                const promise = new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = url;
                    script.onload = () => {
                        this.loadedScripts.add(url);
                        this.loadingPromises.delete(url);
                        console.log(`✅ CDN chargé: ${url}`);
                        resolve();
                    };
                    script.onerror = () => {
                        this.loadingPromises.delete(url);
                        reject(new Error(`Échec du chargement: ${url}`));
                    };
                    document.head.appendChild(script);
                });

                this.loadingPromises.set(url, promise);
                return promise;
            }

            static async loadPlotly() {
                const plotlyUrl = 'https://cdn.plot.ly/plotly-3.3.0.min.js';
                if (typeof Plotly !== 'undefined') {
                    this.loadedScripts.add(plotlyUrl);
                    return;
                }
                await this.loadScript(plotlyUrl);
            }

            static async loadPizZip() {
                const pizzipUrl = 'https://cdn.jsdelivr.net/npm/pizzip@3.2.0/dist/pizzip.min.js';
                if (typeof PizZip === 'undefined') {
                    await this.loadScript(pizzipUrl);
                } else {
                    this.loadedScripts.add(pizzipUrl);
                }
            }

            static async loadDocxtemplater() {
                const docxtemplaterUrl = 'https://cdn.jsdelivr.net/npm/docxtemplater@3.67.6/build/docxtemplater.min.js';
                
                // PizZip doit être chargé avant docxtemplater
                await this.loadPizZip();
                
                if (typeof window.docxtemplater === 'undefined') {
                    await this.loadScript(docxtemplaterUrl);
                } else {
                    this.loadedScripts.add(docxtemplaterUrl);
                }
            }

            static async loadSimpleDatatables() {
                const simpleDatatablesUrl = 'https://cdn.jsdelivr.net/npm/simple-datatables@10.2.0/dist/umd/simple-datatables.min.js';
                const simpleDatatablesCssUrl = 'https://cdn.jsdelivr.net/npm/simple-datatables@10.2.0/dist/style.min.css';
                
                // Charger le CSS si pas déjà chargé
                if (!document.querySelector(`link[href="${simpleDatatablesCssUrl}"]`)) {
                    const link = document.createElement('link');
                    link.rel = 'stylesheet';
                    link.href = simpleDatatablesCssUrl;
                    document.head.appendChild(link);
                }
                
                if (typeof simpleDatatables !== 'undefined') {
                    this.loadedScripts.add(simpleDatatablesUrl);
                    return;
                }
                await this.loadScript(simpleDatatablesUrl);
            }

            static async loadJsPdf() {
                const jspdfUrl = 'https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js';
                const autotableUrl = 'https://unpkg.com/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js';
                
                // jsPDF doit être chargé avant autotable
                if (typeof window.jspdf === 'undefined' && typeof window.jsPDF === 'undefined') {
                    await this.loadScript(jspdfUrl);
                } else {
                    this.loadedScripts.add(jspdfUrl);
                }
                
                // Charger autotable (plugin)
                const jsPDFClass = window.jspdf?.jsPDF || window.jsPDF;
                if (jsPDFClass && typeof jsPDFClass.prototype.autoTable === 'undefined') {
                    await this.loadScript(autotableUrl);
                } else {
                    this.loadedScripts.add(autotableUrl);
                }
            }

            static loadedStyles = new Set();

            static async loadStyle(url) {
                if (this.loadedStyles.has(url)) return;
                
                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = url;
                document.head.appendChild(link);
                this.loadedStyles.add(url);
            }

            static async loadEasyMDE() {
                const easymdeJsUrl = 'https://cdn.jsdelivr.net/npm/easymde@2.20.0/dist/easymde.min.js';
                const easymdeCssUrl = 'https://cdn.jsdelivr.net/npm/easymde@2.20.0/dist/easymde.min.css';
                
                // Charger le CSS
                this.loadStyle(easymdeCssUrl);
                
                // Charger le JS
                if (typeof EasyMDE !== 'undefined') {
                    this.loadedScripts.add(easymdeJsUrl);
                    return;
                }
                await this.loadScript(easymdeJsUrl);
            }

            static async loadXlsx() {
                const xlsxUrl = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
                if (typeof XLSX !== 'undefined') {
                    this.loadedScripts.add(xlsxUrl);
                    return;
                }
                await this.loadScript(xlsxUrl);
            }
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // CLASSE 1: ConfigManager
        // ═══════════════════════════════════════════════════════════════════════════
        class ConfigManager {
            static getDefaultConfig() {
                try {
                    const scriptElement = document.getElementById('defaultConfigBase64');
                    const defaultConfigBase64 = scriptElement?.textContent?.trim();

                    if (!defaultConfigBase64) return { job: { cells: [] } };

                    try {
                        const base64Decoded = atob(defaultConfigBase64);
                        const decoded = decodeURIComponent(escape(base64Decoded));
                        return JSON.parse(decoded);
                    } catch {
                        return JSON.parse(atob(defaultConfigBase64));
                    }
                } catch (error) {
                    console.error('Erreur de décodage config:', error);
                    return { job: { cells: [] } };
                }
            }

            static normalizeOrder(value, fallback) {
                if (value === undefined || value === null) return fallback;
                if (typeof value === 'string' && value.trim() === '') return fallback;
                const parsed = Number(value);
                return Number.isFinite(parsed) ? parsed : fallback;
            }

            static encodeUTF8ToBase64(str) {
                return btoa(unescape(encodeURIComponent(str)));
            }

            /**
             * Génère un ID unique pour un groupe
             */
            static generateGroupId() {
                return 'grp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            }

            /**
             * Génère un ID unique pour une page
             */
            static generatePageId() {
                return 'page_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            }

            static deepMerge(target, source) {
                const output = { ...target };
                if (target && typeof target === 'object' && source && typeof source === 'object') {
                    Object.keys(source).forEach(key => {
                        if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key])) {
                            output[key] = ConfigManager.deepMerge(target[key] || {}, source[key]);
                        } else {
                            output[key] = source[key];
                        }
                    });
                }
                return output;
            }

            /**
             * Charge la configuration depuis un Gist GitHub si présent dans l'URL
             */
            static async loadConfigFromGist() {
                const gistId = (() => {
                    const urlParams = new URLSearchParams(window.location.search);
                    const gistParam = urlParams.get('gist');
                    if (gistParam && /^[a-f0-9]{32}$/i.test(gistParam)) return gistParam;
                    if (gistParam) {
                        const match = gistParam.match(/gist\.github\.com\/[^\/]+\/([a-f0-9]{32})/i);
                        if (match) return match[1];
                    }
                    const configParam = urlParams.get('config');
                    if (configParam) {
                        const match = configParam.match(/gist\.github\.com\/[^\/]+\/([a-f0-9]{32})/i);
                        if (match) return match[1];
                    }
                    const fullUrlMatch = window.location.href.match(/gist\.github\.com\/[^\/]+\/([a-f0-9]{32})/i);
                    if (fullUrlMatch) return fullUrlMatch[1];
                    return null;
                })();

                if (gistId) {
                    try {
                        console.log('🔗 Détection d\'un Gist dans l\'URL, chargement de la configuration...', gistId);
                        const apiUrl = `https://api.github.com/gists/${gistId}`;
                        const response = await fetch(apiUrl);
                        if (response.ok) {
                            const gistData = await response.json();
                            const files = Object.values(gistData.files || {});
                            const jsonFile = files.find(file =>
                                file.filename.toLowerCase().endsWith('.json') ||
                                file.type === 'application/json'
                            );
                            if (jsonFile) {
                                try {
                                    const config = JSON.parse(jsonFile.content);
                                    console.log('✅ Configuration chargée depuis le Gist:', config);
                                    return ConfigManager.deepMerge(ConfigManager.getDefaultConfig(), config);
                                } catch (parseError) {
                                    console.error('❌ Erreur de parsing JSON du Gist:', parseError);
                                    throw new Error(`Le fichier JSON du Gist est invalide. Erreur: ${parseError.message}`);
                                }
                            } else {
                                console.warn('⚠️ Aucun fichier JSON trouvé dans le Gist');
                            }
                        } else {
                            console.error('❌ Erreur HTTP lors du chargement du Gist:', response.status, response.statusText);
                        }
                    } catch (error) {
                        console.error('❌ Erreur lors du chargement du Gist:', error);
                    }
                }

                return ConfigManager.getDefaultConfig();
            }

            static async cleanCell(cell, includeFileData = false) {
                const cleanCell = { type: cell.type };

                switch (cell.type) {
                    case 'markdown':
                        cleanCell.content = cell.content;
                        break;
                    case 'source':
                        cleanCell.name = cell.name;
                        cleanCell.importText = cell.importText;
                        cleanCell.query = cell.query;
                        cleanCell.csvQuery = cell.csvQuery;
                        cleanCell.xlsx = cell.xlsx;
                        cleanCell.autoRunNextCells = cell.autoRunNextCells;
                        cleanCell.preloadXlsxBySheetjs = cell.preloadXlsxBySheetjs || false;
                        // Ajouter le fichier base64 si demandé et si un fichier est chargé
                        if (includeFileData && cell._currentFile && cell._fileName) {
                            try {
                                const arrayBuffer = await cell._currentFile.arrayBuffer();
                                cleanCell.fileBase64 = FileHandler.arrayBufferToBase64(arrayBuffer);
                                cleanCell.fileName = cell._fileName;
                            } catch (e) {
                                console.warn('Impossible de lire le fichier source:', e);
                            }
                        }
                        break;
                    case 'buttonRunNextCells':
                        cleanCell.buttonLabel = cell.buttonLabel;
                        break;
                    case 'table':
                        cleanCell.query = cell.query;
                        cleanCell.maxRows = cell.maxRows;
                        break;
                    case 'plot':
                        cleanCell.query = cell.query;
                        cleanCell.tables = cell.tables;
                        break;
                    case 'iframe':
                        cleanCell.query = cell.query;
                        break;
                    case 'sqlRecursiveParse':
                        cleanCell.query = cell.query;
                        break;
                    case 'sqlStat':
                        cleanCell.query = cell.query;
                        cleanCell.statTitle = cell.statTitle;
                        cleanCell.statDesc = cell.statDesc;
                        if (cell.dataIcon) cleanCell.dataIcon = cell.dataIcon;
                        break;
                    case 'uiParameter':
                        cleanCell.paramName = cell.paramName;
                        cleanCell.paramType = cell.paramType;
                        cleanCell.label = cell.label;
                        cleanCell.initRunQuery = cell.initRunQuery;
                        cleanCell.query = cell.query;
                        if (cell.inputType) cleanCell.inputType = cell.inputType;
                        break;
                    case 'publipostageWord':
                        cleanCell.query = cell.query;
                        cleanCell.query2 = cell.query2;
                        // Ajouter le fichier base64 si demandé et si un template est chargé
                        if (includeFileData && cell.docxTemplateBase64 && cell.docxTemplateFileName) {
                            cleanCell.fileBase64 = cell.docxTemplateBase64;
                            cleanCell.fileName = cell.docxTemplateFileName;
                        }
                        break;
                    case 'jsPDF':
                        cleanCell.query = cell.query;
                        cleanCell.jsPdfConfig = cell.jsPdfConfig;
                        cleanCell.pdfFileName = cell.pdfFileName;
                        break;
                }

                const orderValue = ConfigManager.normalizeOrder(cell._order ?? cell.order, undefined);
                if (orderValue !== undefined) {
                    cleanCell.order = orderValue;
                }

                // Ajouter childGroupId si présent
                if (cell.childGroupId) {
                    cleanCell.childGroupId = cell.childGroupId;
                }

                return cleanCell;
            }

            static async cleanGroup(group, includeFileData = false) {
                const cleanGroup = {
                    direction: group.direction || 'row',
                    style: group.style || '',
                    cells: await Promise.all((group.cells || []).map(cell => ConfigManager.cleanCell(cell, includeFileData)))
                };

                // Ajouter la config de loop si elle existe
                if (group.loop && group.loop.enabled) {
                    cleanGroup.loop = {
                        enabled: true,
                        query: group.loop.query || '',
                        zip: group.loop.zip || false,
                        zipQuery: group.loop.zipQuery || ''
                    };
                }

                // Ajouter le type ("core" ou "link")
                const groupType = group.type || group._type || 'core';
                cleanGroup.type = groupType;

                // Ajouter l'ID (obligatoire)
                cleanGroup.id = group.id || group._id || ConfigManager.generateGroupId();

                // Ajouter order seulement pour les groupes "core"
                if (groupType === 'core') {
                    const orderValue = ConfigManager.normalizeOrder(group._order ?? group.order, undefined);
                    if (orderValue !== undefined) {
                        cleanGroup.order = orderValue;
                    }
                }

                // Récursivement nettoyer les children
                if (group.children && group.children.length > 0) {
                    cleanGroup.children = await Promise.all(group.children.map(child => ConfigManager.cleanGroup(child, includeFileData)));
                }

                return cleanGroup;
            }

            static async buildConfigFromState(pages, devMode = true, displayAdvancedSettings = true, includeFileData = false, theme = 'light', dbEngine = 'duckdb-wasm') {
                // Nettoyer chaque page
                const cleanPages = await Promise.all(pages.map(async (page) => {
                    const cleanGroups = await Promise.all(page.groups.map(group => ConfigManager.cleanGroup(group, includeFileData)));
                    const cleanLinkGroups = await Promise.all((page.linkGroups || []).map(group => ConfigManager.cleanGroup(group, includeFileData)));
                    
                    // Merger groups et linkGroups dans un seul tableau
                    const allGroups = [...cleanGroups, ...cleanLinkGroups];
                    
                    return {
                        name: page.name,
                        autoExecuteWithoutSources: page.autoExecuteWithoutSources,
                        groups: allGroups
                    };
                }));

                return {
                    job: {
                        pages: cleanPages
                    },
                    ui: { 
                        devMode: devMode,
                        displayAdvancedSettings: displayAdvancedSettings,
                        theme: theme,
                        dbEngine: dbEngine
                    }
                };
            }
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // CLASSE 2: FileHandler
        // ═══════════════════════════════════════════════════════════════════════════
        class FileHandler {
            static getMimeTypeFromFileName(fileName) {
                const ext = fileName.split('.').pop().toLowerCase();
                const mimeTypes = {
                    'csv': 'text/csv',
                    'parquet': 'application/octet-stream',
                    'xlsx': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
                    'xls': 'application/vnd.ms-excel'
                };
                return mimeTypes[ext] || 'application/octet-stream';
            }

            static async compressGzip(arrayBuffer) {
                if (typeof CompressionStream === 'undefined') {
                    throw new Error('CompressionStream non supporté');
                }

                const compressionStream = new CompressionStream('gzip');
                const reader = compressionStream.readable.getReader();
                const chunks = [];

                const readPromise = (async () => {
                    let done = false;
                    while (!done) {
                        const { value, done: streamDone } = await reader.read();
                        done = streamDone;
                        if (value) chunks.push(value);
                    }
                })();

                const writer = compressionStream.writable.getWriter();
                await writer.write(new Uint8Array(arrayBuffer));
                await writer.close();
                await readPromise;

                return await new Blob(chunks).arrayBuffer();
            }

            static async decompressGzip(compressedData) {
                if (typeof DecompressionStream === 'undefined') {
                    throw new Error('DecompressionStream non supporté');
                }

                const decompressionStream = new DecompressionStream('gzip');
                const reader = decompressionStream.readable.getReader();
                const chunks = [];

                const readPromise = (async () => {
                    let done = false;
                    while (!done) {
                        const { value, done: streamDone } = await reader.read();
                        done = streamDone;
                        if (value) chunks.push(value);
                    }
                })();

                const writer = decompressionStream.writable.getWriter();
                await writer.write(compressedData);
                await writer.close();
                await readPromise;

                return await new Blob(chunks).arrayBuffer();
            }

            static arrayBufferToBase64(arrayBuffer) {
                const bytes = new Uint8Array(arrayBuffer);
                let binary = '';
                for (let i = 0; i < bytes.length; i++) {
                    binary += String.fromCharCode(bytes[i]);
                }
                return btoa(binary);
            }

            static base64ToUint8Array(base64) {
                const binaryString = atob(base64);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                return bytes;
            }

            static async processExcelFile(file, xlsxOptions, xlsxToCsvOptions, xlsxSheetSelection) {
                // Charger xlsx (SheetJS) à la demande
                await CDNManager.loadXlsx();
                
                const workbook = XLSX.read(await file.arrayBuffer(), { type: 'array', ...xlsxOptions });

                let selectedSheetName = workbook.SheetNames[0];
                const sheetSelection = xlsxSheetSelection || { type: { auto: true } };

                if (sheetSelection.type?.name && sheetSelection.name) {
                    if (workbook.SheetNames.includes(sheetSelection.name)) {
                        selectedSheetName = sheetSelection.name;
                    }
                } else if (sheetSelection.type?.index && sheetSelection.index > 0) {
                    if (sheetSelection.index < workbook.SheetNames.length) {
                        selectedSheetName = workbook.SheetNames[sheetSelection.index];
                    }
                }

                const selectedSheet = workbook.Sheets[selectedSheetName];
                const csv = XLSX.utils.sheet_to_csv(selectedSheet, xlsxToCsvOptions || {});

                return {
                    csv,
                    csvFileName: file.name.replace(/\.(xlsx|xls)$/i, '.csv'),
                    sheetName: selectedSheetName
                };
            }

            static downloadFile(blob, fileName) {
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            }
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // CLASSE 3: DuckDBManager (Dual Engine: duckdb-wasm / ducklings)
        // ═══════════════════════════════════════════════════════════════════════════
        class DuckDBManager {
            static dbInstance = null;
            static connInstance = null;
            static duckdbModuleRef = null;
            static currentEngine = 'duckdb-wasm'; // 'duckdb-wasm' | 'ducklings'
            static workerRef = null;

            // Versions et URLs des CDN (chargés dynamiquement selon le moteur)
            static DUCKDB_WASM_VERSION = '1.33.1-dev18.0';
            static DUCKLINGS_VERSION = '1.4.4';

            static getDuckDBWasmUrl() {
                return `https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@${DuckDBManager.DUCKDB_WASM_VERSION}/+esm`;
            }

            static getDucklingsUrl() {
                return `https://cdn.jsdelivr.net/npm/@ducklings/browser@${DuckDBManager.DUCKLINGS_VERSION}/+esm`;
            }

            static getEngine() {
                return DuckDBManager.currentEngine;
            }

            static setEngine(engine) {
                if (!['duckdb-wasm', 'ducklings'].includes(engine)) {
                    throw new Error(`Moteur inconnu: ${engine}`);
                }
                DuckDBManager.currentEngine = engine;
            }

            static async destroy(onStatus) {
                onStatus?.('Destruction de la base de données...', 'loading');
                
                try {
                    if (DuckDBManager.connInstance) {
                        if (DuckDBManager.currentEngine === 'ducklings') {
                            await DuckDBManager.connInstance.close?.();
                        }
                        DuckDBManager.connInstance = null;
                    }
                    
                    if (DuckDBManager.dbInstance) {
                        if (DuckDBManager.currentEngine === 'ducklings') {
                            await DuckDBManager.dbInstance.close?.();
                        } else {
                            await DuckDBManager.dbInstance.terminate?.();
                        }
                        DuckDBManager.dbInstance = null;
                    }

                    if (DuckDBManager.workerRef) {
                        DuckDBManager.workerRef.terminate?.();
                        DuckDBManager.workerRef = null;
                    }

                    DuckDBManager.duckdbModuleRef = null;
                    window.duckdbModule = null;
                    window.ducklingsModule = null;

                    onStatus?.('Base de données détruite', 'success');
                } catch (error) {
                    console.error('Erreur destruction DB:', error);
                    onStatus?.('Erreur destruction: ' + error.message, 'error');
                }
            }

            static async switchEngine(newEngine, onStatus) {
                if (newEngine === DuckDBManager.currentEngine && DuckDBManager.dbInstance) {
                    return; // Déjà sur ce moteur et initialisé
                }

                // Détruire l'instance actuelle
                await DuckDBManager.destroy(onStatus);

                // Changer le moteur
                DuckDBManager.setEngine(newEngine);

                // Réinitialiser avec le nouveau moteur
                await DuckDBManager.initDuckDB(onStatus);
            }

            static supportsFileOperations() {
                return DuckDBManager.currentEngine === 'duckdb-wasm';
            }

            static supportsExtensions() {
                return DuckDBManager.currentEngine === 'duckdb-wasm';
            }

            static async initDuckDB(onStatus) {
                if (DuckDBManager.dbInstance && DuckDBManager.connInstance) {
                    return { db: DuckDBManager.dbInstance, conn: DuckDBManager.connInstance };
                }

                if (DuckDBManager.currentEngine === 'ducklings') {
                    return await DuckDBManager._initDucklings(onStatus);
                } else {
                    return await DuckDBManager._initDuckDBWasm(onStatus);
                }
            }

            static async _initDuckDBWasm(onStatus) {
                onStatus?.('Initialisation de DuckDB WASM...', 'loading');

                const duckdb = await import(DuckDBManager.getDuckDBWasmUrl());
                window.duckdbModule = duckdb;
                DuckDBManager.duckdbModuleRef = duckdb;

                const JSDELIVR_BUNDLES = duckdb.getJsDelivrBundles();
                const bundle = await duckdb.selectBundle(JSDELIVR_BUNDLES);

                const worker_url = URL.createObjectURL(
                    new Blob([`importScripts("${bundle.mainWorker}");`], { type: 'text/javascript' })
                );
                const worker = new Worker(worker_url);
                DuckDBManager.workerRef = worker;
                const logger = new duckdb.ConsoleLogger(duckdb.LogLevel.INFO);

                DuckDBManager.dbInstance = new duckdb.AsyncDuckDB(logger, worker);
                URL.revokeObjectURL(worker_url);

                await DuckDBManager.dbInstance.instantiate(bundle.mainModule, bundle.pthreadWorker);
                DuckDBManager.connInstance = await DuckDBManager.dbInstance.connect();

                // Installer et charger l'extension excel pour supporter les fichiers xlsx nativement
                onStatus?.('Chargement extension Excel...', 'loading');
                await DuckDBManager.connInstance.query('INSTALL excel;');
                await DuckDBManager.connInstance.query('LOAD excel;');

                onStatus?.('DuckDB WASM prêt', 'success');

                return { db: DuckDBManager.dbInstance, conn: DuckDBManager.connInstance };
            }

            static async _initDucklings(onStatus) {
                onStatus?.('Initialisation de Ducklings...', 'loading');

                // Ducklings ne fonctionne pas depuis file:// (worker ES module)
                if (location.protocol === 'file:') {
                    throw new Error('Ducklings nécessite un serveur HTTP. Ouvrez le fichier via http://localhost (ex: npx serve)');
                }

                const ducklings = await import(DuckDBManager.getDucklingsUrl());
                window.ducklingsModule = ducklings;
                DuckDBManager.duckdbModuleRef = ducklings;

                const bundle = ducklings.getJsDelivrBundle();
                const worker = await ducklings.createWorker(bundle.mainWorker);
                DuckDBManager.workerRef = worker;

                await ducklings.init({
                    worker,
                    wasmUrl: bundle.wasmModule,
                    wasmJsUrl: bundle.wasmJs
                });

                DuckDBManager.dbInstance = new ducklings.DuckDB();
                DuckDBManager.connInstance = await DuckDBManager.dbInstance.connect();

                onStatus?.('Ducklings prêt', 'success');

                return { db: DuckDBManager.dbInstance, conn: DuckDBManager.connInstance };
            }

            static async executeQuery(query) {
                if (!DuckDBManager.connInstance) {
                    throw new Error('DuckDB non initialisé');
                }

                if (DuckDBManager.currentEngine === 'ducklings') {
                    // Ducklings retourne directement un tableau d'objets
                    const result = await DuckDBManager.connInstance.query(query);
                    return result;
                } else {
                    // DuckDB WASM nécessite une conversion
                    const result = await DuckDBManager.connInstance.query(query);
                    return result.toArray().map(row => Object.fromEntries(row));
                }
            }

            static async registerFile(fileName, file) {
                if (DuckDBManager.currentEngine === 'ducklings') {
                    throw new Error('Ducklings ne supporte pas l\'enregistrement de fichiers. Utilisez DuckDB WASM pour les notebooks avec fichiers.');
                }
                if (!DuckDBManager.dbInstance || !DuckDBManager.duckdbModuleRef) {
                    throw new Error('DuckDB non initialisé');
                }
                await DuckDBManager.dbInstance.registerFileHandle(
                    fileName,
                    file,
                    DuckDBManager.duckdbModuleRef.DuckDBDataProtocol.BROWSER_FILEREADER,
                    true
                );
            }

            static async copyFileToBuffer(fileName) {
                if (DuckDBManager.currentEngine === 'ducklings') {
                    throw new Error('Ducklings ne supporte pas copyFileToBuffer. Utilisez DuckDB WASM.');
                }
                return await DuckDBManager.dbInstance.copyFileToBuffer(fileName);
            }
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // CLASSE 4: PlotlyManager
        // ═══════════════════════════════════════════════════════════════════════════
        class PlotlyManager {
            static cleanData(data) {
                if (!data || data.length === 0) return [];

                return data.map(row => {
                    const cleanRow = {};
                    for (const [key, value] of Object.entries(row)) {
                        if (typeof value === 'bigint') {
                            cleanRow[key] = Number(value);
                        } else if (typeof value === 'string' && value.trim() !== '' && !isNaN(value)) {
                            cleanRow[key] = parseFloat(value);
                        } else {
                            cleanRow[key] = value;
                        }
                    }
                    return cleanRow;
                });
            }

            static async createPlot(code, tablesData, container) {
                // Charger Plotly à la demande
                await CDNManager.loadPlotly();

                // Nettoyer toutes les tables
                const cleanTables = {};
                for (const [tableName, tableData] of Object.entries(tablesData)) {
                    cleanTables[tableName] = PlotlyManager.cleanData(tableData);
                }

                container.innerHTML = '';

                try {
                    // Créer les variables pour chaque table
                    const tableVars = Object.entries(cleanTables)
                        .map(([name, arr]) => `const ${name} = ${JSON.stringify(arr)};`)
                        .join('\n');

                    const executeCode = async (container, Plotly) => {
                        return eval(`(async () => { 
                            ${tableVars}
                            ${code} 
                        })()`);
                    };

                    await executeCode(container, Plotly);
                } catch (error) {
                    console.error('Erreur Plotly:', error);
                    container.innerHTML = `<p style="color: red; text-align: center;">Erreur: ${error.message}</p>`;
                    throw error;
                }
            }
        }

                                    <div class="stat-title" x-text="cellItem.cell.statTitle || 'Stat'"></div>
                                    <div class="stat-value" x-text="cellItem.cell._statValue || '-'"></div>
                                    <div class="stat-desc" x-text="cellItem.cell.statDesc || ''"></div>
                                </div>
                                <template x-if="cellItem.cell._resultInfo" >
                                    <div x-show="devMode" class="mt-2 p-2 bg-base-200 rounded text-sm text-base-content/70" x-text="cellItem.cell._resultInfo"></div>
                                </template>
                            </div>

                        <!-- PUBLIPOSTAGE WORD CELL -->
                        <template x-if="cellItem.cell.type === 'publipostageWord'">

                                     :class="{ 'drag-over': cellItem.cell._isDragging, 'has-file': cellItem.cell.docxTemplateFileName }"
                                     @click="!cellItem.cell.docxTemplateFileName && document.getElementById('docxInput_' + cellItem.cell._id).click()"
                                     @dragover.prevent="cellItem.cell._isDragging = true"
                                     @dragleave.prevent="cellItem.cell._isDragging = false"
                                     @drop.prevent="handleDocxTemplateDrop($event, ${pathExpr}, ${cellIdxExpr})">
                                    <template x-if="!cellItem.cell.docxTemplateFileName">
                                        <div class="source-drop-content">
                                            <div class="source-drop-icon">📄</div>
                                            <p class="source-drop-text">Glissez-déposez votre template Word (.docx)</p>
                                            <p class="source-drop-hint">Template de publipostage</p>

                                    </template>
                                    <template x-if="cellItem.cell.docxTemplateFileName">

                                            <span class="source-file-name" x-text="cellItem.cell.docxTemplateFileName"></span>
                                            <button class="btn btn-ghost" @click.stop="downloadDocxTemplate(${pathExpr}, ${cellIdxExpr})" title="Télécharger">
                                                <span class="iconify" data-icon="material-symbols:download" style="font-size: 1.25rem;"></span>
                                            </button>
                                            <button class="btn btn-ghost btn-error" @click.stop="removeDocxTemplate(${pathExpr}, ${cellIdxExpr})" title="Supprimer">
                                                <span class="iconify" data-icon="material-symbols:close" style="font-size: 1.5rem;"></span>
                                            </button>
                                        </div>
                                    </template>
                                    <input type="file" hidden
                                           :id="'docxInput_' + cellItem.cell._id"
                                           accept=".docx"
                                           @change="handleDocxTemplateFileSelect($event, ${pathExpr}, ${cellIdxExpr})">
                                </div>
                                
                                <!-- Query 1: Data query -->
                                <div x-show="devMode">
                                    <div class="text-sm font-semibold text-primary mb-1">Requête de données</div>
                                    <div x-html="renderSqlQueryEditor(cellItem.cell, 'SELECT * FROM source1 LIMIT 10', true)"></div>
                                </div>
                                
                                <!-- Query 2: Filename query -->
                                <div x-show="devMode">
                                    <div class="text-sm font-semibold text-primary mb-1">Requête de nom de fichier</div>
                                    <div x-html="renderSqlQueryEditor(cellItem.cell, 'SELECT \\'document_\\' || row_number() OVER () || \\'.docx\\' as filename FROM source1 LIMIT 10', true, 'query2', '_showParsedQuery2')"></div>
                                </div>
                                
                                <!-- Execute button -->
                                <div class="flex justify-center">
                                    <button class="btn btn-primary btn-sm" 
                                            @click="runCellAt(${pathExpr}, ${cellIdxExpr})"
                                            :disabled="isLoading || !cellItem.cell.docxTemplateFileName">
                                        📄 Générer les documents
                                    </button>
                                </div>
                                
                                <template x-if="cellItem.cell._resultInfo">
                                    <div class="mt-2 p-2 bg-base-200 rounded text-sm text-base-content/70" x-text="cellItem.cell._resultInfo"></div>
                                </template>
                            </div>
                        </template>
                        
                        <!-- JSPDF CELL -->
                        <template x-if="cellItem.cell.type === 'jsPDF'">
                            <div class="flex flex-col gap-3">
                                <div x-show="devMode" x-html="renderSqlQueryEditor(cellItem.cell, 'SELECT * FROM source1 LIMIT 100', true)"></div>
                                
                                <!-- Execute button -->
                                <div class="flex justify-center">
                                    <button class="btn btn-primary btn-sm" 
                                            @click="runCellAt(${pathExpr}, ${cellIdxExpr})"
                                            :disabled="isLoading">
                                        📑 Générer le PDF
                                    </button>
                                </div>
                                
                                <template x-if="cellItem.cell._resultInfo">
                                    <div class="mt-2 p-2 bg-base-200 rounded text-sm text-base-content/70" x-text="cellItem.cell._resultInfo"></div>
                                </template>
                            </div>
                        </template>
                        
                        <!-- CLIENT MODE BUTTON: Open child group modal if cell has childGroupId -->
                        <template x-if="!devMode && cellItem.cell.childGroupId">
                            <div class="mt-0 flex justify-center">
                                <button class="btn btn-sm gap-0" 
                                        @click="openChildGroupModal(${pathExpr}, ${cellIdxExpr})"
                                        title="Ouvrir le groupe enfant">
                                    <span class="iconify" data-icon="material-symbols:export-notes-outline-sharp" style="font-size: 1.0rem;"></span>
                                </button>
                            </div>
                        </template>
                    </div>`;
            }

            // Génère le HTML complet d'une cellule
            static renderCell(pathExpr, cellIdxExpr, groupExpr) {
                return CellRenderer.renderHeader(pathExpr, cellIdxExpr, groupExpr) + CellRenderer.renderBody(pathExpr, cellIdxExpr);
            }
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // APPLICATION ALPINE.JS
        // ═══════════════════════════════════════════════════════════════════════════
        function notebookApp() {
            // Utiliser la config chargée depuis le Gist si disponible, sinon la config par défaut
            const config = window._loadedConfig || ConfigManager.getDefaultConfig();

            // Helper pour initialiser une cellule avec ses propriétés runtime
            const initCell = (cell, cellIndex) => {
                const newCell = {
                    ...cell,
                    _id: 'cell_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                    _status: null,
                    _results: null,
                    _resultInfo: null,
                    _order: ConfigManager.normalizeOrder(cell._order ?? cell.order, cellIndex) // Utiliser l'_order existant, l'order config, ou l'index
                };

                if (cell.type === 'source') {
                    newCell._fileName = '';
                    newCell._currentFile = null;
                    newCell._isDragging = false;
                    newCell._loaded = false;
                }


                if (cell.type === 'uiParameter') {
                    newCell._value = '';
                    newCell._options = [];
                    newCell._initialized = false;
                    newCell._paramError = null;
                }

                // Cellules avec SQL editor : ajouter le flag de vue parsée
                if (['sqlRecursiveParse', 'table', 'iframe', 'sqlStat'].includes(cell.type)) {
                    newCell._showParsedQuery = false;
                }

                return newCell;
            };

            // Fonction récursive pour initialiser un groupe et ses enfants
            const initGroup = (group, groupIndex) => {
                const newGroup = {
                    _id: group.id || group._id || ConfigManager.generateGroupId(),
                    _type: group.type || 'core', // Migration automatique : groupes sans type => "core"
                    direction: group.direction || 'row',
                    style: group.style || '',
                    _order: ConfigManager.normalizeOrder(group._order ?? group.order, groupIndex), // Utiliser l'_order existant, l'order config, ou l'index
                    cells: (group.cells || []).map((cell, cellIndex) => initCell(cell, cellIndex)),
                    // Config de loop
                    loop: group.loop ? {
                        enabled: group.loop.enabled || false,
                        query: group.loop.query || '',
                        zip: group.loop.zip || false,
                        zipQuery: group.loop.zipQuery || ''
                    } : { enabled: false, query: '', zip: false, zipQuery: '' }
                };

                // Récursivement initialiser les children avec leur _order
                if (group.children && group.children.length > 0) {
                    newGroup.children = group.children.map((child, childIndex) => {
                        const initializedChild = initGroup(child, childIndex);
                        initializedChild._order = ConfigManager.normalizeOrder(child._order ?? child.order, childIndex);
                        return initializedChild;
                    });
                }

                return newGroup;
            };

            // Initialiser les pages depuis la config
            let initPages = [];
            
            // Migration: si l'ancienne structure existe (groups au lieu de pages)
            if (config.job?.groups && !config.job?.pages) {
                const allGroups = (config.job.groups || []).map((group, groupIndex) => initGroup(group, groupIndex));
                const initGroups = allGroups.filter(g => g._type === 'core');
                const initLinkGroups = allGroups.filter(g => g._type === 'link');
                
                initPages = [{
                    _id: ConfigManager.generatePageId(),
                    name: 'Feuille 1',
                    groups: initGroups,
                    linkGroups: initLinkGroups,
                    autoExecuteWithoutSources: config.job?.autoExecuteWithoutSources === true
                }];
            } else {
                // Nouvelle structure avec pages
                initPages = (config.job?.pages || []).map((page, pageIndex) => {
                    const allGroups = (page.groups || []).map((group, groupIndex) => initGroup(group, groupIndex));
                    const initGroups = allGroups.filter(g => g._type === 'core');
                    const initLinkGroups = allGroups.filter(g => g._type === 'link');
                    
                    return {
                        _id: page.id || ConfigManager.generatePageId(),
                        name: page.name || `Feuille ${pageIndex + 1}`,
                        groups: initGroups,
                        linkGroups: initLinkGroups,
                        autoExecuteWithoutSources: page.autoExecuteWithoutSources === true
                    };
                });
            }
            
            // Si aucune page n'existe, créer une page par défaut
            if (initPages.length === 0) {
                initPages = [{
                    _id: ConfigManager.generatePageId(),
                    name: 'Feuille 1',
                    groups: [],
                    linkGroups: [],
                    autoExecuteWithoutSources: false
                }];
            }

            // Mode développeur (true = affichage complet, false = mode utilisateur simplifié)
            const devMode = config.ui?.devMode !== false;

            // Affichage des paramètres avancés (navbar et boutons bottom-left)
            const displayAdvancedSettings = config.ui?.displayAdvancedSettings !== false;

            // Liste des thèmes daisyUI disponibles
            const availableThemes = [
                'light', 'dark', 'cupcake', 'bumblebee', 'emerald', 'corporate',
                'synthwave', 'retro', 'cyberpunk', 'valentine', 'halloween',
                'garden', 'forest', 'aqua', 'lofi', 'pastel', 'fantasy',
                'wireframe', 'black', 'luxury', 'dracula', 'cmyk', 'autumn',
                'business', 'acid', 'lemonade', 'night', 'coffee', 'winter',
                'dim', 'nord', 'sunset'
            ];

            // Gestion du thème (priorité: config > localStorage > light)
            const savedTheme = localStorage.getItem('sqljob-theme');
            const configTheme = config.ui?.theme;
            const currentTheme = configTheme || savedTheme || 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);

            // Moteur DB (priorité: config > localStorage > duckdb-wasm)
            const savedDbEngine = localStorage.getItem('sqljob-dbEngine');
            const configDbEngine = config.ui?.dbEngine;
            const initialDbEngine = configDbEngine || savedDbEngine || 'duckdb-wasm';
            DuckDBManager.setEngine(initialDbEngine);

            return {
                pages: initPages,
                activePageIndex: 0,
                isLoading: false,
                status: '',
                statusType: '',
                devMode: devMode,
                displayAdvancedSettings: displayAdvancedSettings,
                availableThemes: availableThemes,
                currentTheme: currentTheme,
                dbEngine: initialDbEngine,
                showDbEngineModal: false,
                
                // Getters pour la page active
                get activePage() {
                    return this.pages[this.activePageIndex] || this.pages[0];
                },
                get groups() {
                    return this.activePage?.groups || [];
                },
                get linkGroups() {
                    return this.activePage?.linkGroups || [];
                },
                get autoExecuteWithoutSources() {
                    return this.activePage?.autoExecuteWithoutSources || false;
                },
                
                // Gestion des pages
                addPage() {
                    const newPage = {
                        _id: ConfigManager.generatePageId(),
                        name: `Feuille ${this.pages.length + 1}`,
                        groups: [],
                        linkGroups: [],
                        autoExecuteWithoutSources: false
                    };
                    this.pages.push(newPage);
                    this.activePageIndex = this.pages.length - 1;
                },
                
                deletePage(index) {
                    if (this.pages.length <= 1) {
                        this.setStatus('Impossible de supprimer la dernière page', 'error');
                        return;
                    }
                    if (confirm(`Supprimer la page "${this.pages[index].name}" ?`)) {
                        this.pages.splice(index, 1);
                        if (this.activePageIndex >= this.pages.length) {
                            this.activePageIndex = this.pages.length - 1;
                        }
                    }
                },

                // Drag & drop pour réorganiser les pages
                draggedPageIndex: null,
                dragOverPageIndex: null,

                startPageDrag(index, event) {
                    if (!this.devMode) return;
                    this.draggedPageIndex = index;
                    event.dataTransfer.effectAllowed = 'move';
                    event.dataTransfer.setData('text/plain', index);
                },

                onPageDragOver(index, event) {
                    if (this.draggedPageIndex === null || this.draggedPageIndex === index) return;
                    event.preventDefault();
                    this.dragOverPageIndex = index;
                },

                onPageDragLeave() {
                    this.dragOverPageIndex = null;
                },

                onPageDrop(targetIndex, event) {
                    event.preventDefault();
                    if (this.draggedPageIndex === null || this.draggedPageIndex === targetIndex) {
                        this.draggedPageIndex = null;
                        this.dragOverPageIndex = null;
                        return;
                    }
                    const [movedPage] = this.pages.splice(this.draggedPageIndex, 1);
                    this.pages.splice(targetIndex, 0, movedPage);
                    // Ajuster l'index actif si nécessaire
                    if (this.activePageIndex === this.draggedPageIndex) {
                        this.activePageIndex = targetIndex;
                    } else if (this.draggedPageIndex < this.activePageIndex && targetIndex >= this.activePageIndex) {
                        this.activePageIndex--;
                    } else if (this.draggedPageIndex > this.activePageIndex && targetIndex <= this.activePageIndex) {
                        this.activePageIndex++;
                    }
                    this.draggedPageIndex = null;
                    this.dragOverPageIndex = null;
                    this.saveToLocalStorage();
                },

                endPageDrag() {
                    this.draggedPageIndex = null;
                    this.dragOverPageIndex = null;
                },
                
                switchPage(index) {
                    if (index >= 0 && index < this.pages.length) {
                        this.activePageIndex = index;
                    }
                },

                // Détermine si une cellule doit être affichée (fix pour les cases vides en mode view)
                shouldShowCell(cell) {
                    if (this.devMode) return true;
                    // SQL : caché car pas d'output visuel utile en mode view
                    if (cell.type === 'sqlRecursiveParse') return false;
                    // Table, Plot, Iframe, SqlStat : cachés sauf si résultat ou en cours d'exécution
                    if (['table', 'plot', 'iframe', 'sqlStat'].includes(cell.type)) {
                        return cell._status === 'success' || cell._status === 'running' || (cell._results && cell._results.length > 0);
                    }
                    return true;
                },

                // Détermine si un groupe doit être affiché (récursif)
                shouldShowGroup(group) {
                    if (this.devMode) return true;

                    // Vérifier si une des cellules du groupe est visible
                    if (group.cells && group.cells.some(cell => this.shouldShowCell(cell))) {
                        return true;
                    }

                    // Vérifier si un des enfants est visible
                    if (group.children && group.children.some(child => this.shouldShowGroup(child))) {
                        return true;
                    }

                    // Si rien n'est visible, on cache le groupe
                    return false;
                },

                // Modals & Dropdowns
                showAddGroupModal: false,
                addCellToGroupModal: { open: false, path: null },
                insertGroupModal: { open: false, atIndex: null },
                insertCellModal: { open: false, groupIndex: null, atCellIndex: null },
                cellConfigModal: { open: false, groupIndex: null, cellIndex: null },
                childGroupModal: { open: false, path: null, cellIndex: null, group: null },
                loopConfigModal: { open: false, path: null },
                exportDropdownOpen: false,

                // Variable $loop courante (utilisée pendant l'exécution d'un groupe en boucle)
                _currentLoopValue: null,

                // Fichiers collectés pendant une loop avec zip activé
                _zipFiles: [],
                _zipMode: false,

                // Drag & Drop state (unifié avec path)
                draggedCellPath: null, // { path: [], cellIndex }
                dragOverCellPath: null, // { path: [], cellIndex, position: 'left'|'right' }
                dragOverGroup: null, // { groupIndex, position: 'top'|'bottom' }
                draggedChildPath: null, // { parentPath: [], childIndex }
                dragOverChildPath: null, // { parentPath: [], childIndex, position: 'left'|'right' }
                draggedTopGroup: null, // groupIndex du groupe niveau 0 en cours de drag

                // Types de cellules disponibles
                cellTypes: [
                    { type: 'markdown', label: 'Markdown', icon: '📝' },
                    { type: 'source', label: 'Source', icon: '📄' },
                    { type: 'uiParameter', label: 'Paramètre UI', icon: '🎛️' },
                    { type: 'buttonRunNextCells', label: 'Bouton Exécuter', icon: '🚀' },
                    { type: 'sqlRecursiveParse', label: 'SQL', icon: '🗄️' },
                    { type: 'table', label: 'Tableau', icon: '📊' },
                    { type: 'plot', label: 'Graphique', icon: '📈' },
                    { type: 'iframe', label: 'HTML/Iframe', icon: '🖼️' },
                    { type: 'sqlStat', label: 'Stat SQL', icon: '📊' },
                    { type: 'publipostageWord', label: 'Publipostage Word', icon: '📄' },
                    { type: 'jsPDF', label: 'PDF (jsPDF)', icon: '📑' }
                ],

                // Tables simple-datatables par cellule
                _tables: {},

                // Cache des données des tables DuckDB pour les plots
                _tablesDataCache: {},
                _tablesDataCacheValid: false,

                // ─────────────────────────────────────────────────────────────────
                // GESTION DU MOTEUR DB
                // ─────────────────────────────────────────────────────────────────
                hasSourceCells() {
                    // Vérifie récursivement si le notebook contient des cellules source (fichiers)
                    const checkGroups = (groups) => {
                        for (const group of groups) {
                            if (group.cells?.some(cell => cell.type === 'source')) return true;
                            if (group.children && checkGroups(group.children)) return true;
                        }
                        return false;
                    };
                    return this.pages.some(page => 
                        checkGroups(page.groups || []) || checkGroups(page.linkGroups || [])
                    );
                },

                canUseDucklings() {
                    // Ducklings ne supporte pas les fichiers
                    return !this.hasSourceCells();
                },

                async switchDbEngine(newEngine) {
                    if (newEngine === this.dbEngine) return;

                    // Validation pour Ducklings
                    if (newEngine === 'ducklings' && !this.canUseDucklings()) {
                        this.setStatus('Ducklings ne supporte pas les notebooks avec fichiers. Supprimez les cellules source pour utiliser Ducklings.', 'error');
                        return;
                    }

                    this.isLoading = true;
                    try {
                        await DuckDBManager.switchEngine(newEngine, (msg, type) => this.setStatus(msg, type));
                        this.dbEngine = newEngine;
                        localStorage.setItem('sqljob-dbEngine', newEngine);
                        this.setStatus(`Moteur changé vers ${newEngine === 'ducklings' ? 'Ducklings' : 'DuckDB WASM'}`, 'success');
                    } catch (error) {
                        this.setStatus('Erreur lors du changement de moteur: ' + error.message, 'error');
                    } finally {
                        this.isLoading = false;
                    }
                },

                // ─────────────────────────────────────────────────────────────────
                // INITIALISATION
                // ─────────────────────────────────────────────────────────────────
                async init() {
                    try {
                        await DuckDBManager.initDuckDB((msg, type) => this.setStatus(msg, type));
                        // Charger les fichiers embarqués dans le HTML
                        await this.loadEmbeddedFiles();

                        // Exécuter les requêtes d'init des paramètres UI cochés
                        await this.runInitUIParameters();

                        // Auto-exécution si pas de cellule source et option activée
                        if (this.autoExecuteWithoutSources) {
                            const hasSourceCell = this.groups.some(group =>
                                group.cells.some(cell => cell.type === 'source')
                            );
                            if (!hasSourceCell) {
                                await this.runAllGroups();
                            }
                        }
                    } catch (error) {
                        this.setStatus('Erreur d\'initialisation: ' + error.message, 'error');
                    }
                },

                async loadEmbeddedFiles() {
                    // Chercher toutes les balises script avec les fichiers embarqués
                    const sourceFileScripts = document.querySelectorAll('script[id^="sourceFile_"]');
                    const docxTemplateScripts = document.querySelectorAll('script[id^="docxTemplate_"]');

                    if (sourceFileScripts.length === 0 && docxTemplateScripts.length === 0) {
                        return; // Pas de fichiers embarqués, c'est normal
                    }

                    console.info('📂 ' + (sourceFileScripts.length + docxTemplateScripts.length) + ' fichier(s) embarqué(s) trouvé(s)');

                    // Helper pour trouver la source récursivement dans toutes les pages
                    const findSourceInAllPages = (sourceName) => {
                        for (let pi = 0; pi < this.pages.length; pi++) {
                            const page = this.pages[pi];
                            const found = findSourceRecursive(page.groups, sourceName, []);
                            if (found) {
                                return { ...found, pageIndex: pi };
                            }
                        }
                        return null;
                    };
                    
                    const findSourceRecursive = (groups, sourceName, currentPath) => {
                        for (let gi = 0; gi < groups.length; gi++) {
                            const group = groups[gi];
                            const groupPath = [...currentPath, gi];

                            for (let ci = 0; ci < (group.cells || []).length; ci++) {
                                const cell = group.cells[ci];
                                if (cell.type === 'source' && cell.name === sourceName) {
                                    return { path: groupPath, cellIndex: ci, source: cell };
                                }
                            }

                            if (group.children && group.children.length > 0) {
                                const found = findSourceRecursive(group.children, sourceName, groupPath);
                                if (found) return found;
                            }
                        }
                        return null;
                    };

                    // Helper pour trouver une cellule publipostageWord par chemin
                    const findCellByPath = (groups, targetPath) => {
                        try {
                            let current = groups;
                            let group = null;
                            
                            // Naviguer jusqu'au groupe contenant la cellule
                            for (let i = 0; i < targetPath.length - 1; i++) {
                                const index = targetPath[i];
                                if (index === -1) {
                                    // LinkGroups
                                    current = this.linkGroups;
                                    continue;
                                }
                                
                                if (!current[index]) return null;
                                
                                if (i === 0) {
                                    group = current[index];
                                    current = group.children || [];
                                } else {
                                    group = current[index];
                                    current = group.children || [];
                                }
                            }
                            
                            // Récupérer la cellule
                            const cellIndex = targetPath[targetPath.length - 1];
                            const finalGroup = targetPath.length === 1 ? current[targetPath[0]] : group;
                            
                            if (!finalGroup || !finalGroup.cells || !finalGroup.cells[cellIndex]) {
                                return null;
                            }
                            
                            return {
                                cell: finalGroup.cells[cellIndex],
                                cellIndex: cellIndex
                            };
                        } catch (e) {
                            console.error('Error finding cell by path:', e);
                            return null;
                        }
                    };

                    // Charger les fichiers source
                    for (const script of sourceFileScripts) {
                        const sourceName = script.dataset.sourceName;
                        const fileName = script.dataset.fileName;
                        const base64Data = script.textContent.trim();

                        if (!sourceName || !fileName || !base64Data) {
                            console.warn('Script source incomplet:', script.id);
                            continue;
                        }

                        const found = findSourceInAllPages(sourceName);

                        if (!found) {
                            console.warn(`Source "${sourceName}" non trouvée dans les cellules`);
                            continue;
                        }
                        
                        // Basculer temporairement vers la page contenant la source
                        const originalPageIndex = this.activePageIndex;
                        this.activePageIndex = found.pageIndex;

                        try {
                            this.setStatus(`Chargement de ${sourceName}...`, 'loading');

                            // Décoder et décompresser
                            const bytes = FileHandler.base64ToUint8Array(base64Data);
                            const decompressedBuffer = await FileHandler.decompressGzip(bytes);

                            // Créer un File object
                            const blob = new Blob([decompressedBuffer]);
                            const file = new File([blob], fileName, {
                                type: FileHandler.getMimeTypeFromFileName(fileName)
                            });

                            // Charger le fichier dans la source
                            await this.loadSingleSourceFile(file, found.path, found.cellIndex);

                            console.log(`✅ Fichier "${fileName}" chargé pour la source "${sourceName}"`);
                        } catch (error) {
                            console.error(`Erreur chargement fichier embarqué ${sourceName}:`, error);
                            this.setStatus(`Erreur: ${error.message}`, 'error');
                        } finally {
                            // Restaurer la page originale
                            this.activePageIndex = originalPageIndex;
                        }
                    }

                    // Charger les templates docx pour publipostageWord
                    for (const script of docxTemplateScripts) {
                        const cellPath = script.dataset.cellPath;
                        const fileName = script.dataset.fileName;
                        const base64Data = script.textContent.trim();

                        if (!cellPath || !fileName || !base64Data) {
                            console.warn('Script docx template incomplet:', script.id);
                            continue;
                        }

                        // Convertir le cellPath en array d'indices
                        const pathArray = cellPath.split('_').map(n => parseInt(n, 10));
                        const found = findCellByPath(this.groups, pathArray);

                        if (!found) {
                            console.warn(`Cellule publipostageWord au chemin "${cellPath}" non trouvée`);
                            continue;
                        }

                        if (found.cell.type !== 'publipostageWord') {
                            console.warn(`La cellule au chemin "${cellPath}" n'est pas de type publipostageWord`);
                            continue;
                        }

                        try {
                            // Charger directement le base64 dans la cellule (pas de décompression pour docx)
                            found.cell.docxTemplateBase64 = base64Data;
                            found.cell.docxTemplateFileName = fileName;

                            console.log(`✅ Template Word "${fileName}" chargé pour la cellule au chemin "${cellPath}"`);
                        } catch (error) {
                            console.error(`Erreur chargement template docx ${cellPath}:`, error);
                        }
                    }

                    this.setStatus('Fichiers embarqués chargés', 'success');
                },

                // Exécuter les requêtes d'init des paramètres UI marqués avec initRunQuery
                async runInitUIParameters() {
                    // Collecter toutes les cellules uiParameter avec initRunQuery = true
                    const cellsToInit = [];

                    const collectFromGroup = (group, path) => {
                        for (let ci = 0; ci < (group.cells || []).length; ci++) {
                            const cell = group.cells[ci];
                            if (cell.type === 'uiParameter' && cell.initRunQuery) {
                                cellsToInit.push({
                                    cell,
                                    path,
                                    cellIndex: ci,
                                    order: cell._order ?? ci
                                });
                            }
                        }
                        if (group.children) {
                            for (let gi = 0; gi < group.children.length; gi++) {
                                collectFromGroup(group.children[gi], [...path, gi]);
                            }
                        }
                    };

                    for (let gi = 0; gi < this.groups.length; gi++) {
                        collectFromGroup(this.groups[gi], [gi]);
                    }

                    if (cellsToInit.length === 0) {
                        return; // Aucun paramètre à initialiser
                    }

                    // Trier par order
                    cellsToInit.sort((a, b) => a.order - b.order);

                    // Exécuter les requêtes d'init dans l'ordre
                    for (const item of cellsToInit) {
                        const cell = item.cell;
                        try {
                            await this.executeUiParameterCell(cell);
                        } catch (error) {
                            console.error(`Erreur init paramètre ${cell.paramName}:`, error);
                        }
                    }
                },

                // ─────────────────────────────────────────────────────────────────
                // HELPERS
                // ─────────────────────────────────────────────────────────────────
                setStatus(message, type) {
                    this.status = message;
                    this.statusType = type;
                    if (type !== 'loading') {
                        setTimeout(() => { this.status = ''; this.statusType = ''; }, 4000);
                    }
                },


                // Synchronise le contenu de la modal vers l'éditeur EasyMDE
                syncMarkdownToEditor(path, cellIndex) {
                    const cell = this.getCellAtPath(path, cellIndex);
                    if (cell && cell._easyMDE) {
                        const currentValue = cell._easyMDE.value();
                        if (currentValue !== cell.content) {
                            cell._easyMDE.value(cell.content);
                        }
                    }
                },

                // Toggle entre mode édition et vue parsée pour les cellules SQL
                toggleSqlView(cell) {
                    cell._showParsedQuery = !cell._showParsedQuery;
                },

                // Obtenir la requête SQL parsée (avec les paramètres remplacés)
                // Gère les deux types de parsing : {variable} et $parametre
                getParsedSqlQuery(query, context = {}) {
                    if (!query) return '';
                    let parsed = query;

                    // 1. Parser les variables {xxx} avec le contexte fourni
                    if (context.fileNameUpload) {
                        parsed = parsed.replace(/\{fileNameUpload\}/g, context.fileNameUpload);
                    }
                    if (context.fileName) {
                        parsed = parsed.replace(/\{fileName\}/g, context.fileName);
                    }

                    // 2. Parser les paramètres $xxx
