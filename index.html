<body class="min-h-screen font-sans bg-base-100 text-base-content transition-colors duration-200">
    <div id="app-container"></div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════════
        // ARCHITECTURE NOTEBOOK - Système de cellules
        // ═══════════════════════════════════════════════════════════════════════════

        // ═══════════════════════════════════════════════════════════════════════════
        // FONCTION UTILITAIRE: formatValueForInputType
        // ═══════════════════════════════════════════════════════════════════════════
        function formatValueForInputType(value, inputType) {
            if (value === null || value === undefined || value === '') return '';

            // Essayer de parser comme Date si nécessaire
            let dateObj = null;
            if (value instanceof Date) {
                dateObj = value;
            } else if (typeof value === 'number') {
                // Timestamp en millisecondes
                dateObj = new Date(value);
            } else if (typeof value === 'string') {
                // Essayer de parser la string comme date
                const parsed = new Date(value);
                if (!isNaN(parsed.getTime())) {
                    dateObj = parsed;
                }
            }

            // Formater selon le type d'input
            switch (inputType) {
                case 'date':
                    if (dateObj) {
                        const year = dateObj.getFullYear();
                        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                        const day = String(dateObj.getDate()).padStart(2, '0');
                        return `${year}-${month}-${day}`;
                    }
                    break;
                case 'datetime-local':
                    if (dateObj) {
                        const year = dateObj.getFullYear();
                        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                        const day = String(dateObj.getDate()).padStart(2, '0');
                        const hours = String(dateObj.getHours()).padStart(2, '0');
                        const minutes = String(dateObj.getMinutes()).padStart(2, '0');
                        return `${year}-${month}-${day}T${hours}:${minutes}`;
                    }
                    break;
                case 'time':
                    if (dateObj) {
                        const hours = String(dateObj.getHours()).padStart(2, '0');
                        const minutes = String(dateObj.getMinutes()).padStart(2, '0');
                        return `${hours}:${minutes}`;
                    }
                    // Si c'est déjà une string de temps (HH:mm ou HH:mm:ss)
                    if (typeof value === 'string' && /^\d{1,2}:\d{2}(:\d{2})?$/.test(value)) {
                        const parts = value.split(':');
                        return `${parts[0].padStart(2, '0')}:${parts[1].padStart(2, '0')}`;
                    }
                    break;
                case 'month':
                    if (dateObj) {
                        const year = dateObj.getFullYear();
                        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                        return `${year}-${month}`;
                    }
                    break;
                case 'week':
                    if (dateObj) {
                        // Calculer le numéro de semaine ISO
                        const tempDate = new Date(dateObj.getTime());
                        tempDate.setHours(0, 0, 0, 0);
                        tempDate.setDate(tempDate.getDate() + 3 - (tempDate.getDay() + 6) % 7);
                        const week1 = new Date(tempDate.getFullYear(), 0, 4);
                        const weekNum = 1 + Math.round(((tempDate.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
                        return `${tempDate.getFullYear()}-W${String(weekNum).padStart(2, '0')}`;
                    }
                    break;
            }

            // Par défaut, retourner la valeur convertie en string
            return String(value);
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // CLASSE 0: CDNManager - Chargement dynamique des CDN
        // ═══════════════════════════════════════════════════════════════════════════
        class CDNManager {
            static loadedScripts = new Set();
            static loadingPromises = new Map();

            static async loadScript(url) {
                if (this.loadedScripts.has(url)) {
                    return Promise.resolve();
                }

                if (this.loadingPromises.has(url)) {
                    return this.loadingPromises.get(url);
                }

                const promise = new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = url;
                    script.onload = () => {
                        this.loadedScripts.add(url);
                        this.loadingPromises.delete(url);
                        console.log(`✅ CDN chargé: ${url}`);
                        resolve();
                    };
                    script.onerror = () => {
                        this.loadingPromises.delete(url);
                        reject(new Error(`Échec du chargement: ${url}`));
                    };
                    document.head.appendChild(script);
                });

                this.loadingPromises.set(url, promise);
                return promise;
            }

            static async loadPlotly() {
                const plotlyUrl = 'https://cdn.plot.ly/plotly-3.3.0.min.js';
                if (typeof Plotly !== 'undefined') {
                    this.loadedScripts.add(plotlyUrl);
                    return;
                }
                await this.loadScript(plotlyUrl);
            }

            static async loadPizZip() {
                const pizzipUrl = 'https://cdn.jsdelivr.net/npm/pizzip@3.2.0/dist/pizzip.min.js';
                if (typeof PizZip === 'undefined') {
                    await this.loadScript(pizzipUrl);
                } else {
                    this.loadedScripts.add(pizzipUrl);
                }
            }

            static async loadDocxtemplater() {
                const docxtemplaterUrl = 'https://cdn.jsdelivr.net/npm/docxtemplater@3.67.6/build/docxtemplater.min.js';

                // PizZip doit être chargé avant docxtemplater
                await this.loadPizZip();

                if (typeof window.docxtemplater === 'undefined') {
                    await this.loadScript(docxtemplaterUrl);
                } else {
                    this.loadedScripts.add(docxtemplaterUrl);
                }
            }

            static async loadSimpleDatatables() {
                const simpleDatatablesUrl = 'https://cdn.jsdelivr.net/npm/simple-datatables@10.2.0/dist/umd/simple-datatables.min.js';
                const simpleDatatablesCssUrl = 'https://cdn.jsdelivr.net/npm/simple-datatables@10.2.0/dist/style.min.css';

                // Charger le CSS si pas déjà chargé
                if (!document.querySelector(`link[href="${simpleDatatablesCssUrl}"]`)) {
                    const link = document.createElement('link');
                    link.rel = 'stylesheet';
                    link.href = simpleDatatablesCssUrl;
                    document.head.appendChild(link);
                }

                if (typeof simpleDatatables !== 'undefined') {
                    this.loadedScripts.add(simpleDatatablesUrl);
                    return;
                }
                await this.loadScript(simpleDatatablesUrl);
            }

            static async loadPdfme() {
                if (window._pdfmeModules) {
                    console.log('[pdfme CDN] Modules déjà en cache');
                    return window._pdfmeModules;
                }
                console.log('[pdfme CDN] Début chargement des 3 modules ESM...');
                try {
                    console.log('[pdfme CDN] import @pdfme/common@5.5.8...');
                    const commonPromise = import('https://cdn.jsdelivr.net/npm/@pdfme/common@5.5.8/+esm');
                    console.log('[pdfme CDN] import @pdfme/generator@5.5.8...');
                    const generatorPromise = import('https://cdn.jsdelivr.net/npm/@pdfme/generator@5.5.8/+esm');
                    console.log('[pdfme CDN] import @pdfme/schemas@5.5.8...');
                    const schemasPromise = import('https://cdn.jsdelivr.net/npm/@pdfme/schemas@5.5.8/+esm');

                    const [common, generator, schemas] = await Promise.all([commonPromise, generatorPromise, schemasPromise]);

                    console.log('[pdfme CDN] common chargé, exports:', Object.keys(common));
                    console.log('[pdfme CDN] generator chargé, exports:', Object.keys(generator));
                    console.log('[pdfme CDN] schemas chargé, exports:', Object.keys(schemas));

                    window._pdfmeModules = { common, generator, schemas };
                    console.log('[pdfme CDN] Tous les modules chargés avec succès');
                    return window._pdfmeModules;
                } catch (err) {
                    console.error('[pdfme CDN] ERREUR chargement:', err);
                    console.error('[pdfme CDN] Stack:', err.stack);
                    throw err;
                }
            }

            static loadedStyles = new Set();

            static async loadStyle(url) {
                if (this.loadedStyles.has(url)) return;

                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = url;
                document.head.appendChild(link);
                this.loadedStyles.add(url);
            }

            static async loadEasyMDE() {
                const easymdeJsUrl = 'https://cdn.jsdelivr.net/npm/easymde@2.20.0/dist/easymde.min.js';
                const easymdeCssUrl = 'https://cdn.jsdelivr.net/npm/easymde@2.20.0/dist/easymde.min.css';

                // Charger le CSS
                this.loadStyle(easymdeCssUrl);

                // Charger le JS
                if (typeof EasyMDE !== 'undefined') {
                    this.loadedScripts.add(easymdeJsUrl);
                    return;
                }
                await this.loadScript(easymdeJsUrl);
            }

            static async loadXlsx() {
                const xlsxUrl = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
                if (typeof XLSX !== 'undefined') {
                    this.loadedScripts.add(xlsxUrl);
                    return;
                }
                await this.loadScript(xlsxUrl);
            }

            // CodeMirror SQL avec marimo-team/codemirror-sql
            static codeMirrorSQLLoaded = false;
            static codeMirrorSQLModules = null;
            static codeMirrorSQLLoadingPromise = null;

            static async loadCodeMirrorSQL() {
                if (this.codeMirrorSQLLoaded && this.codeMirrorSQLModules) {
                    return this.codeMirrorSQLModules;
                }

                if (this.codeMirrorSQLLoadingPromise) {
                    return this.codeMirrorSQLLoadingPromise;
                }

                this.codeMirrorSQLLoadingPromise = (async () => {
                    try {
                        console.log('⏳ Chargement de CodeMirror SQL...');

                        // Créer un import map pour forcer le partage des dépendances
                        if (!document.querySelector('script[type="importmap"]')) {
                            const importMap = document.createElement('script');
                            importMap.type = 'importmap';
                            importMap.textContent = JSON.stringify({
                                imports: {
                                    "@codemirror/state": "https://esm.sh/@codemirror/state@6.4.1",
                                    "@codemirror/view": "https://esm.sh/@codemirror/view@6.26.3",
                                    "@codemirror/language": "https://esm.sh/@codemirror/language@6.10.1",
                                    "@codemirror/commands": "https://esm.sh/@codemirror/commands@6.5.0",
                                    "@codemirror/search": "https://esm.sh/@codemirror/search@6.5.6",
                                    "@codemirror/autocomplete": "https://esm.sh/@codemirror/autocomplete@6.16.0",
                                    "@codemirror/lint": "https://esm.sh/@codemirror/lint@6.8.0",
                                    "@lezer/common": "https://esm.sh/@lezer/common@1.2.1",
                                    "@lezer/highlight": "https://esm.sh/@lezer/highlight@1.2.0",
                                    "@lezer/lr": "https://esm.sh/@lezer/lr@1.4.0",
                                    "style-mod": "https://esm.sh/style-mod@4.1.2",
                                    "w3c-keyname": "https://esm.sh/w3c-keyname@2.2.8"
                                }
                            });
                            document.head.insertBefore(importMap, document.head.firstChild);

                            // Attendre un tick pour que l'import map soit pris en compte
                            await new Promise(r => setTimeout(r, 0));
                        }

                        // Import séquentiel pour éviter les conflits
                        const stateModule = await import('https://esm.sh/@codemirror/state@6.4.1');
                        const viewModule = await import('https://esm.sh/@codemirror/view@6.26.3?deps=@codemirror/state@6.4.1');
                        const languageModule = await import('https://esm.sh/@codemirror/language@6.10.1?deps=@codemirror/state@6.4.1,@codemirror/view@6.26.3');
                        const commandsModule = await import('https://esm.sh/@codemirror/commands@6.5.0?deps=@codemirror/state@6.4.1,@codemirror/view@6.26.3,@codemirror/language@6.10.1');
                        const searchModule = await import('https://esm.sh/@codemirror/search@6.5.6?deps=@codemirror/state@6.4.1,@codemirror/view@6.26.3');
                        const autocompleteModule = await import('https://esm.sh/@codemirror/autocomplete@6.16.0?deps=@codemirror/state@6.4.1,@codemirror/view@6.26.3,@codemirror/language@6.10.1,@codemirror/commands@6.5.0');
                        const langSqlModule = await import('https://esm.sh/@codemirror/lang-sql@6.6.4?deps=@codemirror/state@6.4.1,@codemirror/view@6.26.3,@codemirror/language@6.10.1,@codemirror/autocomplete@6.16.0');
                        const themeOneDarkModule = await import('https://esm.sh/@codemirror/theme-one-dark@6.1.2?deps=@codemirror/state@6.4.1,@codemirror/view@6.26.3');

                        // Créer basicSetup manuellement
                        const basicSetup = [
                            viewModule.lineNumbers(),
                            viewModule.highlightActiveLineGutter(),
                            viewModule.highlightSpecialChars(),
                            commandsModule.history(),
                            languageModule.foldGutter(),
                            viewModule.drawSelection(),
                            viewModule.dropCursor(),
                            stateModule.EditorState.allowMultipleSelections.of(true),
                            languageModule.indentOnInput(),
                            languageModule.syntaxHighlighting(languageModule.defaultHighlightStyle, { fallback: true }),
                            languageModule.bracketMatching(),
                            autocompleteModule.closeBrackets(),
                            autocompleteModule.autocompletion(),
                            viewModule.rectangularSelection(),
                            viewModule.crosshairCursor(),
                            viewModule.highlightActiveLine(),
                            searchModule.highlightSelectionMatches(),
                            viewModule.keymap.of([
                                ...autocompleteModule.closeBracketsKeymap,
                                ...commandsModule.defaultKeymap,
                                ...searchModule.searchKeymap,
                                ...commandsModule.historyKeymap,
                                ...languageModule.foldKeymap,
                                ...autocompleteModule.completionKeymap
                            ])
                        ];

                        this.codeMirrorSQLModules = {
                            EditorView: viewModule.EditorView,
                            EditorState: stateModule.EditorState,
                            basicSetup: basicSetup,
                            sql: langSqlModule.sql,
                            StandardSQL: langSqlModule.StandardSQL,
                            DuckDBSQL: langSqlModule.DuckDBSQL || langSqlModule.StandardSQL,
                            oneDark: themeOneDarkModule.oneDark,
                            sqlExtension: null,
                            cteCompletionSource: null
                        };

                        this.codeMirrorSQLLoaded = true;
                        console.log('✅ CodeMirror SQL chargé avec succès');
                        return this.codeMirrorSQLModules;
                    } catch (error) {
                        console.error('❌ Erreur chargement CodeMirror SQL:', error);
                        this.codeMirrorSQLLoadingPromise = null;
                        throw error;
                    }
                })();

                return this.codeMirrorSQLLoadingPromise;
            }

            // Créer une instance d'éditeur CodeMirror SQL
            static createSqlEditor(container, initialValue, onChange, options = {}) {
                if (!this.codeMirrorSQLModules) {
                    throw new Error('CodeMirror SQL non chargé. Appelez loadCodeMirrorSQL() d\'abord.');
                }

                const {
                    EditorView, basicSetup, sql, StandardSQL, DuckDBSQL,
                    sqlExtension, cteCompletionSource, oneDark
                } = this.codeMirrorSQLModules;

                const isDarkTheme = document.documentElement.getAttribute('data-theme')?.includes('dark') ||
                    window.matchMedia('(prefers-color-scheme: dark)').matches;

                const schema = options.schema || {};
                const dialect = options.dialect === 'duckdb' ? DuckDBSQL : StandardSQL;

                const extensions = [
                    basicSetup,
                    sql({
                        dialect: dialect,
                        schema: schema,
                        upperCaseKeywords: true,
                    }),
                    EditorView.updateListener.of((update) => {
                        if (update.docChanged && onChange) {
                            onChange(update.state.doc.toString());
                        }
                    }),
                    EditorView.theme({
                        '&': {
                            fontSize: '14px',
                            minHeight: '80px',
                            border: '1px solid oklch(var(--b3))',
                            borderRadius: '0.5rem',
                        },
                        '.cm-scroller': {
                            fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace',
                            minHeight: '80px',
                            maxHeight: '400px',
                            overflow: 'auto',
                        },
                        '.cm-content': {
                            padding: '0.5rem 0',
                        },
                        '.cm-gutters': {
                            borderRadius: '0.5rem 0 0 0.5rem',
                        },
                        '&.cm-focused': {
                            outline: '2px solid oklch(var(--p))',
                            outlineOffset: '-1px',
                        },
                    }),
                ];

                // Ajouter marimo-sql si disponible
                if (cteCompletionSource) {
                    extensions.push(dialect.language.data.of({
                        autocomplete: cteCompletionSource,
                    }));
                }

                if (sqlExtension) {
                    extensions.push(sqlExtension({
                        linterConfig: { delay: 300 },
                        gutterConfig: {
                            backgroundColor: '#3b82f6',
                            errorBackgroundColor: '#ef4444',
                            hideWhenNotFocused: true,
                        },
                        enableHover: true,
                        hoverConfig: {
                            schema: schema,
                            hoverTime: 300,
                            enableKeywords: true,
                            enableTables: true,
                            enableColumns: true,
                        },
                    }));
                }

                if (isDarkTheme) {
                    extensions.push(oneDark);
                }

                const editor = new EditorView({
                    doc: initialValue || '',
                    extensions: extensions,
                    parent: container,
                });

                return editor;
            }

            static perspectiveLoaded = false;
            static perspectiveLoadingPromise = null;

            static async loadPerspective() {
                if (this.perspectiveLoaded) return;

                if (this.perspectiveLoadingPromise) {
                    return this.perspectiveLoadingPromise;
                }

                this.perspectiveLoadingPromise = (async () => {
                    // Charger le CSS themes
                    const themeCssUrl = 'https://cdn.jsdelivr.net/npm/@perspective-dev/viewer/dist/css/themes.css';
                    if (!document.querySelector(`link[href="${themeCssUrl}"]`)) {
                        const link = document.createElement('link');
                        link.rel = 'stylesheet';
                        link.crossOrigin = 'anonymous';
                        link.href = themeCssUrl;

                        // Attendre que le CSS soit chargé
                        await new Promise((resolve, reject) => {
                            link.onload = resolve;
                            link.onerror = reject;
                            document.head.appendChild(link);
                        });
                    }

                    // Charger les modules ES6 pour Perspective
                    await import('https://cdn.jsdelivr.net/npm/@perspective-dev/viewer@4.1.0/dist/cdn/perspective-viewer.js');

        // ═══════════════════════════════════════════════════════════════════════════
        // CLASSE 1: ConfigManager
        // ═══════════════════════════════════════════════════════════════════════════
        class ConfigManager {
            static getDefaultConfig() {
                try {
                    const scriptElement = document.getElementById('defaultConfigBase64');
                    const defaultConfigBase64 = scriptElement?.textContent?.trim();

                    if (!defaultConfigBase64) return { job: { cells: [] } };

                    try {
                        const base64Decoded = atob(defaultConfigBase64);
                        const decoded = decodeURIComponent(escape(base64Decoded));
                        return JSON.parse(decoded);
                    } catch {
                        return JSON.parse(atob(defaultConfigBase64));
                    }
                } catch (error) {
                    console.error('Erreur de décodage config:', error);
                    return { job: { cells: [] } };
                }
            }

            static normalizeOrder(value, fallback) {
                if (value === undefined || value === null) return fallback;
                if (typeof value === 'string' && value.trim() === '') return fallback;
                const parsed = Number(value);
                return Number.isFinite(parsed) ? parsed : fallback;
            }

            static encodeUTF8ToBase64(str) {
                return btoa(unescape(encodeURIComponent(str)));
            }

            /**
             * Génère un ID unique pour un groupe
             */
            static generateGroupId() {
                return 'grp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            }

            /**
             * Génère un ID unique pour une page
             */
            static generatePageId() {
                return 'page_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            }

            static deepMerge(target, source) {
                const output = { ...target };
                if (target && typeof target === 'object' && source && typeof source === 'object') {
                    Object.keys(source).forEach(key => {
                        if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key])) {
                            output[key] = ConfigManager.deepMerge(target[key] || {}, source[key]);
                        } else {
                            output[key] = source[key];
                        }
                    });
                }
                return output;
            }

            /**
             * Parse les paramètres UI depuis l'URL
             * Paramètres supportés: devMode, displaySettings, theme, dbEngine
             * @returns {Object} Objet contenant les paramètres UI trouvés dans l'URL
             */
            static getUIParamsFromURL() {
                const urlParams = new URLSearchParams(window.location.search);
                const uiParams = {};

                // devMode: boolean
                if (urlParams.has('devMode')) {
                    const val = urlParams.get('devMode').toLowerCase();
                    uiParams.devMode = val !== 'false' && val !== '0';
                }

                // displaySettings: boolean
                if (urlParams.has('displaySettings')) {
                    const val = urlParams.get('displaySettings').toLowerCase();
                    uiParams.displaySettings = val !== 'false' && val !== '0';
                }

                // theme: string
                if (urlParams.has('theme')) {
                    uiParams.theme = urlParams.get('theme');
                }

                // dbEngine: string
                if (urlParams.has('dbEngine')) {
                    uiParams.dbEngine = urlParams.get('dbEngine');
                }

                if (Object.keys(uiParams).length > 0) {
                    console.log('🔗 Paramètres UI depuis l\'URL:', uiParams);
                }

                return uiParams;
            }

            /**
             * Applique les paramètres UI de l'URL sur une config existante
             * Priorité: URL > config existante
             */
            static applyURLParamsToConfig(config) {
                const urlParams = ConfigManager.getUIParamsFromURL();
                if (Object.keys(urlParams).length === 0) {
                    return config;
                }

                // Créer une copie de la config avec les paramètres URL appliqués
                const result = { ...config };
                result.ui = { ...(config.ui || {}), ...urlParams };
                return result;
            }

            /**
             * Charge la configuration avec la priorité: URL > gist > base64 > default
             */
            static async loadConfigFromGist() {
                const gistId = (() => {
                    const urlParams = new URLSearchParams(window.location.search);
                    const gistParam = urlParams.get('gist');
                    if (gistParam && /^[a-f0-9]{32}$/i.test(gistParam)) return gistParam;
                    if (gistParam) {
                        const match = gistParam.match(/gist\.github\.com\/[^\/]+\/([a-f0-9]{32})/i);
                        if (match) return match[1];
                    }
                    const configParam = urlParams.get('config');
                    if (configParam) {
                        const match = configParam.match(/gist\.github\.com\/[^\/]+\/([a-f0-9]{32})/i);
                        if (match) return match[1];
                    }
                    const fullUrlMatch = window.location.href.match(/gist\.github\.com\/[^\/]+\/([a-f0-9]{32})/i);
                    if (fullUrlMatch) return fullUrlMatch[1];
                    return null;
                })();

                let baseConfig = null;

                if (gistId) {
                    try {
                        console.log('🔗 Détection d\'un Gist dans l\'URL, chargement de la configuration...', gistId);
                        const apiUrl = `https://api.github.com/gists/${gistId}`;
                        const response = await fetch(apiUrl);
                        if (response.ok) {
                            const gistData = await response.json();
                            const files = Object.values(gistData.files || {});
                            const jsonFile = files.find(file =>
                                file.filename.toLowerCase().endsWith('.json') ||
                                file.type === 'application/json'
                            );
                            if (jsonFile) {
                                try {
                                    const config = JSON.parse(jsonFile.content);
                                    console.log('✅ Configuration chargée depuis le Gist:', config);
                                    baseConfig = ConfigManager.deepMerge(ConfigManager.getDefaultConfig(), config);
                                } catch (parseError) {
                                    console.error('❌ Erreur de parsing JSON du Gist:', parseError);
                                    throw new Error(`Le fichier JSON du Gist est invalide. Erreur: ${parseError.message}`);
                                }
                            } else {
                                console.warn('⚠️ Aucun fichier JSON trouvé dans le Gist');
                            }
                        } else {
                            console.error('❌ Erreur HTTP lors du chargement du Gist:', response.status, response.statusText);
                        }
                    } catch (error) {
                        console.error('❌ Erreur lors du chargement du Gist:', error);
                    }
                }

                // Si pas de config depuis le gist, utiliser la config par défaut (base64)
                if (!baseConfig) {
                    baseConfig = ConfigManager.getDefaultConfig();
                }

                // Appliquer les paramètres URL en priorité (URL > gist > base64 > default)
                return ConfigManager.applyURLParamsToConfig(baseConfig);
            }

            static async cleanCell(cell, includeFileData = false) {
                const cleanCell = { type: cell.type };

                switch (cell.type) {
                    case 'markdown':
                        cleanCell.content = cell.content;
                        break;
                    case 'source':
                        cleanCell.name = cell.name;
                        cleanCell.importText = cell.importText;
                        cleanCell.query = cell.query;
                        cleanCell.fallbackAllVarcharOnError = cell.fallbackAllVarcharOnError;
                        cleanCell.xlsx = cell.xlsx;
                        cleanCell.autoRunNextCells = cell.autoRunNextCells;
                        cleanCell.preloadXlsxBySheetjs = cell.preloadXlsxBySheetjs || false;
                        // Ajouter le fichier base64 si demandé et si un fichier est chargé
                        if (includeFileData && cell._currentFile && cell._fileName) {
                            try {
                                const arrayBuffer = await cell._currentFile.arrayBuffer();
                                cleanCell.fileBase64 = FileHandler.arrayBufferToBase64(arrayBuffer);
                                cleanCell.fileName = cell._fileName;
                            } catch (e) {
                                console.warn('Impossible de lire le fichier source:', e);
                            }
                        }
                        break;
                    case 'buttonRunNextCells':
                        cleanCell.buttonLabel = cell.buttonLabel;
                        break;
                    case 'table':
                        cleanCell.query = cell.query;
                        cleanCell.maxRows = cell.maxRows;
                        if (cell.showSqlEditorForClient !== undefined) cleanCell.showSqlEditorForClient = cell.showSqlEditorForClient;
                        break;
                    case 'plot':
                        cleanCell.query = cell.query;
                        cleanCell.tables = cell.tables;
                        break;
                    case 'iframe':
                        cleanCell.query = cell.query;
                        if (cell.showSqlEditorForClient !== undefined) cleanCell.showSqlEditorForClient = cell.showSqlEditorForClient;
                        break;
                    case 'sqlRecursiveParse':
                        cleanCell.query = cell.query;
                        if (cell.showSqlEditorForClient !== undefined) cleanCell.showSqlEditorForClient = cell.showSqlEditorForClient;
                        break;
                    case 'sqlStat':
                        cleanCell.query = cell.query;
                        cleanCell.statTitle = cell.statTitle;
                        cleanCell.statDesc = cell.statDesc;
                        if (cell.dataIcon) cleanCell.dataIcon = cell.dataIcon;
                        if (cell.showSqlEditorForClient !== undefined) cleanCell.showSqlEditorForClient = cell.showSqlEditorForClient;
                        break;
                    case 'uiParameter':
                        cleanCell.paramName = cell.paramName;
                        cleanCell.paramType = cell.paramType;
                        cleanCell.languageType = cell.languageType;
                        cleanCell.label = cell.label;
                        cleanCell.initRunQuery = cell.initRunQuery;
                        cleanCell.query = cell.query;
                        if (cell.inputType) cleanCell.inputType = cell.inputType;
                        if (cell.rangeMin !== undefined) cleanCell.rangeMin = cell.rangeMin;
                        if (cell.rangeMax !== undefined) cleanCell.rangeMax = cell.rangeMax;
                        if (cell.rangeStep !== undefined) cleanCell.rangeStep = cell.rangeStep;
                        if (cell.userVisible !== undefined) cleanCell.userVisible = cell.userVisible;
                        if (cell.userEditable !== undefined) cleanCell.userEditable = cell.userEditable;
                        if (cell.preserveUserValue !== undefined) cleanCell.preserveUserValue = cell.preserveUserValue;
                        break;
                    case 'publipostageWord':
                        cleanCell.query = cell.query;
                        cleanCell.query2 = cell.query2;
                        // Ajouter le fichier base64 si demandé et si un template est chargé
                        if (includeFileData && cell.docxTemplateBase64 && cell.docxTemplateFileName) {
                            cleanCell.fileBase64 = cell.docxTemplateBase64;
                            cleanCell.fileName = cell.docxTemplateFileName;
                        }
                        break;
                    case 'pdfme':
                        cleanCell.query = cell.query;
                        cleanCell.pdfmeTemplate = cell.pdfmeTemplate;
                        cleanCell.pdfmePlugins = cell.pdfmePlugins;
                        cleanCell.pdfFileName = cell.pdfFileName;
                        break;
                    case 'perspective':
                        cleanCell.query = cell.query;
                        cleanCell.perspectiveConfig = cell.perspectiveConfig;
                        cleanCell.duckdbHandler = cell.duckdbHandler;
                        if (cell.showSqlEditorForClient !== undefined) cleanCell.showSqlEditorForClient = cell.showSqlEditorForClient;
                        break;
                }

                const orderValue = ConfigManager.normalizeOrder(cell._order ?? cell.order, undefined);
                if (orderValue !== undefined) {
                    cleanCell.order = orderValue;
                }

                // Ajouter childGroupId si présent
                if (cell.childGroupId) {
                    cleanCell.childGroupId = cell.childGroupId;
                }

                return cleanCell;
            }

            static async cleanGroup(group, includeFileData = false) {
                const cleanGroup = {
                    direction: group.direction || 'row',
                    style: group.style || '',
                    cells: await Promise.all((group.cells || []).map(cell => ConfigManager.cleanCell(cell, includeFileData)))
                };

                // Ajouter les paramètres accordion si définis
                if (group.accordion) {
                    cleanGroup.accordion = true;
                    cleanGroup.title = group.title || '';
                    cleanGroup.accordionOpen = group.accordionOpen !== false; // true par défaut
                }

                // Ajouter ifQuery si défini (condition d'affichage en mode client)
                if (group.ifQuery && group.ifQuery.trim()) {
                    cleanGroup.ifQuery = group.ifQuery.trim();
                    cleanGroup.ifQueryLanguageType = group.ifQueryLanguageType || 'sql';
                }

                // Ajouter la config de loop si elle existe
                if (group.loop && group.loop.enabled) {
                    cleanGroup.loop = {
                        enabled: true,
                        query: group.loop.query || '',
                        zip: group.loop.zip || false,
                        zipQuery: group.loop.zipQuery || ''
                    };
                }

                // Ajouter le type ("core" ou "link")
                const groupType = group.type || group._type || 'core';
                cleanGroup.type = groupType;

                // Ajouter l'ID (obligatoire)
                cleanGroup.id = group.id || group._id || ConfigManager.generateGroupId();

                // Ajouter order seulement pour les groupes "core"
                if (groupType === 'core') {
                    const orderValue = ConfigManager.normalizeOrder(group._order ?? group.order, undefined);
                    if (orderValue !== undefined) {
                        cleanGroup.order = orderValue;
                    }
                }

                // Récursivement nettoyer les children
                if (group.children && group.children.length > 0) {
                    cleanGroup.children = await Promise.all(group.children.map(child => ConfigManager.cleanGroup(child, includeFileData)));
                }

                return cleanGroup;
            }

            static async buildConfigFromState(pages, devMode = true, displaySettings = true, includeFileData = false, theme = 'light', dbEngine = 'duckdb-wasm', directedAcyclicGraph = false) {
                // Nettoyer chaque page
                const cleanPages = await Promise.all(pages.map(async (page) => {
                    const cleanGroups = await Promise.all(page.groups.map(group => ConfigManager.cleanGroup(group, includeFileData)));
                    const cleanLinkGroups = await Promise.all((page.linkGroups || []).map(group => ConfigManager.cleanGroup(group, includeFileData)));

                    // Merger groups et linkGroups dans un seul tableau
                    const allGroups = [...cleanGroups, ...cleanLinkGroups];

                    return {
                        name: page.name,
                        autoExecuteWithoutSources: page.autoExecuteWithoutSources,
                        groups: allGroups
                    };
                }));

                return {
                    ui: {
                        devMode: devMode,
                        displaySettings: displaySettings,
                        theme: theme,
                        dbEngine: dbEngine,
                        directedAcyclicGraph: directedAcyclicGraph
                    },
                    job: {
                        pages: cleanPages
                    }
                };
            }
        }

        // CLASSE 2: GitHubGistManager
        // ═══════════════════════════════════════════════════════════════════════════
        class GitHubGistManager {
            static CLIENT_ID = ''; // À configurer par l'utilisateur
            static REDIRECT_URI = window.location.origin + window.location.pathname;
            static ACCESS_TOKEN_KEY = 'github_access_token';

            /**
             * Vérifie si un token d'accès est stocké
             */
            static hasAccessToken() {
                return !!localStorage.getItem(this.ACCESS_TOKEN_KEY);
            }

            /**
             * Récupère le token d'accès stocké
             */
            static getAccessToken() {
                return localStorage.getItem(this.ACCESS_TOKEN_KEY);
            }

            /**
             * Stocke le token d'accès
             */
            static setAccessToken(token) {
                localStorage.setItem(this.ACCESS_TOKEN_KEY, token);
            }

            /**
             * Supprime le token d'accès
             */
            static clearAccessToken() {
                localStorage.removeItem(this.ACCESS_TOKEN_KEY);
            }

            /**
             * Vérifie si nous revenons d'une authentification GitHub
             * et extrait le code d'autorisation
             */
            static checkAuthCallback() {
                const urlParams = new URLSearchParams(window.location.search);
                const code = urlParams.get('code');
                const state = urlParams.get('state');

                if (code && state === 'github_gist_auth') {
                    // Nettoyer l'URL
                    window.history.replaceState({}, document.title, window.location.pathname);
                    return code;
                }
                return null;
            }

            /**
             * Redirige vers GitHub pour l'authentification OAuth
             */
            static initiateAuth() {
                if (!this.CLIENT_ID) {
                    throw new Error('GitHub Client ID non configuré. Veuillez configurer CLIENT_ID dans GitHubGistManager.');
                }

                const authUrl = new URL('https://github.com/login/oauth/authorize');
                authUrl.searchParams.set('client_id', this.CLIENT_ID);
                authUrl.searchParams.set('redirect_uri', this.REDIRECT_URI);
                authUrl.searchParams.set('scope', 'gist');
                authUrl.searchParams.set('state', 'github_gist_auth');

                window.location.href = authUrl.toString();
            }

            /**
             * Échange le code d'autorisation contre un token d'accès
             * Note: Cela nécessite un backend proxy car GitHub ne permet pas CORS
             * Pour une solution client-only, on peut utiliser le Device Flow ou demander à l'utilisateur
             * de créer un Personal Access Token
             */
            static async exchangeCodeForToken(code) {
                // Cette méthode nécessiterait un backend proxy
                // Pour l'instant, nous utiliserons une approche avec Personal Access Token
                throw new Error('Exchange code nécessite un backend proxy. Utilisez setAccessToken() avec un Personal Access Token.');
            }

            /**
             * Crée un gist avec la configuration
             * @param {Object} config - Configuration à partager
             * @param {string} description - Description du gist
             * @param {string} fileName - Nom du fichier JSON (par défaut: notebook-config.json)
             * @returns {Promise<string>} URL du gist créé
             */
            static async createGist(config, description = 'sqljob Notebook Configuration', fileName = 'gistconfig.sqljob.json') {
                const token = this.getAccessToken();
                if (!token) {
                    throw new Error('Non authentifié. Veuillez configurer un Personal Access Token.');
                }

                const jsonString = JSON.stringify(config, null, 2);

                // S'assurer que le nom de fichier a l'extension .json
                const finalFileName = fileName.endsWith('.json') ? fileName : `${fileName}.json`;

                const gistData = {
                    description: description,
                    public: false,
                    files: {
                        [finalFileName]: {
                            content: jsonString
                        }
                    }
                };

                try {
                    const response = await fetch('https://api.github.com/gists', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Accept': 'application/vnd.github+json',
                            'Content-Type': 'application/json',
                            'X-GitHub-Api-Version': '2022-11-28'
                        },
                        body: JSON.stringify(gistData)
                    });

                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.message || 'Erreur lors de la création du gist');
                    }

                    const result = await response.json();
                    return result.html_url;
                } catch (error) {
                    console.error('Erreur création gist:', error);
                    throw error;
                }
            }

            /**
             * Génère une URL sqljob avec le gist
             * @param {string} gistUrl - URL du gist GitHub
             * @returns {string} URL sqljob avec le paramètre gist
             */
            static generateSqljobUrl(gistUrl) {
                const gistId = gistUrl.match(/gist\.github\.com\/[^\/]+\/([a-f0-9]{32})/i)?.[1];
                if (!gistId) {
                    throw new Error('URL de gist invalide');
                }

                /*const baseUrl = window.location.origin + window.location.pathname;*/
                const baseUrl = 'https://ihatexcel.github.io/sqljob/';
                return `${baseUrl}?gist=${gistId}`;
            }
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // CLASSE 3: FileHandler
        // ═══════════════════════════════════════════════════════════════════════════
        class FileHandler {
            static getMimeTypeFromFileName(fileName) {
                const ext = fileName.split('.').pop().toLowerCase();
                const mimeTypes = {
                    'csv': 'text/csv',
                    'parquet': 'application/octet-stream',
                    'xlsx': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
                    'xls': 'application/vnd.ms-excel'
                };
                return mimeTypes[ext] || 'application/octet-stream';
            }

            static async compressGzip(arrayBuffer) {
                if (typeof CompressionStream === 'undefined') {
                    throw new Error('CompressionStream non supporté');
                }

                const compressionStream = new CompressionStream('gzip');
                const reader = compressionStream.readable.getReader();
                const chunks = [];

                const readPromise = (async () => {
                    let done = false;
                    while (!done) {
                        const { value, done: streamDone } = await reader.read();
                        done = streamDone;
                        if (value) chunks.push(value);
                    }
                })();

                const writer = compressionStream.writable.getWriter();
                await writer.write(new Uint8Array(arrayBuffer));
                await writer.close();
                await readPromise;

                return await new Blob(chunks).arrayBuffer();
            }

            static async decompressGzip(compressedData) {
                if (typeof DecompressionStream === 'undefined') {
                    throw new Error('DecompressionStream non supporté');
                }

                const decompressionStream = new DecompressionStream('gzip');
                const reader = decompressionStream.readable.getReader();
                const chunks = [];

                const readPromise = (async () => {
                    let done = false;
                    while (!done) {
                        const { value, done: streamDone } = await reader.read();
                        done = streamDone;
                        if (value) chunks.push(value);
                    }
                })();

                const writer = decompressionStream.writable.getWriter();
                await writer.write(compressedData);
                await writer.close();
                await readPromise;

                return await new Blob(chunks).arrayBuffer();
            }

            static arrayBufferToBase64(arrayBuffer) {
                const bytes = new Uint8Array(arrayBuffer);
                let binary = '';
                for (let i = 0; i < bytes.length; i++) {
                    binary += String.fromCharCode(bytes[i]);
                }
                return btoa(binary);
            }

            static base64ToUint8Array(base64) {
                const binaryString = atob(base64);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                return bytes;
            }

            static async processExcelFile(file, xlsxOptions, xlsxToCsvOptions, xlsxSheetSelection) {
                // Charger xlsx (SheetJS) à la demande
                await CDNManager.loadXlsx();

                const workbook = XLSX.read(await file.arrayBuffer(), { type: 'array', ...xlsxOptions });

                let selectedSheetName = workbook.SheetNames[0];
                const sheetSelection = xlsxSheetSelection || { type: { auto: true } };

                if (sheetSelection.type?.name && sheetSelection.name) {
                    if (workbook.SheetNames.includes(sheetSelection.name)) {
                        selectedSheetName = sheetSelection.name;
                    }
                } else if (sheetSelection.type?.index && sheetSelection.index > 0) {
                    if (sheetSelection.index < workbook.SheetNames.length) {
                        selectedSheetName = workbook.SheetNames[sheetSelection.index];
                    }
                }

                const selectedSheet = workbook.Sheets[selectedSheetName];
                const csv = XLSX.utils.sheet_to_csv(selectedSheet, xlsxToCsvOptions || {});

                return {
                    csv,
                    csvFileName: file.name.replace(/\.(xlsx|xls)$/i, '.csv'),
                    sheetName: selectedSheetName
                };
            }

            static downloadFile(blob, fileName) {
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            }
        }

        // CLASSE 3: DuckDBManager (Dual Engine: duckdb-wasm / ducklings)
        // ═══════════════════════════════════════════════════════════════════════════
        class DuckDBManager {
            static dbInstance = null;
            static connInstance = null;
            static duckdbModuleRef = null;
            static currentEngine = 'duckdb-wasm'; // 'duckdb-wasm' | 'ducklings'
            static workerRef = null;

            // Versions et URLs des CDN (chargés dynamiquement selon le moteur)
            static DUCKDB_WASM_VERSION = '1.33.1-dev18.0';
            static DUCKLINGS_VERSION = '1.4.4';

            static getDuckDBWasmUrl() {
                return `https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@${DuckDBManager.DUCKDB_WASM_VERSION}/+esm`;
            }

            static getDucklingsUrl() {
                return `https://cdn.jsdelivr.net/npm/@ducklings/browser@${DuckDBManager.DUCKLINGS_VERSION}/+esm`;
            }

            static getEngine() {
                return DuckDBManager.currentEngine;
            }

            static setEngine(engine) {
                if (!['duckdb-wasm', 'ducklings'].includes(engine)) {
                    throw new Error(`Moteur inconnu: ${engine}`);
                }
                DuckDBManager.currentEngine = engine;
            }

            static async destroy(onStatus) {
                onStatus?.('Destruction de la base de données...', 'loading');

                try {
                    if (DuckDBManager.connInstance) {
                        if (DuckDBManager.currentEngine === 'ducklings') {
                            await DuckDBManager.connInstance.close?.();
                        }
                        DuckDBManager.connInstance = null;
                    }

                    if (DuckDBManager.dbInstance) {
                        if (DuckDBManager.currentEngine === 'ducklings') {
                            await DuckDBManager.dbInstance.close?.();
                        } else {
                            await DuckDBManager.dbInstance.terminate?.();
                        }
                        DuckDBManager.dbInstance = null;
                    }

                    if (DuckDBManager.workerRef) {
                        DuckDBManager.workerRef.terminate?.();
                        DuckDBManager.workerRef = null;
                    }

                    DuckDBManager.duckdbModuleRef = null;
                    window.duckdbModule = null;
                    window.ducklingsModule = null;

                    onStatus?.('Base de données détruite', 'success');
                } catch (error) {
                    console.error('Erreur destruction DB:', error);
                    onStatus?.('Erreur destruction: ' + error.message, 'error');
                }
            }

            static async switchEngine(newEngine, onStatus) {
                if (newEngine === DuckDBManager.currentEngine && DuckDBManager.dbInstance) {
                    return; // Déjà sur ce moteur et initialisé
                }

                // Détruire l'instance actuelle
                await DuckDBManager.destroy(onStatus);

                // Changer le moteur
                DuckDBManager.setEngine(newEngine);

                // Réinitialiser avec le nouveau moteur
                await DuckDBManager.initDuckDB(onStatus);
            }

            static supportsFileOperations() {
                return DuckDBManager.currentEngine === 'duckdb-wasm';
            }

            static supportsExtensions() {
                return DuckDBManager.currentEngine === 'duckdb-wasm';
            }

            static async initDuckDB(onStatus) {
                if (DuckDBManager.dbInstance && DuckDBManager.connInstance) {
                    return { db: DuckDBManager.dbInstance, conn: DuckDBManager.connInstance };
                }

                if (DuckDBManager.currentEngine === 'ducklings') {
                    return await DuckDBManager._initDucklings(onStatus);
                } else {
                    return await DuckDBManager._initDuckDBWasm(onStatus);
                }
            }

            static async _initDuckDBWasm(onStatus) {
                onStatus?.('Initialisation de DuckDB WASM...', 'loading');

                const duckdb = await import(DuckDBManager.getDuckDBWasmUrl());
                window.duckdbModule = duckdb;
                DuckDBManager.duckdbModuleRef = duckdb;

                const JSDELIVR_BUNDLES = duckdb.getJsDelivrBundles();
                const bundle = await duckdb.selectBundle(JSDELIVR_BUNDLES);

                const worker_url = URL.createObjectURL(
                    new Blob([`importScripts("${bundle.mainWorker}");`], { type: 'text/javascript' })
                );
                const worker = new Worker(worker_url);
                DuckDBManager.workerRef = worker;

                // Créer un logger personnalisé compatible avec Perspective
                const logger = {
                    log(entry) {
                        console.log('[DuckDB]', entry);
                    }
                };

                DuckDBManager.dbInstance = new duckdb.AsyncDuckDB(logger, worker);
                URL.revokeObjectURL(worker_url);

                await DuckDBManager.dbInstance.instantiate(bundle.mainModule, bundle.pthreadWorker);
                DuckDBManager.connInstance = await DuckDBManager.dbInstance.connect();

                // Installer et charger l'extension excel pour supporter les fichiers xlsx nativement
                onStatus?.('Chargement extension Excel...', 'loading');
                await DuckDBManager.connInstance.query('INSTALL excel;');
                await DuckDBManager.connInstance.query('LOAD excel;');

                onStatus?.('DuckDB WASM prêt', 'success');

                return { db: DuckDBManager.dbInstance, conn: DuckDBManager.connInstance };
            }

            static async _initDucklings(onStatus) {
                onStatus?.('Initialisation de Ducklings...', 'loading');

                // Ducklings ne fonctionne pas depuis file:// (worker ES module)
                if (location.protocol === 'file:') {
                    onStatus?.('Ducklings nécessite un serveur HTTP. Basculement vers DuckDB WASM...', 'warning');
                    await new Promise(resolve => setTimeout(resolve, 1500));
                    DuckDBManager.currentEngine = 'duckdb-wasm';
                    return await DuckDBManager._initDuckDBWasm(onStatus);
                }

                const ducklings = await import(DuckDBManager.getDucklingsUrl());
                window.ducklingsModule = ducklings;
                DuckDBManager.duckdbModuleRef = ducklings;

                const bundle = ducklings.getJsDelivrBundle();
                const worker = await ducklings.createWorker(bundle.mainWorker);
                DuckDBManager.workerRef = worker;

                await ducklings.init({
                    worker,
                    wasmUrl: bundle.wasmModule,
                    wasmJsUrl: bundle.wasmJs
                });

                DuckDBManager.dbInstance = new ducklings.DuckDB();
                DuckDBManager.connInstance = await DuckDBManager.dbInstance.connect();

                onStatus?.('Ducklings prêt', 'success');

                return { db: DuckDBManager.dbInstance, conn: DuckDBManager.connInstance };
            }

            static async executeQuery(query) {
                if (!DuckDBManager.connInstance) {
                    throw new Error('DuckDB non initialisé');
                }

                if (DuckDBManager.currentEngine === 'ducklings') {
                    // Ducklings retourne directement un tableau d'objets
                    const result = await DuckDBManager.connInstance.query(query);
                    return result;
                } else {
                    // DuckDB WASM nécessite une conversion
                    const result = await DuckDBManager.connInstance.query(query);
                    return result.toArray().map(row => Object.fromEntries(row));
                }
            }

            static async registerFile(fileName, file) {
                if (DuckDBManager.currentEngine === 'ducklings') {
                    throw new Error('Ducklings ne supporte pas l\'enregistrement de fichiers. Utilisez DuckDB WASM pour les notebooks avec fichiers.');
                }
                if (!DuckDBManager.dbInstance || !DuckDBManager.duckdbModuleRef) {
                    throw new Error('DuckDB non initialisé');
                }
                await DuckDBManager.dbInstance.registerFileHandle(
                    fileName,
                    file,
                    DuckDBManager.duckdbModuleRef.DuckDBDataProtocol.BROWSER_FILEREADER,
                    true
                );
            }

            static async copyFileToBuffer(fileName) {
                if (DuckDBManager.currentEngine === 'ducklings') {
                    throw new Error('Ducklings ne supporte pas copyFileToBuffer. Utilisez DuckDB WASM.');
                }
                return await DuckDBManager.dbInstance.copyFileToBuffer(fileName);
            }

            static async executeQueryArrow(query) {
                if (!DuckDBManager.connInstance) {
                    throw new Error('DuckDB non initialisé');
                }

                if (DuckDBManager.currentEngine === 'ducklings') {
                    throw new Error('Ducklings ne supporte pas le format Arrow. Utilisez DuckDB WASM.');
                }

                // DuckDB WASM retourne directement un Arrow Table
                const result = await DuckDBManager.connInstance.query(query);
                return result;
            }

            static getConnection() {
                return DuckDBManager.connInstance;
            }

            static getDatabase() {
                return DuckDBManager.dbInstance;
            }
        }

        // CLASSE 4: PlotlyManager
        // ═══════════════════════════════════════════════════════════════════════════
        class PlotlyManager {
            static cleanData(data) {
                if (!data || data.length === 0) return [];

                return data.map(row => {
                    const cleanRow = {};
                    for (const [key, value] of Object.entries(row)) {
                        if (typeof value === 'bigint') {
                            cleanRow[key] = Number(value);
                        } else if (typeof value === 'string' && value.trim() !== '' && !isNaN(value)) {
                            cleanRow[key] = parseFloat(value);
                        } else {
                            cleanRow[key] = value;
                        }
                    }
                    return cleanRow;
                });
            }

            static async createPlot(code, tablesData, container) {
                // Charger Plotly à la demande
                await CDNManager.loadPlotly();

                // Nettoyer toutes les tables
                const cleanTables = {};
                for (const [tableName, tableData] of Object.entries(tablesData)) {
                    cleanTables[tableName] = PlotlyManager.cleanData(tableData);
                }

                container.innerHTML = '';

                try {
                    // Créer les variables pour chaque table
                    const tableVars = Object.entries(cleanTables)
                        .map(([name, arr]) => `const ${name} = ${JSON.stringify(arr)};`)
                        .join('\n');

                    const executeCode = async (container, Plotly) => {
                        return eval(`(async () => { 
                            ${tableVars}
                            ${code} 
                        })()`);
                    };

                    await executeCode(container, Plotly);
                } catch (error) {
                    console.error('Erreur Plotly:', error);
                    container.innerHTML = `<p style="color: red; text-align: center;">Erreur: ${error.message}</p>`;
                    throw error;
                }
            }
        }

ORDER BY ordinal_position;`

                    {

                        description: "Génère un SELECT DISTINCT avec toutes les colonnes",
                        code: `SELECT DISTINCT {{ SELECT column_name FROM information_schema.columns

ORDER BY ordinal_position;

                        description: "Sélectionne uniquement les colonnes commençant par 'dim_'",
                        code: `-- select only the column names that start with the dim_
SELECT COLUMNS('^dim_') FROM source1;`
                    }
                ],

                // Templates JavaScript
                jsTemplates: [
                    {
                        name: "Dropdown simple",
                        description: "Retourne un tableau d'options pour un dropdown",
                        code: `["Option 1", "Option 2", "Option 3"];`
                    },
                    {
                        name: "Valeur calculée",
                        description: "Retourne une valeur calculée dynamiquement",
                        code: `// Exemple de calcul
const today = new Date().toISOString().split('T')[0];
return today;`
                    },
                    {
                        name: "Dropdown conditionnel",
                        description: "Options qui dépendent d'un autre paramètre",
                        code: `// Options basées sur un autre paramètre
if ($param1 === "Type A") {
    return ["A1", "A2", "A3"];
} else {
    return ["B1", "B2", "B3"];
}`
                    }
                ],

                open(cellId, queryType, languageType = 'sql') {
                    this.currentCellId = cellId;
                    this.currentQueryType = queryType;
                    this.currentLanguageType = languageType;
                    this.searchQuery = '';
                    this.filterTemplates();
                    this.isOpen = true;
                },

                close() {
                    this.isOpen = false;
                    this.currentCellId = null;
                    this.currentQueryType = null;
                    this.currentLanguageType = null;
                    this.searchQuery = '';
                    this.filteredTemplates = [];
                },

                getCurrentTemplates() {
                    return this.currentLanguageType === 'js' ? this.jsTemplates : this.sqlTemplates;
                },

                getModalTitle() {
                    return this.currentLanguageType === 'js' ? '📋 Templates JavaScript' : '📋 Templates SQL';
                },

                filterTemplates() {
                    const query = this.searchQuery.toLowerCase().trim();
                    const templates = this.getCurrentTemplates();

                    if (!query) {
                        // Si pas de recherche, afficher tous les templates avec leur index original
                        this.filteredTemplates = templates.map((template, idx) => ({
                            ...template,
                            originalIndex: idx
                        }));
                        return;
                    }

                    // Filtrer les templates par recherche dans le nom, description et code
                    this.filteredTemplates = templates
                        .map((template, idx) => ({ ...template, originalIndex: idx }))
                        .filter(template => {
                            const searchIn = `${template.name} ${template.description} ${template.code}`.toLowerCase();
                            return searchIn.includes(query);
                        });
                },

                selectTemplate(templateIndex) {
                    if (this.currentCellId && this.currentQueryType && this.currentLanguageType) {
                        // Accéder à l'instance Alpine.js via le DOM
                        const appContainer = document.querySelector('[x-data]');
                        if (appContainer && appContainer._x_dataStack) {
                            const alpineInstance = appContainer._x_dataStack[0];
                            if (alpineInstance && alpineInstance.insertTemplate) {
                                alpineInstance.insertTemplate(this.currentCellId, this.currentQueryType, templateIndex, this.currentLanguageType);
                            }
                        }
                        this.close();
                    }
                }
            });
        });

        // ═══════════════════════════════════════════════════════════════════════════
        // APPLICATION ALPINE.JS
        // ═══════════════════════════════════════════════════════════════════════════
        function notebookApp() {
            // Utiliser la config chargée depuis le Gist si disponible, sinon la config par défaut
            const config = window._loadedConfig || ConfigManager.getDefaultConfig();

            // Helper pour initialiser une cellule avec ses propriétés runtime
            const initCell = (cell, cellIndex) => {
                const newCell = {
                    ...cell,
                    _id: 'cell_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                    _status: null,
                    _results: null,
                    _resultInfo: null,
                    _order: ConfigManager.normalizeOrder(cell._order ?? cell.order, cellIndex) // Utiliser l'_order existant, l'order config, ou l'index
                };

                if (cell.type === 'source') {
                    newCell._isDragging = false;
                    newCell._loaded = false;
                    // Charger le fichier base64 si présent dans la config JSON
                    if (cell.fileBase64 && cell.fileName) {
                        newCell._fileName = cell.fileName;
                        // Créer un File object à partir du base64
                        const uint8Array = FileHandler.base64ToUint8Array(cell.fileBase64);
                        const blob = new Blob([uint8Array], { type: FileHandler.getMimeTypeFromFileName(cell.fileName) });
                        newCell._currentFile = new File([blob], cell.fileName, { type: blob.type });
                        // Marquer pour chargement différé
                        newCell._pendingFileLoad = true;
                    } else {
                        newCell._fileName = '';
                        newCell._currentFile = null;
                    }
                }


                if (cell.type === 'uiParameter') {
                    newCell._value = '';
                    newCell._options = [];
                    newCell._initialized = false;
                    newCell._paramError = null;
                }

                if (cell.type === 'publipostageWord') {
                    newCell._showParsedQuery = false;
                    newCell._showParsedQuery2 = false;
                    newCell._parseLevels = [];
                    newCell._parseLevels2 = [];
                    newCell._isDragging = false;
                    // Charger le template base64 si présent dans la config JSON
                    if (cell.fileBase64 && cell.fileName) {
                        newCell.docxTemplateBase64 = cell.fileBase64;
                        newCell.docxTemplateFileName = cell.fileName;
                    }
                }

                if (cell.type === 'pdfme') {
                    newCell._showParsedQuery = false;
                    newCell._parseLevels = [];
                }

                // Cellules avec SQL editor : ajouter le flag de vue parsée et showSqlEditorForClient par défaut
                if (['sqlRecursiveParse', 'table', 'iframe', 'sqlStat', 'perspective'].includes(cell.type)) {
                    newCell._showParsedQuery = false;
                    if (newCell.showSqlEditorForClient === undefined) {
                        newCell.showSqlEditorForClient = false;
                    }
                }

                if (cell.type === 'perspective') {
                    newCell._perspectiveReady = false;
                    newCell._perspectiveClient = null;
                    newCell._perspectiveTable = null;
                    newCell._arrowTable = null;
                }

                return newCell;
            };

            // Fonction récursive pour initialiser un groupe et ses enfants
            const initGroup = (group, groupIndex) => {
                const newGroup = {
                    _id: group.id || group._id || ConfigManager.generateGroupId(),
                    _type: group.type || 'core', // Migration automatique : groupes sans type => "core"
                    direction: group.direction || 'row',
                    style: group.style || '',
                    _order: ConfigManager.normalizeOrder(group._order ?? group.order, groupIndex), // Utiliser l'_order existant, l'order config, ou l'index
                    cells: (group.cells || []).map((cell, cellIndex) => initCell(cell, cellIndex)),
                    // Config de loop
                    loop: group.loop ? {
                        enabled: group.loop.enabled || false,
                        query: group.loop.query || '',
                        zip: group.loop.zip || false,
                        zipQuery: group.loop.zipQuery || ''
                    } : { enabled: false, query: '', zip: false, zipQuery: '' },
                    // Config accordion
                    accordion: group.accordion || false,
                    title: group.title || '',
                    accordionOpen: group.accordionOpen !== false // true par défaut
                };

                // Ajouter ifQuery si présent
                if (group.ifQuery) {
                    newGroup.ifQuery = group.ifQuery;
                    newGroup.ifQueryLanguageType = group.ifQueryLanguageType || 'sql';
                }

                // Récursivement initialiser les children avec leur _order
                if (group.children && group.children.length > 0) {
                    newGroup.children = group.children.map((child, childIndex) => {
                        const initializedChild = initGroup(child, childIndex);
                        initializedChild._order = ConfigManager.normalizeOrder(child._order ?? child.order, childIndex);
                        return initializedChild;
                    });
                }

                return newGroup;
            };

            // Initialiser les pages depuis la config
            let initPages = [];

            // Migration: si l'ancienne structure existe (groups au lieu de pages)
            if (config.job?.groups && !config.job?.pages) {
                const allGroups = (config.job.groups || []).map((group, groupIndex) => initGroup(group, groupIndex));
                const initGroups = allGroups.filter(g => g._type === 'core');
                const initLinkGroups = allGroups.filter(g => g._type === 'link');

                initPages = [{
                    _id: ConfigManager.generatePageId(),
                    name: 'Feuille 1',
                    groups: initGroups,
                    linkGroups: initLinkGroups,
                    autoExecuteWithoutSources: config.job?.autoExecuteWithoutSources === true
                }];
            } else {
                // Nouvelle structure avec pages
                initPages = (config.job?.pages || []).map((page, pageIndex) => {
                    const allGroups = (page.groups || []).map((group, groupIndex) => initGroup(group, groupIndex));
                    const initGroups = allGroups.filter(g => g._type === 'core');
                    const initLinkGroups = allGroups.filter(g => g._type === 'link');

                    return {
                        _id: page.id || ConfigManager.generatePageId(),
                        name: page.name || `Feuille ${pageIndex + 1}`,
                        groups: initGroups,
                        linkGroups: initLinkGroups,
                        autoExecuteWithoutSources: page.autoExecuteWithoutSources === true
                    };
                });
            }

            // Si aucune page n'existe, créer une page par défaut
            if (initPages.length === 0) {
                initPages = [{
                    _id: ConfigManager.generatePageId(),
                    name: 'Feuille 1',
                    groups: [],
                    linkGroups: [],
                    autoExecuteWithoutSources: false
                }];
            }

            // Mode développeur (true = affichage complet, false = mode utilisateur simplifié)
            const devMode = config.ui?.devMode !== false;

            // Affichage des paramètres avancés (navbar et boutons bottom-left)
            const displaySettings = config.ui?.displaySettings !== false;

            // Liste des thèmes daisyUI disponibles
            const availableThemes = [
                'light', 'dark', 'cupcake', 'bumblebee', 'emerald', 'corporate',
                'synthwave', 'retro', 'cyberpunk', 'valentine', 'halloween',
                'garden', 'forest', 'aqua', 'lofi', 'pastel', 'fantasy',
                'wireframe', 'black', 'luxury', 'dracula', 'cmyk', 'autumn',
                'business', 'acid', 'lemonade', 'night', 'coffee', 'winter',
                'dim', 'nord', 'sunset'
            ];

            // Gestion du thème (priorité: config > localStorage > light)
            const savedTheme = localStorage.getItem('sqljob-theme');
            const configTheme = config.ui?.theme;
            const currentTheme = configTheme || savedTheme || 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);

            // Moteur DB (priorité: config > localStorage > duckdb-wasm)
            const savedDbEngine = localStorage.getItem('sqljob-dbEngine');
            const configDbEngine = config.ui?.dbEngine;
            const initialDbEngine = configDbEngine || savedDbEngine || 'duckdb-wasm';
            console.log('🔧 DB Engine - config:', configDbEngine, '| localStorage:', savedDbEngine, '| final:', initialDbEngine);
            DuckDBManager.setEngine(initialDbEngine);

            // DAG (Directed Acyclic Graph) - rafraîchissement automatique des cellules dépendantes
            const initialDirectedAcyclicGraph = config.ui?.directedAcyclicGraph === true;

            return {
                pages: initPages,
                activePageIndex: 0,
                isLoading: false,
                status: '',
                statusType: '',
                devMode: devMode,
                displaySettings: displaySettings,
                availableThemes: availableThemes,
                currentTheme: currentTheme,
                dbEngine: initialDbEngine,
                showDbEngineModal: false,
